<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTZ SIGNAL AI - Core System Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .dashboard-container {
            width: 100%;
            max-width: 420px;
            background: #131824;
            border: 1px solid #1e2638;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #a855f7;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .header p {
            color: #94a3b8;
            font-size: 12px;
        }
        .section-title {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            margin-top: 15px;
        }
        .select-box, .btn-primary {
            width: 100%;
            background: #1a2234;
            border: 1px solid #2a3650;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .market-btn {
            background: #1a2234;
            border: 1px solid #2a3650;
            color: #94a3b8;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .market-btn.active {
            background: #7c3aed;
            border-color: #a855f7;
            color: #ffffff;
        }
        .timeframe-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        .tf-btn {
            background: #1a2234;
            border: 1px solid #2a3650;
            color: #94a3b8;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .tf-btn.active {
            background: #7c3aed;
            color: #fff;
            border-color: #a855f7;
        }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .btn-primary:active {
            opacity: 0.8;
        }
        .status-card {
            background: #0f141f;
            border: 1px solid #1e2638;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-top: 15px;
        }
        .status-pair {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .status-result {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .status-result.down { color: #ef4444; }
        .status-result.up { color: #22c55e; }
        .status-conf {
            font-size: 12px;
            color: #94a3b8;
        }
        #live-chart-container {
            margin-top: 15px;
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header">
        <h1>BTZ SIGNAL AI</h1>
        <p>Core System Dashboard</p>
    </div>

    <div class="section-title">Broker</div>
    <select class="select-box" id="broker-select">
        <option value="QUOTEX">QUOTEX</option>
        <option value="POCKETOPTION">POCKET OPTION</option>
    </select>

    <div class="section-title">Market Type</div>
    <div class="grid-2">
        <div class="market-btn active" onclick="setMarketType('OTC', this)">OTC</div>
        <div class="market-btn" onclick="setMarketType('REAL', this)">REAL MARKET</div>
    </div>

    <div class="section-title">Asset Pair</div>
    <select class="select-box" id="asset-select">
        <option value="EUR/USD
