<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Live Market Mirror</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f19; font-family: sans-serif; }
        .candle-container { display: flex; align-items: flex-end; height: 160px; padding: 5px; gap: 4px; }
        .candle { width: 14px; transition: all 0.3s ease; border-radius: 2px; }
        .green { background: #22c55e; box-shadow: 0 0 5px #22c55e; }
        .red { background: #ef4444; box-shadow: 0 0 5px #ef4444; }
    </style>
</head>
<body class="p-2">

<div class="max-w-md mx-auto bg-gray-900/80 border border-gray-700 rounded-xl p-4">
    <!-- Header -->
    <div class="flex justify-between text-xs font-bold text-gray-400 mb-4">
        <span>MARKET: REAL-TIME</span>
        <span id="clock" class="text-white">00:30</span>
    </div>

    <!-- Chart Mirror Area (15 Candles) -->
    <div id="chart" class="candle-container border-b border-gray-700"></div>

    <!-- Signal -->
    <div class="mt-4 text-center">
        <p id="signal" class="text-xl font-black text-yellow-400 uppercase tracking-widest">ANALYZING MARKET...</p>
    </div>
</div>

<script>
    const chart = document.getElementById('chart');
    const signalEl = document.getElementById('signal');
    const clockEl = document.getElementById('clock');
    
    // মার্কেটের প্যাটার্ন মিমিক করার জন্য একটি অ্যার
    let marketPattern = [true, true, false, true, false, false, true, true, true, false, true, false, true, false, true];

    function renderChart() {
        chart.innerHTML = '';
        marketPattern.forEach(isGreen => {
            const candle = document.createElement('div');
            const height = Math.floor(Math.random() * (120 - 40) + 40);
            candle.className = `candle ${isGreen ? 'green' : 'red'}`;
            candle.style.height = `${height}px`;
            chart.appendChild(candle);
        });
    }

    let timer = 30;
    function updateLoop() {
        timer--;
        clockEl.textContent = `00:${timer < 10 ? '0' + timer : timer}`;

        // প্যাটার্ন আপডেট লজিক (প্রতি ৩০ সেকেন্ডে একবার)
        if (timer <= 0) {
            timer = 30;
            // লাস্ট প্যাটার্ন সরায়ে নতুন একটা প্যাটার্ন যুক্ত করা
            marketPattern.shift();
            marketPattern.push(Math.random() > 0.45); // নতুন একটি ক্যান্ডেল যোগ হলো
            
            // সিগন্যাল প্রিডিকশন
            const lastCandle = marketPattern[marketPattern.length - 1];
            signalEl.textContent = lastCandle ? "PREDICTION: UP (GREEN)" : "PREDICTION: DOWN (RED)";
            signalEl.className = `text-xl font-black ${lastCandle ? 'text-green-500' : 'text-red-500'} uppercase tracking-widest`;
            renderChart();
        }
    }

    renderChart();
    setInterval(updateLoop, 1000);
</script>
</body>
</html>
