<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazi AI Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-sm glass-card p-5 rounded-2xl shadow-2xl space-y-4">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-lg font-black text-purple-400">Gazi AI Trader</h1>
            <p class="text-[9px] text-gray-400 uppercase tracking-widest">Core System Dashboard</p>
        </div>
        
        <!-- Broker Selection -->
        <div class="space-y-1">
            <label class="text-[10px] text-gray-400 font-bold block">BROKER</label>
            <select class="w-full bg-black border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                <option>QUOTEX</option>
                <option>POCKET OPTION</option>
            </select>
        </div>

        <!-- Market Type (OTC & Real Market) -->
        <div class="space-y-1">
            <label class="text-[10px] text-gray-400 font-bold block">MARKET TYPE</label>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="switchMarket('OTC')" id="btnOTC" class="bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition">OTC</button>
                <button type="button" onclick="switchMarket('REAL')" id="btnREAL" class="bg-black border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition">REAL MARKET</button>
            </div>
        </div>

        <!-- Asset Pair -->
        <div class="space-y-1">
            <label class="text-[10px] text-gray-400 font-bold block">ASSET PAIR</label>
            <select id="assetSelect" class="w-full bg-black border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-purple-500">
                <!-- Dynamically populated pairs -->
            </select>
        </div>

    </div>

    <script>
        const otcPairs = [
            "EUR/USD (OTC)", "GBP/USD (OTC)", "AUD/NZD (OTC)", "USD/JPY (OTC)", 
            "EUR/GBP (OTC)", "AUD/CAD (OTC)", "USD/CAD (OTC)", "NZD/USD (OTC)",
            "GOLD (OTC)", "SILVER (OTC)", "BITCOIN (OTC)"
        ];

        const realPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", 
            "USD/CAD", "EUR/GBP", "NZD/USD", "GBP/JPY"
        ];

        function loadPairs(marketType) {
            const assetSelect = document.getElementById('assetSelect');
            assetSelect.innerHTML = '';
            const pairs = marketType === 'OTC' ? otcPairs : realPairs;
            
            pairs.forEach(pair => {
                const opt = document.createElement('option');
                opt.value = pair;
                opt.textContent = pair;
                assetSelect.appendChild(opt);
            });
        }

        function switchMarket(type) {
            const btnOTC = document.getElementById('btnOTC');
            const btnREAL = document.getElementById('btnREAL');

            if (type === 'OTC') {
                btnOTC.className = "bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition";
                btnREAL.className = "bg-black border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition";
            } else {
                btnREAL.className = "bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition";
                btnOTC.className = "bg-black border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition";
            }
            loadPairs(type);
        }

        // Initial load
        loadPairs('OTC');
    </script>

</body>
</html>
