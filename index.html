<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazi AI Trader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
    </style>
</head>
<body class="p-5 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-sm bg-gray-900 border border-gray-800 p-5 rounded-2xl shadow-xl space-y-4">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-lg font-black text-purple-400">Gazi AI Trader</h1>
            <p class="text-[9px] text-gray-400 uppercase tracking-widest">Core System Dashboard</p>
        </div>
        
        <!-- Broker Selection -->
        <div>
            <label class="text-[10px] text-gray-400 font-bold block mb-1">BROKER</label>
            <select class="w-full bg-black border border-gray-700 rounded-xl p-2.5 text-xs text-white focus:outline-none">
                <option>QUOTEX</option>
                <option>POCKET OPTION</option>
            </select>
        </div>

        <!-- Market Type (OTC & Real Market) -->
        <div>
            <label class="text-[10px] text-gray-400 font-bold block mb-1">MARKET TYPE</label>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-purple-600 text-white py-2 rounded-xl text-xs font-bold">OTC</button>
                <button class="bg-black border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold">REAL MARKET</button>
            </div>
        </div>

    </div>

</body>
</html>
