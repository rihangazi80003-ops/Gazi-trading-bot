<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BTZ Signal AI - Pro Real-Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        
        /* কোটেক্স স্টাইল লাইভ চার্ট গ্রিড */
        .chart-grid { 
            position: relative; 
            height: 140px; 
            background: #05070d; 
            border: 1px solid rgba(255,255,255,0.05);
            display: flex; align-items: flex-end; justify-content: space-around;
            overflow: hidden; padding: 5px;
        }
        
        /* সুতার মতো হরিজেন্টাল দাগ (Price Lines) */
        .price-line {
            position: absolute; left: 0; right: 0;
            height: 1px; border-bottom: 1px dashed rgba(255,255,255,0.08);
            z-index: 1;
        }

        /* লাইভ প্রাইস টিকার (ডানপাশে ভাসমান) */
        .price-ticker {
            position: absolute; right: 5px; 
            background: #2563eb; color: #fff; font-size: 9px;
            padding: 1px 4px; border-radius: 2px; z-index: 20;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.5);
        }

        /* ক্যান্ডেল স্টাইল */
        .candle { width: 8px; transition: height 0.1s ease; }
        .wick { width: 1px; background: inherit; }
    </style>
</head>
<body class="p-3 flex justify-center items-center min-h-screen">

    <!-- Chart Container -->
    <div class="w-full max-w-sm glass-card p-3 rounded-xl border border-purple-500/30 shadow-2xl">
        <div class="flex justify-between items-center mb-2">
            <span class="text-[10px] font-bold text-gray-400">LIVE MARKET CHART</span>
            <span id="liveClock" class="text-[10px] font-mono text-green-400">14:42:03</span>
        </div>

        <div id="chartGrid" class="chart-grid">
            <div class="price-line" style="top: 25%;"></div>
            <div class="price-line" style="top: 50%;"></div>
            <div class="price-line" style="top: 75%;"></div>
            <div id="ticker" class="price-ticker" style="top: 48%;">1460.50</div>
        </div>
    </div>

    <script>
        const chartGrid = document.getElementById('chartGrid');
        let candles = [];
        let basePrice = 1460.50;

        function createCandles() {
            for (let i = 0; i < 15; i++) {
                let div = document.createElement('div');
                div.className = "flex flex-col items-center justify-end h-full";
                div.innerHTML = `<div class="wick h-2" style="background:#fff"></div><div class="candle bg-green-500" style="height:50px"></div><div class="wick h-2" style="background:#fff"></div>`;
                chartGrid.appendChild(div);
                candles.push(div);
            }
        }

        function updateChart() {
            // প্রাইস মুভমেন্ট ও টিকার আপডেট
            basePrice += (Math.random() - 0.5) * 0.2;
            const ticker = document.getElementById('ticker');
            ticker.textContent = basePrice.toFixed(2);
            ticker.style.top = (48 + (Math.random() - 0.5) * 20) + "%";

            // ক্যান্ডেল ফ্ল্যাকচুয়েশন
            candles.forEach((c, i) => {
                let candleBody = c.querySelector('.candle');
                let h = parseInt(candleBody.style.height);
                let newH = h + (Math.random() - 0.5) * 5;
                candleBody.style.height = Math.max(20, Math.min(100, newH)) + "px";
                candleBody.className = `candle ${Math.random() > 0.5 ? 'bg-green-500' : 'bg-red-500'}`;
            });
        }

        setInterval(updateChart, 500); // প্রতি আধা সেকেন্ডে মুভমেন্ট
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-GB', {timeZone: 'Asia/Dhaka'});
        }, 1000);

        createCandles();
    </script>
</body>
</html>
