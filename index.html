<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTZ SIGNAL AI - Core System Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lightweight TradingView Chart Library -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- App Container -->
    <div class="w-full max-w-sm glass-card rounded-2xl p-4 shadow-2xl space-y-3.5">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-xl font-black tracking-wider text-purple-400">BTZ SIGNAL AI</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-0.5">Core System Dashboard</p>
        </div>

        <!-- Broker Selection -->
        <div class="space-y-1">
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Broker</label>
            <select id="brokerSelect" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:border-purple-500">
                <option value="QUOTEX">QUOTEX</option>
                <option value="POCKETOPTION">POCKET OPTION</option>
            </select>
        </div>

        <!-- Market Type -->
        <div class="space-y-1">
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Market Type</label>
            <div class="grid grid-cols-2 gap-2">
                <button type="button" onclick="setMarketType('OTC')" id="btnOTC" class="market-btn bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition">OTC</button>
                <button type="button" onclick="setMarketType('REAL')" id="btnREAL" class="market-btn bg-gray-900 border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition">REAL MARKET</button>
            </div>
        </div>

        <!-- Asset Pair -->
        <div class="space-y-1">
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Asset Pair</label>
            <select id="assetSelect" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs font-medium focus:outline-none focus:border-purple-500">
                <option value="EUR/USD">EUR/USD (OTC)</option>
                <option value="GBP/USD">GBP/USD (OTC)</option>
                <option value="AUD/NZD">AUD/NZD (OTC)</option>
                <option value="USD/JPY">USD/JPY (OTC)</option>
            </select>
        </div>

        <!-- Timeframe -->
        <div class="space-y-1">
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider">Timeframe</label>
            <div class="grid grid-cols-4 gap-1.5">
                <button type="button" onclick="setTimeframe('1M')" class="tf-btn bg-purple-600 text-white py-1.5 rounded-lg text-xs font-bold">1 MIN</button>
                <button type="button" onclick="setTimeframe('2M')" class="tf-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">2 MIN</button>
                <button type="button" onclick="setTimeframe('3M')" class="tf-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">3 MIN</button>
                <button type="button" onclick="setTimeframe('5M')" class="tf-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">5 MIN</button>
            </div>
        </div>

        <!-- Generate Button -->
        <button onclick="generateSignal()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black py-3 rounded-xl shadow-lg transition uppercase tracking-wider text-xs">
            Generate AI Signal
        </button>

        <!-- Result Box -->
        <div id="resultBox" class="bg-black/60 border border-gray-800 rounded-xl p-3 text-center space-y-1">
            <p id="resStatusTime" class="text-[10px] text-gray-400 uppercase tracking-widest">STATUS (1 MIN)</p>
            <p id="resAsset" class="text-xs font-bold text-gray-300">EUR/USD (OTC)</p>
            <h2 id="resDirection" class="text-2xl font-black tracking-wider text-red-500">DOWN</h2>
            <p id="resConfidence" class="text-[11px] font-semibold text-gray-400">Confidence: 88%</p>
        </div>

        <!-- Live Chart Widget Section -->
        <div class="space-y-1.5 pt-2 border-t border-gray-800">
            <div class="flex justify-between items-center text-[10px] text-gray-400">
                <span class="font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> Live Chart Analysis</span>
            </div>
            <div id="chartContainer" class="w-full h-36 rounded-xl overflow-hidden border border-gray-800 bg-black/40"></div>
        </div>

    </div>

    <!-- Script Logic -->
    <script>
        let currentMarket = 'OTC';
        let currentTimeframe = '1M';

        function setMarketType(type) {
            currentMarket = type;
            document.getElementById('btnOTC').className = type === 'OTC' ? 'market-btn bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition' : 'market-btn bg-gray-900 border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition';
            document.getElementById('btnREAL').className = type === 'REAL' ? 'market-btn bg-purple-600 text-white py-2 rounded-xl text-xs font-bold transition' : 'market-btn bg-gray-900 border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold transition';
        }

        function setTimeframe(tf) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => {
                if(btn.innerText.includes(tf)) {
                    btn.className = 'tf-btn bg-purple-600 text-white py-1.5 rounded-lg text-xs font-bold';
                } else {
                    btn.className = 'tf-btn bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold';
                }
            });
        }

        function generateSignal() {
            const asset = document.getElementById('assetSelect').value;
            const resDirection = document.getElementById('resDirection');
            const resConfidence = document.getElementById('resConfidence');
            const resStatusTime = document.getElementById('resStatusTime');
            const resAsset = document.getElementById('resAsset');

            resStatusTime.innerText = `STATUS (${currentTimeframe})`;
            resAsset.innerText = `${asset} (${currentMarket})`;

            const score = Math.floor(Math.random() * 15) + 82; // 82 to 96
            const isUp = Math.random() > 0.5;

            if (isUp) {
                resDirection.innerText = "UP";
                resDirection.className = "text-2xl font-black tracking-wider text-green-500 animate-pulse";
            } else {
                resDirection.innerText = "DOWN";
                resDirection.className = "text-2xl font-black tracking-wider text-red-500 animate-pulse";
            }
            resConfidence.innerText = `Confidence: ${score}%`;
        }

        // Initialize Lightweight Chart Widget
        const chartContainer = document.getElementById('chartContainer');
        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: 144,
            layout: {
                background: { type: 'solid', color: 'transparent' },
                textColor: '#9ca3af',
            },
            grid: {
                vertLines: { color: 'rgba(255, 255, 255, 0.03)' },
                horzLines: { color: 'rgba(255, 255, 255, 0.03)' },
            },
            timeScale: { timeVisible: true, secondsVisible: true },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444', borderVisible: false, wickUpColor: '#22c55e', wickDownColor: '#ef4444',
        });

        const initialData = [];
        let currentTime = Math.floor(Date.now() / 1000) - 200 * 60;
        let lastClose = 1.0850;

        for (let i = 0; i < 80; i++) {
            const open = lastClose;
            const change = (Math.random() - 0.48) * 0.0010;
            const close = open + change;
            const high = Math.max(open, close) + Math.random() * 0.0005;
            const low = Math.min(open, close) - Math.random() * 0.0005;
            initialData.push({ time: currentTime, open, high, low, close });
            currentTime += 60;
            lastClose = close;
        }

        candlestickSeries.setData(initialData);

        setInterval(() => {
            const lastCandle = initialData[initialData.length - 1];
            lastCandle.close += (Math.random() - 0.48) * 0.0003;
            lastCandle.high = Math.max(lastCandle.high, lastCandle.close);
            lastCandle.low = Math.min(lastCandle.low, lastCandle.close);
            candlestickSeries.update(lastCandle);
        }, 1000);

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
        });
    </script>
</body>
</html>
