<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTZ SIGNAL AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0f19; color: white; font-family: sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen">

    <div class="w-full max-w-sm glass p-5 rounded-2xl shadow-2xl space-y-4">
        
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-xl font-black text-purple-400 tracking-wider">BTZ SIGNAL AI</h1>
            <p class="text-[10px] text-gray-400 uppercase tracking-widest mt-0.5">Core System Dashboard</p>
        </div>
        
        <!-- Broker -->
        <div>
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-1">Broker</label>
            <select class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs font-medium text-white focus:outline-none">
                <option>QUOTEX</option>
                <option>POCKET OPTION</option>
            </select>
        </div>

        <!-- Market Type -->
        <div>
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-1">Market Type</label>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-purple-600 text-white py-2 rounded-xl text-xs font-bold shadow-lg shadow-purple-900/30">OTC</button>
                <button class="bg-gray-900 border border-gray-700 text-gray-400 py-2 rounded-xl text-xs font-bold">REAL MARKET</button>
            </div>
        </div>

        <!-- Asset Pair -->
        <div>
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-1">Asset Pair</label>
            <select class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs font-medium text-white focus:outline-none">
                <option>EUR/USD (OTC)</option>
                <option>GBP/USD (OTC)</option>
                <option>AUD/NZD (OTC)</option>
            </select>
        </div>

        <!-- Timeframe -->
        <div>
            <label class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider block mb-1">Timeframe</label>
            <div class="grid grid-cols-4 gap-1.5">
                <button class="bg-purple-600 text-white py-1.5 rounded-lg text-xs font-bold">1 MIN</button>
                <button class="bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">2 MIN</button>
                <button class="bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">3 MIN</button>
                <button class="bg-gray-900 border border-gray-700 text-gray-400 py-1.5 rounded-lg text-xs font-bold">5 MIN</button>
            </div>
        </div>

        <!-- Generate Button -->
        <button class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-black py-3 rounded-xl uppercase tracking-wider text-xs shadow-lg">
            GENERATE AI SIGNAL
        </button>

        <!-- Status Result Box (As seen in screenshot) -->
        <div class="bg-black/60 border border-gray-800 rounded-xl p-3 text-center space-y-1">
            <p class="text-[10px] text-gray-400 uppercase tracking-widest">STATUS (1 MIN)</p>
            <p class="text-xs font-bold text-gray-300">EUR/USD (OTC)</p>
            <h2 class="text-2xl font-black text-red-500 tracking-wider">DOWN</h2>
            <p class="text-[11px] font-semibold text-gray-400">Confidence: 88%</p>
        </div>

    </div>

</body>
</html>
