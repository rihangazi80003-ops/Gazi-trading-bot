<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "/api/market?symbol=EUR%2FUSD&interval=1min";

const REFRESH_MS = 10000;


/* =====================================================
   ELEMENTS
===================================================== */

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =

  document.getElementById("trendStrength");

  document.getElementById("rangeState");

const updateTimeElement =
  document.getElementById("updateTime");


/* =====================================================
   CHART
===================================================== */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,

      layout:{
        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },

      grid:{
        vertLines:{
          color:
            "rgba(255,255,255,0.045)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.045)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",

        minimumWidth:72,

        autoScale:true,

        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{
        borderColor:"#263454",

        timeVisible:true,

        secondsVisible:false,

        barSpacing:7,

        minBarSpacing:3,

        rightOffset:3,

        fixLeftEdge:false,

        fixRightEdge:false
      },

      crosshair:{
        mode:
          LightweightCharts.CrosshairMode.Normal
      },

      handleScroll:{
        mouseWheel:true,
        pressedMouseMove:true
      },

      handleScale:{
        axisPressedMouseMove:true,
        mouseWheel:true,
        pinch:true
      }

    }
  );


/* =====================================================
   CANDLE SERIES
===================================================== */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a3",

    downColor:"#ff4f6d",

    borderUpColor:"#00d6a3",

    borderDownColor:"#ff4f6d",

    wickUpColor:"#00d6a3",

    wickDownColor:"#ff4f6d",

    priceFormat:{
      type:"price",
      precision:5,
      minMove:0.00001
    }

/* =====================================================
   RESPONSIVE
===================================================== */

function resizeChart(){

  chart.applyOptions({

    width:
      chartElement.clientWidth,

    height:
      chartElement.clientHeight

  });

}

window.addEventListener(
  "resize",
  resizeChart
);


/* =====================================================
   TIME NORMALIZATION
===================================================== */

function parseTime(value){

  if(!value){
    return null;
  }

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(
        value / 1000
      );

    }

    return Math.floor(value);
  }


  let text =
    String(value).trim();


  text =
    text.replace(" ","T");


  if(!text.endsWith("Z")){

    text += "Z";

  }


  const ms =
    Date.parse(text);


  if(!Number.isFinite(ms)){

    return null;

  }


  return Math.floor(
    ms / 1000
  );

}


/* =====================================================
   CANDLE NORMALIZATION
===================================================== */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){

    return [];

  }


  const result = [];


  for(const item of raw){

    const time =
      parseTime(
        item.time ??
        item.datetime ??
        item.timestamp
      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(
      !time ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){

      continue;

    }


    if(
      high < Math.max(open,close) ||
      low > Math.min(open,close) ||
      high < low
    ){

      continue;

    }


    result.push({

      time,
      open,
      high,
      low,
      close

    });

  }


  result.sort(
    (a,b)=>a.time-b.time
  );


  const unique = [];


  for(const candle of result){

    const previous =
      unique[
        unique.length-1
      ];


    if(
      previous &&
      previous.time === candle.time
    ){

      unique[
        unique.length-1
      ] = candle;

    }else{

      unique.push(candle);

    }

  }


  return unique;

}


/* =====================================================
   EMA
===================================================== */

function calculateEMA(
  values,
  period
){

  if(!values.length){

    return 0;

  }


  const multiplier =
    2 / (period + 1);


  let ema =
    values[0];


  for(
    let i=1;
    i<values.length;
    i++
  ){

    ema =
      (
        (values[i]-ema) *
        multiplier
      ) + ema;

  }


  return ema;

}


/* =====================================================
   RSI
===================================================== */

function calculateRSI(
  candles,
  period=14
){

  if(
    candles.length <= period
  ){

    return 50;

  }


  let gain=0;
  let loss=0;


  for(
    let i=1;
    i<=period;
    i++
  ){

    const diff =
      candles[i].close -
      candles[i-1].close;


    if(diff>=0){

      gain += diff;

    }else{

      loss += Math.abs(diff);

    }

  }


  let avgGain =
    gain/period;

  let avgLoss =
    loss/period;


  for(
    let i=period+1;
    i<candles.length;
    i++
  ){

    const diff =
      candles[i].close -
      candles[i-1].close;


    const currentGain =
      diff>0 ? diff : 0;


    const currentLoss =
      diff<0
        ? Math.abs(diff)
        : 0;


    avgGain =
      (
        avgGain*(period-1) +
        currentGain
      )/period;


    avgLoss =
      (
        avgLoss*(period-1) +
        currentLoss
      )/period;

  }


  if(avgLoss===0){

    return 100;

  }


  const rs =
    avgGain/avgLoss;


  return 100 -
    (100/(1+rs));

}


/* =====================================================
   ATR
===================================================== */

function calculateATR(
  candles,
  period=14
){

  if(
    candles.length < period+1
  ){

    return 0;

  }


  const trs=[];


  for(
    let i=1;
    i<candles.length;
    i++
  ){

    const current =
      candles[i];

    const previous =
      candles[i-1];


    const tr =
      Math.max(

        current.high -
        current.low,

        Math.abs(
          current.high -
          previous.close
        ),

        Math.abs(
          current.low -
          previous.close
        )

      );


    trs.push(tr);

  }


  if(trs.length<period){

    return 0;

  }


  let atr=0;


  for(
    let i=0;
    i<period;
    i++
  ){

    atr += trs[i];

  }


  atr /= period;


  for(
    let i=period;
    i<trs.length;
    i++
  ){

    atr =
      (
        atr*(period-1) +
        trs[i]
      )/period;

  }


  return atr;

}


/* =====================================================
   MACD
===================================================== */

function calculateMACD(
  candles
){

  const closes =
    candles.map(
      c=>c.close
    );


  if(closes.length<35){

    return{

      macd:0,
      signal:0,
      histogram:0

    };

  }


  const macdValues=[];


  for(
    let i=26;
    i<closes.length;
    i++
  ){

    const shortEMA =
      calculateEMA(
        closes.slice(0,i+1),
        12
      );


    const longEMA =
      calculateEMA(
        closes.slice(0,i+1),
        26
      );


    macdValues.push(
      shortEMA-longEMA
    );

  }


  const currentMACD =
    macdValues[
      macdValues.length-1
    ];


  const signal =
    calculateEMA(
      macdValues,
      9
    );


  return{

    macd:currentMACD,

    signal,

    histogram:
      currentMACD-signal

  };

}


/* =====================================================
   PRICE SLOPE
===================================================== */

function calculateSlope(
  candles,
  lookback=8
){

  if(
    candles.length <= lookback
  ){

    return 0;

  }


  const last =
    candles[
      candles.length-1
    ].close;


  const old =
    candles[
      candles.length-1-lookback
    ].close;


  return last-old;

}


/* =====================================================
   RANGE ANALYSIS
===================================================== */

function calculateRange(
  candles,
  lookback=20
){

  const data =
    candles.slice(
      Math.max(
        0,
        candles.length-lookback
      )
    );


  if(!data.length){

    return{

      high:0,
      low:0,
      width:0,
      position:50

    };

  }


  let high =
    -Infinity;

  let low =
    Infinity;


  for(const c of data){

    if(c.high>high){

      high=c.high;

    }

    if(c.low<low){

      low=c.low;

    }

  }


  const last =
    data[data.length-1].close;


  const width =
    high-low;


  let position=50;


  if(width>0){

    position =
      ((last-low)/width)*100;

  }


  return{

    high,
    low,
    width,
    position

  };

}


/* =====================================================
   CANDLE QUALITY
===================================================== */

function candleQuality(
  candle
){

  if(!candle){

    return{

      body:0,
      range:0,
      bodyRatio:0,
      direction:0

    };

  }


  const range =
    Math.max(
      candle.high-candle.low,
      0.00000001
    );


  const body =
    Math.abs(
      candle.close-candle.open
    );


  const bodyRatio =
    body/range;


  let direction=0;


  if(candle.close>candle.open){

    direction=1;

  }else if(
    candle.close<candle.open
  ){

    direction=-1;

  }


  return{

    body,
    range,
    bodyRatio,
    direction

  };

}


/* =====================================================
   MARKET REGIME ENGINE

   UP TREND
   DOWN TREND
   SIDEWAYS
===================================================== */

function detectMarketRegime(
  candles
){

  if(candles.length<50){

    return{

      mode:"WAIT",

      strength:0,

      emaTrend:"WAIT",

      rangeState:"WAIT",

      score:0

    };

  }


  const closes =
    candles.map(
      c=>c.close
    );


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const ema50 =
    calculateEMA(
      closes,
      50
    );


  const atr =
    calculateATR(
      candles,
      14
    );


  const slope =
    calculateSlope(
      candles,
      8
    );


  const range =
    calculateRange(
      candles,
      20
    );


  const separation =
    Math.abs(
      ema9-ema21
    );


  /*
    Normalize EMA separation
    against ATR.
  */

  let trendRatio=0;


  if(atr>0){

    trendRatio =
      separation/atr;

  }


  /*
    EMA structure
  */

  const bullishStructure =
    ema9>ema21 &&
    ema21>ema50;


  const bearishStructure =
    ema9<ema21 &&
    ema21<ema50;


  /*
    Slope direction
  */

  const bullishSlope =
    slope>atr*0.15;


  const bearishSlope =
    slope<-atr*0.15;


  /*
    Range compression

    Very small 20-candle range
    compared with ATR indicates
    consolidation.
  */

  const rangeCompression =
    atr>0 &&
    range.width <
    atr*8;


  /*
    Strong trend condition
  */

  const strongBull =
    bullishStructure &&
    bullishSlope &&
    trendRatio>=0.45;


  const strongBear =
    bearishStructure &&
    bearishSlope &&
    trendRatio>=0.45;


  /*
    Sideways condition

    Do NOT call alternating tiny
    candles a trend.
  */

  const sideways =
    (
      trendRatio<0.30 &&
      Math.abs(slope)<atr*0.45
    )
    ||
    (
      rangeCompression &&
      Math.abs(slope)<atr*0.60
    );


  let mode="SIDEWAYS";


  if(strongBull){

    mode="UP TREND";

  }else if(strongBear){

    mode="DOWN TREND";

  }else if(sideways){

    mode="SIDEWAYS";

  }else{

    mode =
      ema9>ema21
        ? "UP BIAS"
        : ema9<ema21
          ? "DOWN BIAS"
          : "SIDEWAYS";

  }


  let strength =
    Math.min(
      100,
      Math.round(
        Math.abs(trendRatio)*100
      )
    );


  if(mode==="SIDEWAYS"){

    strength =
      Math.min(
        strength,
        45
      );

  }


  return{

    mode,

    strength,

    emaTrend:
      ema9>ema21
        ? "UP"
        : ema9<ema21
          ? "DOWN"
          : "FLAT",

    rangeState:
      range.position<30
        ? "LOW ZONE"
        : range.position>70
          ? "HIGH ZONE"
          : "MID RANGE",

    ema9,
    ema21,
    ema50,
    atr,
    slope,
    range,
    trendRatio

  };

}


/* =====================================================
   NEXT CANDLE SIGNAL ENGINE
===================================================== */

function calculateSignal(
  candles
){

  if(candles.length<50){

    return{

      signal:"WAIT",

      confidence:50,

      rsi:50,

      emaTrend:"WAIT",

      macdTrend:"NEUTRAL",

      marketMode:"WAIT",

      trendStrength:0,

      rangeState:"WAIT"

    };

  }


  const closes =
    candles.map(
      c=>c.close
    );


  const last =
    candles[
      candles.length-1
    ];


  const previous =
    candles[
      candles.length-2
    ];


  const regime =
    detectMarketRegime(
      candles
    );


  const rsi =
    calculateRSI(
      candles,
      14
    );


  const macd =
    calculateMACD(
      candles
    );


  const quality =
    candleQuality(last);


  const previousQuality =
    candleQuality(previous);


  let bullScore=0;
  let bearScore=0;


  /* =================================================
     1. TREND STRUCTURE
  ================================================= */

  if(regime.mode==="UP TREND"){

    bullScore += 30;

  }


  if(regime.mode==="DOWN TREND"){

    bearScore += 30;

  }


  /* =================================================
     2. EMA
  ================================================= */

  if(regime.ema9>regime.ema21){

    bullScore += 18;

  }else if(
    regime.ema9<regime.ema21
  ){

    bearScore += 18;

  }


  /* =================================================
     3. EMA 50 FILTER
  ================================================= */

  if(
    regime.ema9>regime.ema50
  ){

    bullScore += 8;

  }else if(
    regime.ema9<regime.ema50
  ){

    bearScore += 8;

  }


  /* =================================================
     4. MACD
  ================================================= */

  if(macd.histogram>0){

    bullScore += 15;

  }else if(
    macd.histogram<0
  ){

    bearScore += 15;

  }


  /* =================================================
     5. RSI MOMENTUM

     Avoid blindly buying >70
     or selling <30.
  ================================================= */

  if(
    rsi>=52 &&
    rsi<=68
  ){

    bullScore += 12;

  }else if(
    rsi>=32 &&
    rsi<=48
  ){

    bearScore += 12;

  }


  /* =================================================
     6. CANDLE MOMENTUM
  ================================================= */

  if(
    quality.direction===1 &&
    quality.bodyRatio>=0.45
  ){

    bullScore += 10;

  }


  if(
    quality.direction===-1 &&
    quality.bodyRatio>=0.45
  ){

    bearScore += 10;

  }


  /* =================================================
     7. PREVIOUS CANDLE CONFIRMATION
  ================================================= */

  if(
    previousQuality.direction===1 &&
    quality.direction===1
  ){

    bullScore += 5;

  }


  if(
    previousQuality.direction===-1 &&
    quality.direction===-1
  ){

    bearScore += 5;

  }


  /* =================================================
     8. SLOPE
  ================================================= */

  if(
    regime.atr>0 &&
    regime.slope>
    regime.atr*0.15
  ){

    bullScore += 8;

  }


  if(
    regime.atr>0 &&
    regime.slope<
    -regime.atr*0.15
  ){

    bearScore += 8;

  }


  /* =================================================
     9. SIDEWAYS PROTECTION
  ================================================= */

  if(
    regime.mode==="SIDEWAYS"
  ){

    /*
      In a sideways market,
      normal trend-following
      signals are suppressed.
    */

    bullScore *= 0.55;
    bearScore *= 0.55;

  }


  /* =================================================
     RANGE EDGE LOGIC

     Only useful when sideways.
  ================================================= */

  if(
    regime.mode==="SIDEWAYS"
  ){

    const pos =
      regime.range.position;


    /*
      Near lower range:
      possible bounce UP
    */

    if(pos<=22){

      bullScore += 12;

    }


    /*
      Near upper range:
      possible rejection DOWN
    */

    if(pos>=78){

      bearScore += 12;

    }

  }


  const difference =
    Math.abs(
      bullScore-bearScore
    );


  let signal="WAIT";


  /*
    Stronger threshold in sideways
    market to avoid random signals.
  */

  if(
    regime.mode==="UP TREND" &&
    bullScore>=58 &&
    bullScore>bearScore+10
  ){

    signal="UP";

  }


  if(
    regime.mode==="DOWN TREND" &&
    bearScore>=58 &&
    bearScore>bullScore+10
  ){

    signal="DOWN";

  }


  /*
    In sideways market only
    allow range-edge signals
    when evidence is strong.
  */

  if(
    regime.mode==="SIDEWAYS"
  ){

    if(
      bullScore>=55 &&
      bullScore>bearScore+14 &&
      regime.range.position<=25
    ){

      signal="UP";

    }else if(
      bearScore>=55 &&
      bearScore>bullScore+14 &&
      regime.range.position>=75
    ){

      signal="DOWN";

    }else{

      signal="WAIT";

    }

  }


  /*
    BIAS zones require more evidence.
  */

  if(
    signal==="WAIT" &&
    regime.mode==="UP BIAS" &&
    bullScore>=70 &&
    bullScore>bearScore+20
  ){

    signal="UP";

  }


  if(
    signal==="WAIT" &&
    regime.mode==="DOWN BIAS" &&
    bearScore>=70 &&
    bearScore>bullScore+20
  ){

    signal="DOWN";

  }


  /* =================================================
     CONFIDENCE

     This is a model score,
     NOT guaranteed probability.
  ================================================= */

  let confidence =
    50 +
    difference*0.38;


  /*
    Sideways market gets
    confidence penalty.
  */

  if(
    regime.mode==="SIDEWAYS"
  ){

    confidence -= 8;

  }


  /*
    Weak trend penalty.
  */

  if(
    regime.strength<35
  ){

    confidence -= 5;

  }


  confidence =
    Math.round(
      Math.max(
        50,
        Math.min(
          88,
          confidence
        )
      )
    );


  /*
    WAIT should never pretend
    to be high confidence.
  */

  if(signal==="WAIT"){

    confidence =
      Math.min(
        confidence,
        64
      );

  }


  return{

    signal,

    confidence,

    rsi,

    emaTrend:
      regime.emaTrend,

    macdTrend:
      macd.histogram>0
        ? "BULLISH"
        : macd.histogram<0
          ? "BEARISH"
          : "NEUTRAL",

    marketMode:
      regime.mode,

    trendStrength:
      regime.strength,

    rangeState:
      regime.rangeState,

    bullScore,

    bearScore

  };

}


/* =====================================================
   UI UPDATE
===================================================== */

function updateUI(
  candles
){

  if(!candles.length){

    return;

  }


  const last =
    candles[
      candles.length-1
    ];


  const analysis =
    calculateSignal(
      candles
    );


  const price =
    last.close;


  /* PRICE */

  priceElement.textContent =
    price.toFixed(5);

  lastPriceElement.textContent =
    price.toFixed(5);


  /* RSI */

  rsiElement.textContent =
    analysis.rsi.toFixed(1);


  rsiElement.className =
    "card-value " +
    (
      analysis.rsi>=55
        ? "up"
        : analysis.rsi<=45
          ? "down"
          : "neutral"
    );


  /* EMA */

  emaElement.textContent =
    analysis.emaTrend;


  emaElement.className =
    "card-value " +
    (
      analysis.emaTrend==="UP"
        ? "up"
        : analysis.emaTrend==="DOWN"
          ? "down"
          : "neutral"
    );


  /* MACD */

  macdElement.textContent =
    analysis.macdTrend;


  macdElement.className =
    "card-value " +
    (
      analysis.macdTrend==="BULLISH"
        ? "up"
        : analysis.macdTrend==="BEARISH"
          ? "down"
          : "neutral"
    );


  /* MARKET MODE */

  marketModeElement.textContent =
    analysis.marketMode;


  marketModeElement.className =
    "card-value " +
    (
      analysis.marketMode==="UP TREND" ||
      analysis.marketMode==="UP BIAS"
        ? "up"
        : analysis.marketMode==="DOWN TREND" ||
          analysis.marketMode==="DOWN BIAS"
          ? "down"
          : "neutral"
    );


  /* SIGNAL */

  signalElement.textContent =
    analysis.signal;


  signalElement.className =
    "signal " +
    (
      analysis.signal==="UP"
        ? "up"
        : analysis.signal==="DOWN"
          ? "down"
          : "wait"
    );


  /* CONFIDENCE */

  confidenceElement.textContent =
    analysis.confidence+"%";


  /* NEXT CANDLE */

  nextCandleElement.textContent =
    analysis.signal;


  nextCandleElement.className =
    "detail-value " +
    (
      analysis.signal==="UP"
        ? "up"
        : analysis.signal==="DOWN"
          ? "down"
          : "neutral"
    );


  /* COUNT */

  candleCountElement.textContent =
    candles.length;


  /* TREND STRENGTH */

  trendStrengthElement.textContent =
    analysis.trendStrength+"%";


  trendStrengthElement.className =
    "detail-value " +
    (
      analysis.trendStrength>=55
        ? "up"
        : analysis.trendStrength<=35
          ? "neutral"
          : "neutral"
    );


  /* RANGE */

  rangeStateElement.textContent =
    analysis.rangeState;


  rangeStateElement.className =
    "detail-value neutral";


  /* UPDATE */

  updateTimeElement.textContent =
    new Date().toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );

}


/* =====================================================
   LOAD MARKET DATA
===================================================== */

let lastCandleKey="";


async function loadMarket(){

  try{

    statusElement.textContent =
      "Connecting • Twelve Data";


    const response =
      await fetch(
        API_URL,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP "+
        response.status
      );

    }


    const json =
      await response.json();


    let raw =
      json.candles;


    if(
      !raw &&
      Array.isArray(json.data)
    ){

      raw =
        json.data;

    }


    const candles =
      normalizeCandles(
        raw
      );


    if(!candles.length){

      throw new Error(
        "No valid candles"
      );

    }


    /* ===============================
       CHART
    =============================== */

    candleSeries.setData(
      candles
    );


    const last =
      candles[
        candles.length-1
      ];


    priceElement.textContent =
      last.close.toFixed(5);


    /*
      Only refit if candle dataset
      actually changed.
    */

    const candleKey =
      last.time+
      "_"+
      candles.length;


    if(
      candleKey!==lastCandleKey
    ){

      chart.timeScale()
        .fitContent();

      lastCandleKey =
        candleKey;

    }


    chart.timeScale()
      .applyOptions({

        rightOffset:3,

        barSpacing:
          window.innerWidth<600
            ? 6
            : 7

      });


    /* ===============================
       ANALYSIS
    =============================== */

    updateUI(
      candles
    );


    statusElement.textContent =
      "Connected • Twelve Data";


  }catch(error){

    console.error(
      "Market error:",
      error
    );


    statusElement.textContent =
      "Data connection error";

  }

}


/* =====================================================
   START ENGINE
===================================================== */

loadMarket();


setInterval(
  loadMarket,
  REFRESH_MS
);

</script>
