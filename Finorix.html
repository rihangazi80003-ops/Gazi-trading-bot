<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Finorix AI Market Pro</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:8px;
}

.app{
  width:100%;
  max-width:950px;
  margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:18px 18px 0 0;
  padding:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.title{
  font-size:20px;
  font-weight:700;
}

.market-row{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:7px;
  flex-wrap:wrap;
}

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#00e6a0;
  border-radius:50%;
  box-shadow:0 0 10px #00e6a0;
}

.market-select{
  background:#0b1224;
  color:#00e6a0;
  border:1px solid #263454;
  border-radius:8px;
  padding:6px 9px;
  font-size:13px;
  font-weight:bold;
  outline:none;
  max-width:190px;
}

.market-type{
  background:#182343;
  color:#fff;
  border:1px solid #263454;
  border-radius:8px;
  padding:6px 8px;
  font-size:11px;
  font-weight:bold;
  outline:none;
}

.live-text{
  color:#00e6a0;
  font-size:11px;
  font-weight:bold;
}

.timeframe{
  background:#182343;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap;
}

/* =========================================================
   CHART
========================================================= */

.chart-box{
  position:relative;
  width:100%;
  height:480px;
  background:#080c17;
  border-left:1px solid #28365e;
  border-right:1px solid #28365e;
  overflow:hidden;
}

#chart{
  width:100%;
  height:100%;
}

/* connection status */

.status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:20;
  background:rgba(0,0,0,.68);
  padding:7px 10px;
  border-radius:8px;
  font-size:11px;
}

/* =========================================================
   ADVANCE MARKER
========================================================= */

.advance-line{
  position:absolute;
  top:0;
  bottom:0;
  right:15%;
  border-left:2px dashed rgba(255,255,255,.58);
  pointer-events:none;
  z-index:5;
}

.advance-label{
  position:absolute;
  top:19px;
  right:calc(15% - 30px);
  font-size:12px;
  font-weight:bold;
  color:#fff;
  z-index:6;
  pointer-events:none;
}

/* =========================================================
   CURRENT PRICE
========================================================= */

.price{
  position:absolute;
  right:6px;
  top:45%;
  background:#168cff;
  padding:7px 10px;
  border-radius:7px;
  font-weight:bold;
  font-size:13px;
  z-index:12;
}

/* =========================================================
   RUNNING CANDLE TIMER
========================================================= */

.running-timer{
  position:absolute;

  /*
    IMPORTANT:
    Timer stays inside the running candle area.
    It is NOT placed above the candle.
  */

  z-index:15;

  transform:translateY(-50%);

  background:rgba(5,8,17,.88);

  border:1px solid rgba(255,255,255,.35);

  border-radius:6px;

  padding:3px 6px;

  min-width:31px;

  text-align:center;

  font-size:11px;

  line-height:16px;

  font-weight:bold;

  color:#ffffff;

  pointer-events:none;

  box-shadow:0 2px 8px rgba(0,0,0,.35);

  display:none;
}

/*
  Small indicator attached to timer.
*/

.running-timer::before{
  content:"";

  position:absolute;

  left:-4px;

  top:50%;

  width:7px;

  height:7px;

  transform:
    translateY(-50%)
    rotate(45deg);

  background:#050811;

  border-left:1px solid rgba(255,255,255,.35);

  border-bottom:1px solid rgba(255,255,255,.35);
}

/* =========================================================
   SIGNAL TARGET BADGE
========================================================= */

.signal-target{
  position:absolute;

  left:50%;

  bottom:10px;

  transform:translateX(-50%);

  z-index:18;

  background:rgba(8,12,23,.92);

  border:1px solid #33446f;

  border-radius:10px;

  padding:6px 12px;

  text-align:center;

  font-size:11px;

  color:#b8c3d9;

  pointer-events:none;
}

.signal-target strong{
  color:#fff;
  font-size:12px;
}

/* =========================================================
   BOTTOM SIGNAL
========================================================= */

.bottom{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.signal-title,
.confidence-title{
  font-size:12px;
  color:#9ba4b7;
}

.signal{
  margin-top:5px;
  font-size:28px;
  font-weight:bold;
}

.confidence{
  margin-top:5px;
  color:#ffd21c;
  font-size:27px;
  font-weight:bold;
}

/* =========================================================
   ANALYSIS
========================================================= */

.analysis{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:0 0 18px 18px;
  padding:15px;
}

.analysis-title{
  font-size:15px;
  color:#aeb8cc;
  margin-bottom:12px;
}

.analysis-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #263454;
  background:#080c19;
  border-radius:12px;
  padding:13px 8px;
  text-align:center;
}

.card-title{
  font-size:11px;
  color:#8f99ae;
}

.card-value{
  margin-top:7px;
  font-size:16px;
  font-weight:bold;
}

/* =========================================================
   INFO
========================================================= */

.info{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-card{
  background:#080c19;
  border:1px solid #263454;
  border-radius:12px;
  padding:12px;
}

.info-label{
  color:#8994aa;
  font-size:11px;
}

.info-value{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

/* =========================================================
   COLORS
========================================================= */

.up{
  color:#00e6a0 !important;
}

.down{
  color:#ff536d !important;
}

.neutral{
  color:#ffd21c !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  body{
    padding:0;
  }

  .app{
    max-width:none;
  }

  .header{
    border-radius:0;
    padding:12px;
  }

  .title{
    font-size:17px;
  }

  .market-select{
    max-width:145px;
  }

  .timeframe{
    padding:9px 12px;
    font-size:12px;
  }

  .chart-box{
    height:470px;
    border-left:0;
    border-right:0;
  }

  .bottom{
    padding:14px;
  }

  .analysis{
    border-radius:0;
  }

  .analysis-grid{
    gap:7px;
  }

  .card{
    padding:11px 5px;
  }

  .card-value{
    font-size:14px;
  }

  .running-timer{
    font-size:10px;
    min-width:29px;
    padding:2px 5px;
  }

}

@media(max-width:380px){

  .chart-box{
    height:430px;
  }

  .title{
    font-size:16px;
  }

  .confidence,
  .signal{
    font-size:24px;
  }

}

</style>

</head>

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   FULL FRONTEND ENGINE
========================================================= */


/* =========================================================
   CONFIG
========================================================= */

const INTERVAL = "1min";

const REFRESH_MS = 10000;

const VISIBLE_CANDLES = 14;


/*
  Real-market pairs.

  These are normal Twelve Data symbols.
*/

const REAL_MARKETS = [

  "EUR/USD",
  "GBP/USD",
  "USD/JPY",
  "USD/CHF",
  "AUD/USD",
  "USD/CAD",
  "NZD/USD",
  "EUR/GBP",
  "EUR/JPY",
  "GBP/JPY",
  "EUR/CHF",
  "AUD/JPY",
  "GBP/CHF",
  "USD/SGD"

];


/*
  OTC list.

  IMPORTANT:
  These names can be displayed in the UI,
  but Twelve Data does NOT automatically
  provide Quotex OTC prices.

  Therefore an OTC API/feed must eventually
  be connected to make these live.
*/

const OTC_MARKETS = [

  "EUR/USD OTC",
  "GBP/USD OTC",
  "USD/JPY OTC",
  "USD/CHF OTC",
  "AUD/USD OTC",
  "USD/CAD OTC",
  "NZD/USD OTC",
  "EUR/JPY OTC",
  "GBP/JPY OTC"

];


/* =========================================================
   STORAGE KEYS
========================================================= */

const STORAGE_MARKET =
  "finorix_selected_market";

const STORAGE_TYPE =
  "finorix_selected_market_type";


/* =========================================================
   ELEMENTS
========================================================= */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");

const marketSelect =
  document.getElementById("marketSelect");

const marketType =
  document.getElementById("marketType");

const runningTimer =
  document.getElementById("runningTimer");

const signalTarget =
  document.getElementById("signalTarget");


/* =========================================================
   MARKET SELECTION
========================================================= */

function getSavedMarketType(){

  try{

    const value =
      localStorage.getItem(
        STORAGE_TYPE
      );

    return value === "OTC"
      ? "OTC"
      : "REAL";

  }catch{

    return "REAL";
  }
}


function getSavedMarket(){

  try{

    return localStorage.getItem(
      STORAGE_MARKET
    ) || "EUR/USD";

  }catch{

    return "EUR/USD";
  }
}


function saveMarket(){

  try{

    localStorage.setItem(
      STORAGE_MARKET,
      marketSelect.value
    );

    localStorage.setItem(
      STORAGE_TYPE,
      marketType.value
    );

  }catch(error){

    console.warn(
      "Storage unavailable:",
      error
    );
  }
}


/* =========================================================
   POPULATE MARKET LIST
========================================================= */

function populateMarkets(){

  const type =
    marketType.value;

  const markets =
    type === "OTC"
      ? OTC_MARKETS
      : REAL_MARKETS;


  const saved =
    getSavedMarket();


  marketSelect.innerHTML = "";


  markets.forEach(
    symbol => {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        symbol;

      option.textContent =
        symbol;

      marketSelect.appendChild(
        option
      );
    }
  );


  /*
    Keep saved market if available.
  */

  const matching =
    Array.from(
      marketSelect.options
    ).find(
      option =>
        option.value === saved
    );


  if(matching){

    marketSelect.value =
      saved;

  }else{

    marketSelect.selectedIndex =
      0;

  }

}


/* =========================================================
   INITIAL MARKET STATE
========================================================= */

marketType.value =
  getSavedMarketType();

populateMarkets();


/* =========================================================
   CURRENT SYMBOL
========================================================= */

function getCurrentSymbol(){

  return marketSelect.value ||
    "EUR/USD";
}


/* =========================================================
   API URL
========================================================= */

function buildApiURL(){

  const symbol =
    getCurrentSymbol();


  /*
    For REAL markets this goes
    directly to the current API.

    For OTC the API must understand
    the OTC symbol or provide an
    appropriate OTC feed.
  */

  return (
    "/api/market?symbol=" +
    encodeURIComponent(symbol) +
    "&interval=" +
    INTERVAL
  );

}


/* =========================================================
   MARKET CHANGE
========================================================= */

marketType.addEventListener(
  "change",
  () => {

    populateMarkets();

    saveMarket();

    currentCandles = [];

    lastApiTimestamp = null;

    loadMarket(true);

  }
);


marketSelect.addEventListener(
  "change",
  () => {

    saveMarket();

    currentCandles = [];

    lastApiTimestamp = null;

    loadMarket(true);

  }
);


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{

        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"

      },

      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,

      grid:{

        vertLines:{
          color:
            "rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.06)"
        }

      },

      rightPriceScale:{

        borderColor:
          "#263454",

        scaleMargins:{

          top:0.08,

          bottom:0.12

        }

      },

      timeScale:{

        borderColor:
          "#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:3,

        barSpacing:15,

        minBarSpacing:8

      },

      crosshair:{

        mode:
          LightweightCharts
            .CrosshairMode
            .Normal

      }

    }
  );


/* =========================================================
   CANDLE SERIES
========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a0",

    downColor:"#ff536d",

    borderUpColor:"#00d6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00d6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true

  });


/* =========================================================
   STATE
========================================================= */

let currentCandles = [];

let lastApiTimestamp = null;

let latestApiPrice = null;

let currentSignal = "WAIT";

let currentTargetTimestamp = null;


/* =========================================================
   TIME NORMALIZATION
========================================================= */

function normalizeTime(value){

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(
        value / 1000
      );

    }

    return Math.floor(value);

  }


  if(!value){

    return null;
  }


  const raw =
    String(value).trim();


  /*
    ISO / normal datetime
  */

  let date =
    new Date(raw);


  if(
    isNaN(
      date.getTime()
    )
  ){

    /*
      API format:

      YYYY-MM-DD HH:mm:ss
    */

    if(
      /^\d{4}-\d{2}-\d{2}
       \s\d{2}:\d{2}:\d{2}$/.test(raw)
    ){

      date =
        new Date(
          raw.replace(
            " ",
            "T"
          ) + "Z"
        );

    }

  }


  if(
    isNaN(
      date.getTime()
    )
  ){

    return null;

  }


  return Math.floor(
    date.getTime() / 1000
  );

}


/* =========================================================
   NORMALIZE CANDLES
========================================================= */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){

    return [];

  }


  const result = [];


  for(
    const item of raw
  ){

    if(!item){

      continue;

    }


    const time =
      normalizeTime(
        item.time ??
        item.timestamp ??
        item.datetime
      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(
      !time ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){

      continue;

    }


    if(
      high < Math.max(
        open,
        close
      )
    ){

      continue;

    }


    if(
      low > Math.min(
        open,
        close
      )
    ){

      continue;

    }


    result.push({

      time,

      open,

      high,

      low,

      close

    });

  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Remove duplicate timestamps.
  */

  const unique = [];


  for(
    const candle of result
  ){

    const last =
      unique[
        unique.length - 1
      ];


    if(
      last &&
      last.time === candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(
        candle
      );

    }

  }


  return unique;

}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
  values,
  period
){

  if(
    values.length <
    period
  ){

    return null;

  }


  const multiplier =
    2 /
    (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema +=
      values[i];

  }


  ema /=
    period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] - ema
      ) *
      multiplier +
      ema;

  }


  return ema;

}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(
    values.length <= period
  ){

    return null;

  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    if(change >= 0){

      gains +=
        change;

    }else{

      losses +=
        Math.abs(change);

    }

  }


  let avgGain =
    gains / period;


  let avgLoss =
    losses / period;


  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =
      (
        avgGain *
        (period - 1) +
        gain
      ) /
      period;


    avgLoss =
      (
        avgLoss *
        (period - 1) +
        loss
      ) /
      period;

  }


  if(
    avgLoss === 0
  ){

    return 100;

  }


  const rs =
    avgGain /
    avgLoss;


  return (
    100 -
    100 /
    (1 + rs)
  );

}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(
  values
){

  if(
    values.length < 35
  ){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const macd =
    ema12 -
    ema26;


  const previous =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD =
    null;


  if(
    previous.length >= 35
  ){

    const p12 =
      calculateEMA(
        previous,
        12
      );


    const p26 =
      calculateEMA(
        previous,
        26
      );


    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 -
        p26;

    }

  }


  const histogram =
    previousMACD === null
      ? 0
      : macd -
        previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram

  };

}


/* =========================================================
   SIGNAL ENGINE
========================================================= */

function calculateSignal(
  candles
){

  if(
    candles.length < 35
  ){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"

    };

  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(
      ema9 > ema21
    ){

      emaTrend =
        "UP";

      score += 2;

    }else if(
      ema9 < ema21
    ){

      emaTrend =
        "DOWN";

      score -= 2;

    }

  }


  if(
    rsi !== null
  ){

    if(
      rsi < 30
    ){

      score += 1;

    }else if(
      rsi > 70
    ){

      score -= 1;

    }else if(
      rsi > 50
    ){

      score += 0.5;

    }else{

      score -= 0.5;

    }

  }


  let macdTrend =
    "NEUTRAL";


  if(
    macd.macd !== null
  ){

    if(
      macd.histogram > 0
    ){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(
      macd.histogram < 0
    ){

      macdTrend =
        "BEARISH";

      score -= 2;

    }

  }


  if(
    last > previous
  ){

    score += 0.5;

  }else if(
    last < previous
  ){

    score -= 0.5;

  }


  let signal =
    "WAIT";


  if(
    score >= 2
  ){

    signal =
      "UP";

  }else if(
    score <= -2
  ){

    signal =
      "DOWN";

  }


  let confidence =
    50 +
    Math.abs(score) *
    8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          confidence
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd

  };

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(
  timestamp
){

  if(
    !Number.isFinite(
      timestamp
    )
  ){

    return "--:--";

  }


  const date =
    new Date(
      timestamp * 1000
    );


  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );

}


/* =========================================================
   UPDATE SIGNAL UI
========================================================= */

function setSignalUI(
  result,
  targetTimestamp
){

  currentSignal =
    result.signal;


  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.signal === "UP"
  ){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(
    result.signal === "DOWN"
  ){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );

  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence +
        "%"
      : "--%";


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.rsi !== null
  ){

    if(
      result.rsi > 70
    ){

      rsiElement.classList.add(
        "down"
      );

    }else if(
      result.rsi < 30
    ){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );

    }

  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.emaTrend === "UP"
  ){

    emaElement.classList.add(
      "up"
    );

  }else if(
    result.emaTrend === "DOWN"
  ){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );

  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.macdTrend ===
    "BULLISH"
  ){

    macdElement.classList.add(
      "up"
    );

  }else if(
    result.macdTrend ===
    "BEARISH"
  ){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );

  }


  nextCandleElement.textContent =
    result.signal;


  /*
    IMPORTANT:
    Signal belongs to NEXT candle.

    Current candle timestamp + 60 seconds.
  */

  if(
    Number.isFinite(
      targetTimestamp
    )
  ){

    currentTargetTimestamp =
      targetTimestamp;


    signalTarget.innerHTML =
      "TARGET CANDLE • " +
      "<strong>" +
      formatTime(
        targetTimestamp
      ) +
      " " +
      result.signal +
      "</strong>";

  }else{

    signalTarget.innerHTML =
      "TARGET: <strong>--:--</strong>";

  }

}


/* =========================================================
   KEEP 12–15 CANDLES VISIBLE
========================================================= */

function focusRecentCandles(
  candles
){

  if(
    candles.length === 0
  ){

    return;

  }


  const total =
    candles.length;


  const visible =
    Math.min(
      VISIBLE_CANDLES,
      total
    );


  const fromIndex =
    Math.max(
      0,
      total -
      visible
    );


  const from =
    candles[
      fromIndex
    ].time;


  const last =
    candles[
      total - 1
    ].time;


  /*
    Add a little space to the right
    for the running candle/timer.
  */

  const right =
    last +
    60 * 2;


  chart.timeScale()
    .setVisibleRange({

      from,

      to:right

    });

}


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(
  force = false
){

  const requestedSymbol =
    getCurrentSymbol();


  try{

    statusElement.textContent =
      "Loading " +
      requestedSymbol +
      "...";


    const response =
      await fetch(
        buildApiURL(),
        {
          cache:"no-store",
          headers:{
            "Cache-Control":
              "no-cache"
          }
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      Prevent an old request from
      overwriting a newly selected pair.
    */

    if(
      requestedSymbol !==
      getCurrentSymbol()
    ){

      return;

    }


    let rawCandles = [];


    if(
      Array.isArray(data)
    ){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;

    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(
      candles.length < 35
    ){

      throw new Error(
        "Not enough valid candles"
      );

    }


    currentCandles =
      candles;


    /*
      API timestamp is the authoritative
      candle timestamp.

      Do NOT replace it with Date.now().
    */

    const apiLatestTimestamp =
      Number(
        data?.market
          ?.latestTimestamp
      );


    if(
      Number.isFinite(
        apiLatestTimestamp
      )
    ){

      lastApiTimestamp =
        apiLatestTimestamp;

    }else{

      lastApiTimestamp =
        candles[
          candles.length - 1
        ].time;

    }


    const latest =
      candles[
        candles.length - 1
      ];


    latestApiPrice =
      Number(
        data?.market
          ?.latestPrice
      );


    if(
      !Number.isFinite(
        latestApiPrice
      )
    ){

      latestApiPrice =
        latest.close;

    }


    /* =====================================================
       CHART DATA
    ===================================================== */

    candleSeries.setData(
      candles
    );


    /*
      Do not fit entire 150 candles.

      Keep recent candles large.
    */

    focusRecentCandles(
      candles
    );


    /* =====================================================
       PRICE
    ===================================================== */

    const price =
      latestApiPrice;


    priceElement.textContent =
      Number(price)
        .toFixed(5);


    lastPriceElement.textContent =
      Number(price)
        .toFixed(5);


    candleCountElement.textContent =
      candles.length;


    /* =====================================================
       SIGNAL
    ===================================================== */

    const result =
      calculateSignal(
        candles
      );


    /*
      The signal is for the NEXT
      one-minute candle.

      Therefore target =
      latest candle + 60 seconds.
    */

    const targetTimestamp =
      last.time +
      60;


    setSignalUI(
      result,
      targetTimestamp
    );


    /* =====================================================
       MARKET STATUS
    ===================================================== */

    const ageSeconds =
      Number(
        data?.market
          ?.ageSeconds
      );


    const stale =
      data?.market
        ?.isStale === true;


    const quality =
      data?.market
        ?.dataQuality ||
      "OK";


    if(
      stale
    ){

      statusElement.textContent =
        requestedSymbol +
        " • FEED STALE";

    }else if(
      quality === "FLAT"
    ){

      statusElement.textContent =
        requestedSymbol +
        " • FLAT";

    }else if(
      Number.isFinite(
        ageSeconds
      ) &&
      ageSeconds > 90
    ){

      /*
        Important:
        This tells us the feed itself
        is behind.

        We do NOT fake live prices.
      */

      statusElement.textContent =
        requestedSymbol +
        " • FEED +" +
        Math.round(
          ageSeconds
        ) +
        "s";

    }else{

      statusElement.textContent =
        requestedSymbol +
        " • LIVE";

    }


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();


  }catch(error){

    console.error(
      "Finorix Market Error:",
      error
    );


    statusElement.textContent =
      "Connection error";


    /*
      Do not destroy the previous
      valid chart/signal on a temporary
      network failure.
    */

    if(
      !currentCandles.length
    ){

      signalElement.textContent =
        "WAIT";

      confidenceElement.textContent =
        "--%";

    }

  }

}


/* =========================================================
   RUNNING CANDLE TIMER
========================================================= */

function getRunningCandleState(){

  /*
    Candle slots are exactly 60 seconds.

    This calculates the current
    minute slot from the browser clock.
  */

  const nowMs =
    Date.now();


  const currentSlot =
    Math.floor(
      nowMs / 60000
    ) *
    60;


  const secondsInto =
    Math.floor(
      (
        nowMs / 1000
      ) -
      currentSlot
    );


  const remaining =
    60 -
    secondsInto;


  return {

    currentSlot,

    secondsInto,

    remaining

  };

}


/* =========================================================
   TIMER POSITION
========================================================= */

function updateRunningTimer(){

  if(
    !currentCandles.length
  ){

    runningTimer.style.display =
      "none";

    return;

  }


  const state =
    getRunningCandleState();


  /*
    Current API candle may be behind
    the browser clock.

    We only show the timer when the
    API's latest candle is close enough
    to the current market slot.

    This prevents a fake timer from
    pretending old Twelve Data is live.
  */

  const latest =
    currentCandles[
      currentCandles.length - 1
    ];


  const latestTime =
    latest.time;


  const currentSlot =
    state.currentSlot;


  const difference =
    currentSlot -
    latestTime;


  /*
    If feed is more than one candle behind,
    timer is hidden rather than misleading.
  */

  if(
    difference > 120 ||
    difference < -120
  ){

    runningTimer.style.display =
      "none";

    return;

  }


  /*
    Show remaining seconds.
  */

  runningTimer.textContent =
    String(
      state.secondsInto
    ).padStart(
      2,
      "0"
    );


  runningTimer.style.display =
    "block";


  /*
    ---------------------------------------------------------
    POSITIONING

    The timer is intentionally placed:

    1. slightly RIGHT of the running candle
    2. vertically at the candle's BODY/WICK area
    3. NOT above the candle
    4. NOT in a separate top box
    ---------------------------------------------------------
  */


  const x =
    chart.timeScale()
      .timeToCoordinate(
        latestTime
      );


  if(
    x === null ||
    !Number.isFinite(x)
  ){

    runningTimer.style.display =
      "none";

    return;

  }


  /*
    Get current candle close
    as approximate vertical anchor.
  */

  const y =
    candleSeries.priceToCoordinate(
      latest.close
    );


  if(
    y === null ||
    !Number.isFinite(y)
  ){

    runningTimer.style.display =
      "none";

    return;

  }


  /*
    Small right offset.

    This is the important adjustment
    requested by the user.
  */

  const rightOffset =
    17;


  runningTimer.style.left =
    (
      x +
      rightOffset
    ) +
    "px";


  runningTimer.style.top =
    y +
    "px";

}


/* =========================================================
   UPDATE TARGET TIMER
========================================================= */

function updateTargetTime(){

  if(
    !Number.isFinite(
      currentTargetTimestamp
    )
  ){

    return;

  }


  signalTarget.innerHTML =
    "TARGET CANDLE • " +
    "<strong>" +
    formatTime(
      currentTargetTimestamp
    ) +
    " " +
    currentSignal +
    "</strong>";

}


/* =========================================================
   RESPONSIVE CHART
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;


  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height

    });


    /*
      Recalculate timer position
      after resize.
    */

    requestAnimationFrame(
      updateRunningTimer
    );

  }

}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   CHART MOVEMENT
========================================================= */

chart.timeScale()
  .subscribeVisibleTimeRangeChange(
    () => {

      requestAnimationFrame(
        updateRunningTimer
      );

    }
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMarket(true);


/* =========================================================
   MARKET REFRESH
========================================================= */

setInterval(
  () => {

    loadMarket(false);

  },
  REFRESH_MS
);


/* =========================================================
   ONE-SECOND TIMER
========================================================= */

setInterval(
  () => {

    updateRunningTimer();

    updateTargetTime();

  },
  1000
);


/* =========================================================
   IMMEDIATE TIMER
========================================================= */

updateRunningTimer();


</script>
