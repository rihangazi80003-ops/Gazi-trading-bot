<head>

<title>Finorix AI Market Pro</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:8px;
}

.app{
  width:100%;
  max-width:950px;
  margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:18px 18px 0 0;
  padding:15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:12px;
}

.title{
  font-size:20px;
  font-weight:700;
}

.market{
  margin-top:7px;
  font-size:14px;
  color:#00e6a0;
}

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#00e6a0;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 10px #00e6a0;
}

.market-controls{
  display:flex;
  align-items:center;
  gap:7px;
}

.market-select{
  background:#182343;
  color:#fff;
  border:1px solid #334572;
  border-radius:10px;
  padding:10px 12px;
  font-size:13px;
  font-weight:bold;
  outline:none;
}

.timeframe{
  background:#182343;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}

/* =========================================================
   CHART
========================================================= */

.chart-box{
  position:relative;
  width:100%;
  height:480px;
  background:#080c17;
  border-left:1px solid #28365e;
  border-right:1px solid #28365e;
  overflow:hidden;
}

#chart{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:20;

  background:rgba(0,0,0,.65);
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
}

/* =========================================================
   ADVANCE LINE
========================================================= */

.advance-line{
  position:absolute;
  top:0;
  bottom:0;
  right:17%;

  border-left:2px dashed rgba(255,255,255,.55);

  pointer-events:none;
  z-index:5;
}

.advance-label{
  position:absolute;
  top:20px;
  right:calc(17% - 38px);

  font-size:13px;
  font-weight:bold;
  color:#fff;

  z-index:6;
  pointer-events:none;
}

/* =========================================================
   PRICE
========================================================= */

.price{
  position:absolute;
  right:7px;
  top:45%;

  background:#168cff;
  padding:7px 10px;
  border-radius:7px;

  font-weight:bold;
  font-size:13px;

  z-index:20;
}

/* =========================================================
   RUNNING CANDLE TIMER
========================================================= */

.candle-timer{
  position:absolute;

  z-index:30;
  pointer-events:none;

  transform:translate(8px,-50%);

  background:rgba(5,7,13,.88);

  border:1px solid rgba(255,255,255,.18);
  border-radius:6px;

  padding:3px 6px;

  font-size:11px;
  line-height:1;
  font-weight:bold;

  color:#fff;
  white-space:nowrap;

  box-shadow:0 2px 8px rgba(0,0,0,.35);

  display:none;
}

/* =========================================================
   SIGNAL
========================================================= */

.bottom{
  background:linear-gradient(135deg,#10182c,#080b15);

  border:1px solid #28365e;

  padding:17px;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:12px;
}

.signal-title,
.confidence-title{
  font-size:12px;
  color:#9ba4b7;
}

.signal{
  margin-top:5px;
  font-size:28px;
  font-weight:bold;
}

.confidence{
  margin-top:5px;
  color:#ffd21c;
  font-size:27px;
  font-weight:bold;
}

.signal-target{
  margin-top:6px;
  font-size:12px;
  color:#aeb8cc;
  font-weight:bold;
}

.signal-target strong{
  color:#fff;
}

/* =========================================================
   ANALYSIS
========================================================= */

.analysis{
  background:linear-gradient(135deg,#10182c,#080b15);

  border:1px solid #28365e;

  border-radius:0 0 18px 18px;

  padding:15px;
}

.analysis-title{
  font-size:15px;
  color:#aeb8cc;
  margin-bottom:12px;
}

.analysis-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #263454;
  background:#080c19;

  border-radius:12px;

  padding:13px 8px;

  text-align:center;
}

.card-title{
  font-size:11px;
  color:#8f99ae;
}

.card-value{
  margin-top:7px;
  font-size:16px;
  font-weight:bold;
}

/* =========================================================
   EXTRA INFO
========================================================= */

.info{
  margin-top:10px;

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;
}

.info-card{
  background:#080c19;

  border:1px solid #263454;

  border-radius:12px;

  padding:12px;
}

.info-label{
  color:#8994aa;
  font-size:11px;
}

.info-value{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

/* =========================================================
   COLORS
========================================================= */

.up{
  color:#00e6a0 !important;
}

.down{
  color:#ff536d !important;
}

.neutral{
  color:#ffd21c !important;

/* =========================================================
   MOBILE
========================================================= */

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   CANDLE TIMELINE ALIGNMENT ENGINE
========================================================= */


/* =========================================================
   SETTINGS
========================================================= */

let SYMBOL = "EUR/USD";

const INTERVAL = "1min";

const REFRESH_MS = 15000;


/*
=============================================================
IMPORTANT TIMELINE RULE
=============================================================

Target:

Quotex       19:57
Finorix      19:58

Therefore the DISPLAY timeline is always:

CURRENT CLOCK MINUTE + 1 MINUTE

This prevents the frontend from displaying an old
API timeline such as:

19:54
19:55
19:56

when the live dashboard is already around:

19:57

The API candle values remain the source of OHLC data,
while the displayed candle timeline is normalized.

=============================================================
*/

const ADVANCE_CANDLES = 1;


/* =========================================================
   API
========================================================= */

function buildApiUrl(){

  return (
    "/api/market?symbol=" +
    encodeURIComponent(SYMBOL) +
    "&interval=" +
    encodeURIComponent(INTERVAL) +
    "&_=" +
    Date.now()
  );

}


/* =========================================================
   ELEMENTS
========================================================= */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const signalTargetElement =
  document.getElementById("signalTarget");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");

const feedTimeElement =
  document.getElementById("feedTime");

const feedAgeElement =
  document.getElementById("feedAge");

const candleTimerElement =
  document.getElementById("candleTimer");

const marketNameElement =
  document.getElementById("marketName");

const marketSelectElement =
  document.getElementById("marketSelect");


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{
        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },

      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,

      grid:{
        vertLines:{
          color:"rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:"rgba(255,255,255,0.06)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",

        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{

        borderColor:"#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:3,

        barSpacing:18,

        minBarSpacing:10

      },

      crosshair:{
        mode:
          LightweightCharts.CrosshairMode.Normal
      }

    }
  );


/* =========================================================
   CANDLE SERIES
========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a0",

    downColor:"#ff536d",

    borderUpColor:"#00d6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00d6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true

  });


/* =========================================================
   DATA STATE
========================================================= */

let currentCandles = [];

let displayCandles = [];

let currentSignal = "WAIT";

let currentConfidence = 0;


/* =========================================================
   TIME HELPERS
========================================================= */

function getNow(){

  return new Date();

}


/* =========================================================
   CURRENT MINUTE
========================================================= */

function getCurrentMinuteStart(){

  const now =
    new Date();

  now.setSeconds(0,0);

  return now;

}


/* =========================================================
   FINORIX DISPLAY ANCHOR
========================================================= */

/*
   Example:

   Browser clock:
   19:57:22

   Current minute:
   19:57

   Finorix advance anchor:
   19:58

   Therefore latest displayed candle becomes:

   19:58

   This is the required +1 candle timeline.
*/

function getFinorixAnchorTime(){

  const current =
    getCurrentMinuteStart();

  return Math.floor(
    (
      current.getTime() +
      (ADVANCE_CANDLES * 60000)
    ) / 1000
  );

}


/* =========================================================
   NEXT CANDLE
========================================================= */

function getNextCandleStart(){

  const current =
    getCurrentMinuteStart();

  return new Date(
    current.getTime() + 60000
  );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatHHMM(date){

  if(!date){
    return "--";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );

}


/* =========================================================
   FORMAT TIME WITH SECONDS
========================================================= */

function formatHHMMSS(date){

  if(!date){
    return "--";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }
  );

}


/* =========================================================
   TIMER
========================================================= */

function getRemainingSeconds(){

  const seconds =
    new Date().getSeconds();

  return seconds === 0
    ? 60
    : 60 - seconds;

}


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(value){

  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){

    if(
      value > 1000000000000
    ){

      return Math.floor(
        value / 1000
      );

    }

    return Math.floor(value);

  }


  if(!value){
    return null;
  }


  const text =
    String(value).trim();


  /*
    Unix timestamp string
  */

  if(
    /^\d+$/.test(text)
  ){

    const numeric =
      Number(text);


    if(
      numeric > 1000000000000
    ){

      return Math.floor(
        numeric / 1000
      );

    }


    return Math.floor(
      numeric
    );

  }


  /*
    ISO / normal date
  */

  let date =
    new Date(text);


  /*
    Twelve Data:

    YYYY-MM-DD HH:MM:SS

    Treat as UTC.
  */

  if(
    isNaN(date.getTime()) &&
    /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$/.test(text)
  ){

    date =
      new Date(
        text.replace(
          " ",
          "T"
        ) + "Z"
      );

  }


  if(
    isNaN(date.getTime())
  ){

    return null;

  }


  return Math.floor(
    date.getTime() / 1000
  );

}


/* =========================================================
   NORMALIZE CANDLES
========================================================= */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){
    return [];
  }


  const result = [];


  for(const item of raw){

    if(!item){
      continue;
    }


    const time =
      normalizeTime(
        item.time ??
        item.datetime ??
        item.timestamp ??
        item.date
      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(
      time === null ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){

      continue;

    }


    if(high < low){
      continue;
    }

    if(high < open){
      continue;
    }

    if(high < close){
      continue;
    }

    if(low > open){
      continue;
    }

    if(low > close){
      continue;
    }


    result.push({

      time,

      open,

      high,

      low,

      close,

      volume:
        item.volume !== undefined
          ? Number(item.volume)
          : null

    });

  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Remove duplicates.
  */

  const unique = [];


  for(const candle of result){

    const previous =
      unique[
        unique.length - 1
      ];


    if(
      previous &&
      previous.time === candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(
        candle
      );

    }

  }


  return unique;

}


/* =========================================================
   TIMELINE ALIGNMENT ENGINE
========================================================= */

/*
=============================================================
THIS IS THE MAIN FIX
=============================================================

Suppose API returns:

19:51
19:52
19:53
19:54
19:55
19:56
19:57

But Quotex/live clock is:

19:57

Required Finorix:

19:52
19:53
19:54
19:55
19:56
19:57
19:58

So we do NOT blindly add +60 seconds.

Instead:

1. Detect the latest API candle.
2. Determine the required Finorix anchor.
3. Calculate the complete difference.
4. Shift the whole candle timeline by that amount.
5. Force the latest displayed candle to the +1-minute anchor.

This eliminates the 3–4 candle lag when the API feed itself
is behind.

=============================================================
*/

function alignCandlesToFinorixTimeline(candles){

  if(
    !Array.isArray(candles) ||
    candles.length === 0
  ){

    return [];

  }


  const latest =
    candles[
      candles.length - 1
    ];


  const targetLatest =
    getFinorixAnchorTime();


  /*
    Existing latest candle time.
  */

  const sourceLatest =
    latest.time;


  /*
    Difference between source feed and
    required Finorix timeline.

    Example:

    source = 19:54
    target = 19:58

    shift = +4 minutes
  */

  let shiftSeconds =
    targetLatest -
    sourceLatest;


  /*
    Only minute alignment is allowed.

    This prevents accidental
    second-level distortion.
  */

  shiftSeconds =
    Math.round(
      shiftSeconds / 60
    ) * 60;


  /*
    Protect against absurd shifts.

    If API is extremely old, do not
    move it hundreds of candles.
  */

  const MAX_AUTO_SHIFT =
    15 * 60;


  if(
    Math.abs(shiftSeconds) >
    MAX_AUTO_SHIFT
  ){

    /*
      Still align the latest candle,
      but mark the feed as heavily delayed.
    */

    shiftSeconds =
      Math.max(
        -MAX_AUTO_SHIFT,
        Math.min(
          MAX_AUTO_SHIFT,
          shiftSeconds
        )
      );

  }


  const aligned =
    candles.map(
      candle => ({

        ...candle,

        time:
          candle.time +
          shiftSeconds

      })
    );


  /*
    Final hard alignment.

    This guarantees:

    latest Finorix candle =
    current minute + 1 candle
  */

  const finalLatest =
    aligned[
      aligned.length - 1
    ];


  const finalCorrection =
    targetLatest -
    finalLatest.time;


  if(
    finalCorrection !== 0
  ){

    for(
      const candle of aligned
    ){

      candle.time +=
        finalCorrection;

    }

  }


  /*
    Return metadata for diagnostics.
  */

  return {

    candles:
      aligned,

    sourceLatestTime:
      sourceLatest,

    targetLatestTime:
      targetLatest,

    shiftSeconds:
      shiftSeconds +
      finalCorrection

  };

}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
  values,
  period
){

  if(
    !Array.isArray(values) ||
    values.length < period
  ){

    return null;

  }


  const multiplier =
    2 / (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema += values[i];

  }


  ema /= period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] -
        ema
      ) *
      multiplier +
      ema;

  }


  return ema;

}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(
    !Array.isArray(values) ||
    values.length <= period
  ){

    return null;

  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    if(change >= 0){

      gains += change;

    }else{

      losses +=
        Math.abs(change);

    }

  }


  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;


  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =
      (
        avgGain *
        (period - 1) +
        gain
      ) / period;


    avgLoss =
      (
        avgLoss *
        (period - 1) +
        loss
      ) / period;

  }


  if(avgLoss === 0){
    return 100;
  }


  const rs =
    avgGain /
    avgLoss;


  return (
    100 -
    (
      100 /
      (1 + rs)
    )
  );

}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(values){

  if(values.length < 35){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const macd =
    ema12 -
    ema26;


  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD =
    null;


  if(
    previousValues.length >= 35
  ){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );


    const p26 =
      calculateEMA(
        previousValues,
        26
      );


    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 -
        p26;

    }

  }


  const histogram =
    previousMACD === null
      ? 0
      : macd -
        previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram

  };

}


/* =========================================================
   SIGNAL ENGINE
========================================================= */

function calculateSignal(candles){

  if(candles.length < 35){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"

    };

  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(ema9 > ema21){

      emaTrend =
        "UP";

      score += 2;

    }else if(
      ema9 < ema21
    ){

      emaTrend =
        "DOWN";

      score -= 2;

    }

  }


  if(rsi !== null){

    if(rsi < 30){

      score += 1;

    }else if(rsi > 70){

      score -= 1;

    }else if(rsi > 50){

      score += 0.5;

    }else{

      score -= 0.5;

    }

  }


  let macdTrend =
    "NEUTRAL";


  if(macd.macd !== null){

    if(
      macd.histogram > 0
    ){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(
      macd.histogram < 0
    ){

      macdTrend =
        "BEARISH";

      score -= 2;

    }

  }


  if(last > previous){

    score += 0.5;

  }else if(
    last < previous
  ){

    score -= 0.5;

  }


  let signal =
    "WAIT";


  if(score >= 2){

    signal =
      "UP";

  }else if(
    score <= -2
  ){

    signal =
      "DOWN";

  }


  let confidence =
    50 +
    Math.abs(score) *
    8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          confidence
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd

  };

}


/* =========================================================
   SIGNAL UI
========================================================= */

function setSignalUI(result){

  currentSignal =
    result.signal;

  currentConfidence =
    result.confidence;


  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.signal === "UP"){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(
    result.signal === "DOWN"
  ){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );

  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence + "%"
      : "--%";


  updateSignalTarget();


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.rsi !== null
  ){

    if(result.rsi > 70){

      rsiElement.classList.add(
        "down"
      );

    }else if(
      result.rsi < 30
    ){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );

    }

  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.emaTrend === "UP"
  ){

    emaElement.classList.add(
      "up"
    );

  }else if(
    result.emaTrend === "DOWN"
  ){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );

  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.macdTrend ===
    "BULLISH"
  ){

    macdElement.classList.add(
      "up"
    );

  }else if(
    result.macdTrend ===
    "BEARISH"
  ){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );

  }


  nextCandleElement.textContent =
    result.signal;

}


/* =========================================================
   SIGNAL TARGET
========================================================= */

function updateSignalTarget(){

  const target =
    getNextCandleStart();


  const targetTime =
    formatHHMM(
      target
    );


  if(
    currentSignal === "UP"
  ){

    signalTargetElement.innerHTML =
      'TARGET: <strong class="up">' +
      'UP • ' +
      targetTime +
      '</strong>';

  }else if(
    currentSignal === "DOWN"
  ){

    signalTargetElement.innerHTML =
      'TARGET: <strong class="down">' +
      'DOWN • ' +
      targetTime +
      '</strong>';

  }else{

    signalTargetElement.innerHTML =
      'TARGET: <strong>' +
      targetTime +
      '</strong>';

  }

}


/* =========================================================
   RUNNING TIMER
========================================================= */

function updateCandleTimer(){

  const remaining =
    getRemainingSeconds();


  candleTimerElement.textContent =
    String(remaining)
      .padStart(
        2,
        "0"
      );


  positionCandleTimer();

  updateSignalTarget();

}


/* =========================================================
   POSITION TIMER
========================================================= */

function positionCandleTimer(){

  if(
    !displayCandles.length
  ){

    candleTimerElement.style.display =
      "none";

    return;

  }


  const last =
    displayCandles[
      displayCandles.length - 1
    ];


  try{

    const coordinate =
      candleSeries.priceToCoordinate(
        last.close
      );


    const timeCoordinate =
      chart.timeScale()
        .timeToCoordinate(
          last.time
        );


    if(
      coordinate === null ||
      timeCoordinate === null
    ){

      candleTimerElement.style.display =
        "none";

      return;

    }


    candleTimerElement.style.left =
      (
        timeCoordinate +
        8
      ) + "px";


    candleTimerElement.style.top =
      (
        coordinate
      ) + "px";


    candleTimerElement.style.right =
      "auto";


    candleTimerElement.style.display =
      "block";

  }catch(error){

    candleTimerElement.style.display =
      "none";

  }

}


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(){

  try{

    statusElement.textContent =
      "Connecting...";


    const response =
      await fetch(
        buildApiUrl(),
        {
          method:"GET",

          cache:"no-store",

          headers:{
            Accept:
              "application/json"
          }

        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /* =====================================================
       API DATA
    ===================================================== */

    let rawCandles = [];


    if(
      Array.isArray(data)
    ){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;

    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(
      candles.length === 0
    ){

      throw new Error(
        "No valid candle data"
      );

    }


    /*
      Keep original API candles
      separately.

      Signal calculations use
      OHLC data, not shifted time.
    */

    currentCandles =
      candles;


    /* =====================================================
       TIMELINE ALIGNMENT
    ===================================================== */

    const alignment =
      alignCandlesToFinorixTimeline(
        candles
      );


    displayCandles =
      alignment.candles;


    if(
      !displayCandles.length
    ){

      throw new Error(
        "Timeline alignment failed"
      );

    }


    /* =====================================================
       CHART
    ===================================================== */

    candleSeries.setData(
      displayCandles
    );


    /*
      Mobile:

      approximately 14 candles

      Desktop:

      approximately 20 candles
    */

    const visibleBars =
      window.innerWidth <= 600
        ? 14
        : 20;


    try{

      chart.timeScale()
        .setVisibleLogicalRange({

          from:
            Math.max(
              0,
              displayCandles.length -
              visibleBars
            ),

          to:
            displayCandles.length +
            1

        });

    }catch(error){

      chart.timeScale()
        .fitContent();

    }


    /* =====================================================
       LAST PRICE
    ===================================================== */

    const last =
      candles[
        candles.length - 1
      ];


    const displayLast =
      displayCandles[
        displayCandles.length - 1
      ];


    const price =
      last.close;


    priceElement.textContent =
      price.toFixed(5);


    lastPriceElement.textContent =
      price.toFixed(5);


    candleCountElement.textContent =
      displayCandles.length;


    /* =====================================================
       ORIGINAL FEED TIME
    ===================================================== */

    const originalFeedDate =
      new Date(
        last.time * 1000
      );


    feedTimeElement.textContent =
      formatHHMMSS(
        originalFeedDate
      );


    /* =====================================================
       ALIGNED FINORIX TIME
    ===================================================== */

    const alignedDate =
      new Date(
        displayLast.time * 1000
      );


    /*
      The visible candle should show
      current clock + 1 minute.

      Example:

      Quotex/current:
      19:57

      Finorix:
      19:58
    */

    statusElement.textContent =
      "Connected • " +
      (
        data?.source ||
        "Market API"
      ) +
      " • +1 Candle";


    /*
      Feed age is still calculated
      from ORIGINAL source timestamp.

      This prevents the alignment
      correction from falsely claiming
      that the source is live.
    */

    const ageSeconds =
      Math.max(
        0,
        Math.floor(
          (
            Date.now() -
            (
              last.time *
              1000
            )
          ) / 1000
        )
      );


    feedAgeElement.textContent =
      ageSeconds + "s";


    /* =====================================================
       SIGNAL
    ===================================================== */

    const result =
      calculateSignal(
        candles
      );


    setSignalUI(
      result
    );


    /* =====================================================
       UPDATE TIME
    ===================================================== */

    updateTimeElement.textContent =
      formatHHMMSS(
        new Date()
      );


    /*
      Reposition timer after chart
      has finished rendering.
    */

    setTimeout(
      positionCandleTimer,
      80
    );


    /*
      Extra diagnostic information
      in console.

      Example:

      Source latest:
      19:54

      Target:
      19:58

      Shift:
      +240 seconds
    */

    console.log(
      "FINORIX TIMELINE ALIGNMENT",
      {
        sourceLatest:
          formatHHMMSS(
            originalFeedDate
          ),

        finorixLatest:
          formatHHMMSS(
            alignedDate
          ),

        target:
          formatHHMMSS(
            new Date(
              alignment.targetLatestTime *
              1000
            )
          ),

        shiftSeconds:
          alignment.shiftSeconds,

        shiftCandles:
          alignment.shiftSeconds /
          60
      }
    );


  }catch(error){

    console.error(
      "FINORIX MARKET ERROR:",
      error
    );


    statusElement.textContent =
      "Connection error";


    /*
      Existing chart is intentionally
      NOT destroyed.

      This prevents a temporary API
      failure from making the whole
      dashboard blank.
    */

  }

}


/* =========================================================
   MARKET SELECTOR
========================================================= */

marketSelectElement.addEventListener(
  "change",
  function(){

    const selected =
      String(
        this.value
      ).trim();


    if(!selected){
      return;
    }


    SYMBOL =
      selected;


    marketNameElement.textContent =
      SYMBOL;


    /*
      Save selected pair.

      This is important because
      mobile reload should NOT always
      return to EUR/USD.
    */

    try{

      localStorage.setItem(
        "finorix_selected_symbol",
        SYMBOL
      );

    }catch(error){

      console.warn(
        "Local storage unavailable"
      );

    }


    currentCandles = [];

    displayCandles = [];


    candleSeries.setData(
      []
    );


    signalElement.textContent =
      "WAIT";


    confidenceElement.textContent =
      "--%";


    nextCandleElement.textContent =
      "WAIT";


    statusElement.textContent =
      "Loading " +
      SYMBOL +
      "...";


    loadMarket();

  }
);


/* =========================================================
   RESTORE SELECTED MARKET
========================================================= */

function restoreSelectedMarket(){

  try{

    const saved =
      localStorage.getItem(
        "finorix_selected_symbol"
      );


    if(
      saved &&
      marketSelectElement.querySelector(
        'option[value="' +
        saved +
        '"]'
      )
    ){

      SYMBOL =
        saved;

      marketSelectElement.value =
        saved;

    }

  }catch(error){

    console.warn(
      "Could not restore market"
    );

  }


  marketNameElement.textContent =
    SYMBOL;

}


/* =========================================================
   RESPONSIVE CHART
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height

    });


    setTimeout(
      positionCandleTimer,
      30
    );

  }

}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   CHART TIME RANGE
========================================================= */

chart.timeScale()
  .subscribeVisibleTimeRangeChange(
    function(){

      positionCandleTimer();

    }
  );


/* =========================================================
   INITIALIZATION
========================================================= */

restoreSelectedMarket();


loadMarket();


/* =========================================================
   MARKET REFRESH
========================================================= */

setInterval(
  loadMarket,
  REFRESH_MS
);


/* =========================================================
   REAL-TIME CLOCK
========================================================= */

setInterval(
  function(){

    updateCandleTimer();

  },
  1000
);


/* =========================================================
   TIMER POSITION REFRESH
========================================================= */

setInterval(
  function(){

    positionCandleTimer();

  },
  1000
);


/* =========================================================
   EXTRA CLOCK ALIGNMENT

   At every minute boundary, refresh immediately.

   This is important because the +1 candle anchor
   changes exactly when:

   19:57:59
        ↓
   19:58:00

   Then Finorix target becomes:

   19:59

========================================================= */

let lastKnownMinute =
  new Date().getMinutes();


setInterval(
  function(){

    const currentMinute =
      new Date().getMinutes();


    if(
      currentMinute !==
      lastKnownMinute
    ){

      lastKnownMinute =
        currentMinute;


      /*
        Recalculate the timeline
        immediately at minute change.
      */

      loadMarket();

    }

  },
  500
);

</script>
