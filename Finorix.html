.market-select{

<script>

/* =========================================================
   FINORIX FRONTEND v3
   VISUAL ALIGNMENT ENGINE
========================================================= */


/* =========================================================
   SETTINGS
========================================================= */

let SYMBOL =
  localStorage.getItem("finorix_symbol") ||
  "EUR/USD";

const INTERVAL = "1min";

const REFRESH_MS = 15000;


/*
  IMPORTANT

  Observed situation:

  Source feed:
      ~3 candles behind Quotex

  Requirement:
      Finorix = 1 candle ahead of Quotex

  Therefore:

      -3 + 4 = +1

  So the DISPLAY timestamp is shifted
  exactly FOUR 1-minute candles.

  OHLC VALUES ARE NEVER SHIFTED.
*/

const DEFAULT_ALIGNMENT_CANDLES = 4;

const DEFAULT_ALIGNMENT_SECONDS =
  DEFAULT_ALIGNMENT_CANDLES * 60;


/* =========================================================
   ELEMENTS
========================================================= */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const signalTargetElement =
  document.getElementById("signalTarget");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");

const feedTimeElement =
  document.getElementById("feedTime");

const feedAgeElement =
  document.getElementById("feedAge");

const candleTimerElement =
  document.getElementById("candleTimer");

const marketNameElement =
  document.getElementById("marketName");

const marketSelectElement =
  document.getElementById("marketSelect");

const advanceLabelElement =
  document.getElementById("advanceLabel");


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{
        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },

      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,

      grid:{
        vertLines:{
          color:
            "rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.06)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",

        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{

        borderColor:"#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:2,

        barSpacing:20,

        minBarSpacing:10

      },

      crosshair:{
        mode:
          LightweightCharts
            .CrosshairMode
            .Normal
      }

    }
  );


/* =========================================================
   CANDLE SERIES
========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a0",

    downColor:"#ff536d",

    borderUpColor:"#00d6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00d6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true

  });


/* =========================================================
   STATE
========================================================= */

let currentCandles = [];

let sourceCandles = [];

let currentSignal = "WAIT";

let currentConfidence = 0;

let firstLoad = true;

let loading = false;

let alignmentCandles =
  DEFAULT_ALIGNMENT_CANDLES;

let alignmentSeconds =
  DEFAULT_ALIGNMENT_SECONDS;


/* =========================================================
   API
========================================================= */

function buildApiUrl(){

  return (
    "/api/market" +
    "?symbol=" +
    encodeURIComponent(SYMBOL) +
    "&interval=" +
    encodeURIComponent(INTERVAL) +
    "&market=real" +
    "&_=" +
    Date.now()
  );

}


/* =========================================================
   TIME
========================================================= */

function formatHHMM(date){

  if(!date){
    return "--";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      hour12:false
    }
  );

}


function formatHHMMSS(date){

  if(!date){
    return "--";
  }

  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hour12:false
    }
  );

}


/* =========================================================
   CURRENT MINUTE
========================================================= */

function getCurrentMinuteStart(){

  const now = new Date();

  now.setSeconds(0,0);

  return now;

}


/* =========================================================
   DISPLAY TARGET
========================================================= */

function getNextCandleStart(){

  return new Date(
    getCurrentMinuteStart().getTime() +
    60000
  );

}


/* =========================================================
   TIMER
========================================================= */

function getRemainingSeconds(){

  const seconds =
    new Date().getSeconds();

  return seconds === 0
    ? 60
    : 60 - seconds;

}


/* =========================================================
   SOURCE → DISPLAY ALIGNMENT
========================================================= */

/*
  VERY IMPORTANT:

  We shift ONLY the candle timestamp.

  Example:

  SOURCE:

      21:31
      21:32
      21:33

  +4 CANDLES:

      21:35
      21:36
      21:37

  OHLC remains exactly the same.

  This is visual synchronization only.
*/

function applyAlignment(
  candles,
  seconds
){

  if(!Array.isArray(candles)){
    return [];
  }

  return candles.map(
    candle => ({

      ...candle,

      time:
        candle.time +
        seconds

    })
  );

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){
    return [];
  }

  const result = [];

  for(const item of raw){

    if(!item){
      continue;
    }

    const rawTime =
      item.time ??
      item.datetime ??
      item.timestamp;

    const time =
      normalizeTime(rawTime);

    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);

    if(
      time === null ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){
      continue;
    }

    if(
      high < low ||
      high < open ||
      high < close ||
      low > open ||
      low > close
    ){
      continue;
    }

    result.push({

      time,

      open,

      high,

      low,

      close

    });

  }

  result.sort(
    (a,b) =>
      a.time - b.time
  );

  const unique = [];

  for(const candle of result){

    const last =
      unique[
        unique.length - 1
      ];

    if(
      last &&
      last.time === candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(candle);

    }

  }

  return unique;

}


/* =========================================================
   TIME NORMALIZER
========================================================= */

function normalizeTime(value){

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(
        value / 1000
      );

    }

    return Math.floor(value);

  }

  if(!value){
    return null;
  }

  const text =
    String(value).trim();

  if(/^\d+$/.test(text)){

    const n =
      Number(text);

    return n > 1000000000000
      ? Math.floor(n / 1000)
      : Math.floor(n);

  }

  if(
    /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$/
      .test(text)
  ){

    const date =
      new Date(
        text.replace(
          " ",
          "T"
        ) + "Z"
      );

    if(!isNaN(date.getTime())){

      return Math.floor(
        date.getTime() / 1000
      );

    }

  }

  const date =
    new Date(text);

  if(isNaN(date.getTime())){
    return null;
  }

  return Math.floor(
    date.getTime() / 1000
  );

}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
  values,
  period
){

  if(values.length < period){
    return null;
  }

  const multiplier =
    2 / (period + 1);

  let ema = 0;

  for(
    let i = 0;
    i < period;
    i++
  ){

    ema += values[i];

  }

  ema /= period;

  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] - ema
      ) *
      multiplier +
      ema;

  }

  return ema;

}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(values.length <= period){
    return null;
  }

  let gains = 0;

  let losses = 0;

  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];

    if(change >= 0){

      gains += change;

    }else{

      losses +=
        Math.abs(change);

    }

  }

  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;

  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];

    const gain =
      Math.max(change,0);

    const loss =
      Math.max(-change,0);

    avgGain =
      (
        avgGain *
        (period - 1) +
        gain
      ) / period;

    avgLoss =
      (
        avgLoss *
        (period - 1) +
        loss
      ) / period;

  }

  if(avgLoss === 0){
    return 100;
  }

  const rs =
    avgGain / avgLoss;

  return (
    100 -
    100 / (1 + rs)
  );

}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(values){

  if(values.length < 35){

    return {
      macd:null,
      histogram:0
    };

  }

  const ema12 =
    calculateEMA(
      values,
      12
    );

  const ema26 =
    calculateEMA(
      values,
      26
    );

  if(
    ema12 === null ||
    ema26 === null
  ){

    return {
      macd:null,
      histogram:0
    };

  }

  const macd =
    ema12 - ema26;

  const previous =
    values.slice(0,-1);

  let previousMacd = null;

  if(previous.length >= 35){

    const p12 =
      calculateEMA(
        previous,
        12
      );

    const p26 =
      calculateEMA(
        previous,
        26
      );

    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMacd =
        p12 - p26;

    }

  }

  return {

    macd,

    histogram:
      previousMacd === null
        ? 0
        : macd - previousMacd

  };

}


/* =========================================================
   SIGNAL
========================================================= */

function calculateSignal(candles){

  if(candles.length < 35){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"

    };

  }

  const closes =
    candles.map(
      c => c.close
    );

  const last =
    closes[closes.length - 1];

  const previous =
    closes[closes.length - 2];

  const ema9 =
    calculateEMA(
      closes,
      9
    );

  const ema21 =
    calculateEMA(
      closes,
      21
    );

  const rsi =
    calculateRSI(
      closes,
      14
    );

  const macd =
    calculateMACD(
      closes
    );

  let score = 0;

  let emaTrend = "NEUTRAL";

  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(ema9 > ema21){

      emaTrend = "UP";

      score += 2;

    }else if(ema9 < ema21){

      emaTrend = "DOWN";

      score -= 2;

    }

  }

  if(rsi !== null){

    if(rsi < 30){

      score += 1;

    }else if(rsi > 70){

      score -= 1;

    }else if(rsi > 50){

      score += 0.5;

    }else{

      score -= 0.5;

    }

  }

  let macdTrend = "NEUTRAL";

  if(macd.macd !== null){

    if(macd.histogram > 0){

      macdTrend = "BULLISH";

      score += 2;

    }else if(macd.histogram < 0){

      macdTrend = "BEARISH";

      score -= 2;

    }

  }

  if(last > previous){

    score += 0.5;

  }else if(last < previous){

    score -= 0.5;

  }

  let signal = "WAIT";

  if(score >= 2){

    signal = "UP";

  }else if(score <= -2){

    signal = "DOWN";

  }

  const confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          50 +
          Math.abs(score) * 8
        )
      )
    );

  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend

  };

}


/* =========================================================
   SIGNAL UI
========================================================= */

function setSignalUI(result){

  currentSignal =
    result.signal;

  currentConfidence =
    result.confidence;

  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );

  if(result.signal === "UP"){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(result.signal === "DOWN"){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );

  }

  confidenceElement.textContent =
    result.confidence
      ? result.confidence + "%"
      : "--%";

  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);

  emaElement.textContent =
    result.emaTrend;

  macdElement.textContent =
    result.macdTrend;

  nextCandleElement.textContent =
    result.signal;

  updateSignalTarget();

}


/* =========================================================
   TARGET
========================================================= */

function updateSignalTarget(){

  const target =
    getNextCandleStart();

  const targetTime =
    formatHHMM(target);

  if(currentSignal === "UP"){

    signalTargetElement.innerHTML =
      'TARGET: <strong class="up">' +
      'UP • ' +
      targetTime +
      '</strong>';

  }else if(currentSignal === "DOWN"){

    signalTargetElement.innerHTML =
      'TARGET: <strong class="down">' +
      'DOWN • ' +
      targetTime +
      '</strong>';

  }else{

    signalTargetElement.innerHTML =
      'TARGET: <strong>' +
      targetTime +
      '</strong>';

  }

}


/* =========================================================
   TIMER POSITION
========================================================= */

function positionCandleTimer(){

  if(!currentCandles.length){

    candleTimerElement.style.display =
      "none";

    return;

  }

  const last =
    currentCandles[
      currentCandles.length - 1
    ];

  try{

    const priceY =
      candleSeries.priceToCoordinate(
        last.close
      );

    const x =
      chart
        .timeScale()
        .timeToCoordinate(
          last.time
        );

    if(
      priceY === null ||
      x === null
    ){

      candleTimerElement.style.display =
        "none";

      return;

    }

    candleTimerElement.style.left =
      (x + 9) + "px";

    candleTimerElement.style.top =
      priceY + "px";

    candleTimerElement.style.right =
      "auto";

    candleTimerElement.style.display =
      "block";

  }catch{

    candleTimerElement.style.display =
      "none";

  }

}


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(){

  if(loading){
    return;
  }

  loading = true;

  if(firstLoad){

    statusElement.textContent =
      "Connecting...";

  }else{

    statusElement.textContent =
      "LIVE • refreshing";

  }

  const controller =
    new AbortController();

  const timeout =
    setTimeout(
      () => controller.abort(),
      12000
    );

  try{

    const response =
      await fetch(
        buildApiUrl(),
        {
          method:"GET",
          cache:"no-store",
          headers:{
            Accept:"application/json"
          },
          signal:
            controller.signal
        }
      );

    clearTimeout(timeout);

    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();

    if(data?.status !== "ok"){

      throw new Error(
        data?.message ||
        "Market API error"
      );

    }

    const raw =
      Array.isArray(
        data?.candles
      )
        ? data.candles
        : [];

    const normalized =
      normalizeCandles(raw);

    if(normalized.length === 0){

      throw new Error(
        "No valid candles"
      );

    }


    /* =====================================================
       SOURCE DATA
    ===================================================== */

    sourceCandles =
      normalized;


    /* =====================================================
       READ ALIGNMENT FROM API
    ===================================================== */

    const apiAlignment =
      Number(
        data?.marketInfo
          ?.displayAdvanceCandles
      );

    if(
      Number.isFinite(apiAlignment) &&
      apiAlignment >= 0 &&
      apiAlignment <= 20
    ){

      alignmentCandles =
        Math.round(apiAlignment);

    }else{

      alignmentCandles =
        DEFAULT_ALIGNMENT_CANDLES;

    }

    alignmentSeconds =
      alignmentCandles * 60;


    advanceLabelElement.textContent =
      "+" +
      alignmentCandles +
      " CANDLES";


    /* =====================================================
       APPLY DISPLAY ALIGNMENT
    ===================================================== */

    const aligned =
      applyAlignment(
        normalized,
        alignmentSeconds
      );

    currentCandles =
      aligned;


    /* =====================================================
       CHART
    ===================================================== */

    candleSeries.setData(
      aligned
    );

    const visibleBars =
      window.innerWidth <= 600
        ? 14
        : 20;

    try{

      chart
        .timeScale()
        .setVisibleLogicalRange({

          from:
            Math.max(
              0,
              aligned.length -
              visibleBars
            ),

          to:
            aligned.length + 1

        });

    }catch{

      chart
        .timeScale()
        .fitContent();

    }


    /* =====================================================
       PRICE
    ===================================================== */

    const last =
      aligned[
        aligned.length - 1
      ];

    const price =
      last.close;

    priceElement.textContent =
      price.toFixed(5);

    lastPriceElement.textContent =
      price.toFixed(5);

    candleCountElement.textContent =
      aligned.length;


    /* =====================================================
       FEED INFORMATION
    ===================================================== */

    const feed =
      data.feed || {};

    if(feed.latestSourceTime){

      feedTimeElement.textContent =
        formatHHMMSS(
          new Date(
            feed.latestSourceTime *
            1000
          )
        );

    }else{

      feedTimeElement.textContent =
        "--";

    }

    const age =
      Number(
        feed.ageSeconds
      );

    feedAgeElement.textContent =
      Number.isFinite(age)
        ? age + "s"
        : "--";


    /* =====================================================
       STATUS
    ===================================================== */

    const lag =
      Number(
        data?.marketInfo?.lagMinutes
      );

    if(
      Number.isFinite(lag) &&
      lag >= 3
    ){

      statusElement.textContent =
        "ALIGN +" +
        alignmentCandles +
        " • SOURCE -" +
        lag +
        "m";

    }else{

      statusElement.textContent =
        "LIVE • ALIGN +" +
        alignmentCandles;

    }


    /* =====================================================
       SIGNAL
    ===================================================== */

    const result =
      calculateSignal(
        normalized
      );

    setSignalUI(result);

    updateTimeElement.textContent =
      formatHHMMSS(
        new Date()
      );

    setTimeout(
      positionCandleTimer,
      50
    );

    firstLoad = false;

  }catch(error){

    clearTimeout(timeout);

    console.error(
      "FINORIX:",
      error
    );

    if(firstLoad){

      statusElement.textContent =
        "Connection error";

    }else{

      statusElement.textContent =
        "LIVE • feed retry";

    }

  }finally{

    loading = false;

  }

}


/* =========================================================
   MARKET SELECTOR
========================================================= */

marketSelectElement.addEventListener(
  "change",
  function(){

    const selected =
      String(
        this.value
      ).trim();

    if(!selected){
      return;
    }

    SYMBOL =
      selected;

    localStorage.setItem(
      "finorix_symbol",
      SYMBOL
    );

    marketNameElement.textContent =
      SYMBOL;

    currentCandles = [];

    sourceCandles = [];

    candleSeries.setData([]);

    signalElement.textContent =
      "WAIT";

    confidenceElement.textContent =
      "--%";

    nextCandleElement.textContent =
      "WAIT";

    statusElement.textContent =
      "Loading " +
      SYMBOL +
      "...";

    firstLoad = true;

    loadMarket();

  }
);


/* =========================================================
   RESIZE
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;

  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,
      height

    });

    setTimeout(
      positionCandleTimer,
      30
    );

  }

}

window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   RANGE
========================================================= */

chart
  .timeScale()
  .subscribeVisibleTimeRangeChange(
    function(){

      positionCandleTimer();

    }
  );


/* =========================================================
   INITIAL
========================================================= */

marketNameElement.textContent =
  SYMBOL;

marketSelectElement.value =
  SYMBOL;

loadMarket();


/* =========================================================
   REFRESH
========================================================= */

setInterval(
  loadMarket,
  REFRESH_MS
);


/* =========================================================
   TIMER
========================================================= */

setInterval(
  function(){

    const remaining =
      getRemainingSeconds();

    candleTimerElement.textContent =
      String(
        remaining
      ).padStart(
        2,
        "0"
      );

    positionCandleTimer();

    updateSignalTarget();

  },
  1000
);

</script>
