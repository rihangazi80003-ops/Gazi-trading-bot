<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:8px;
}

.app{
  width:100%;
  max-width:950px;

}

/* HEADER */

.header{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:18px 18px 0 0;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:20px;
  font-weight:700;
}

.market{
  margin-top:7px;
  font-size:14px;
  color:#00e6a0;
}

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#00e6a0;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 10px #00e6a0;
}

.timeframe{
  background:#182343;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
}

/* CHART */

.chart-box{
  position:relative;
  width:100%;
  height:480px;
  background:#080c17;
  border-left:1px solid #28365e;
  border-right:1px solid #28365e;
  overflow:hidden;
}

#chart{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:5;
  background:rgba(0,0,0,.65);
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
}

.advance-line{
  position:absolute;
  top:0;
  bottom:0;
  right:17%;
  border-left:2px dashed rgba(255,255,255,.65);
  pointer-events:none;
  z-index:4;
}

.advance-label{
  position:absolute;
  top:20px;
  right:calc(17% - 38px);
  font-size:13px;
  font-weight:bold;
  color:#fff;
  z-index:4;
}

.price{
  position:absolute;
  right:7px;
  top:45%;
  background:#168cff;
  padding:7px 10px;
  border-radius:7px;
  font-weight:bold;
  font-size:13px;
  z-index:5;
}

/* BOTTOM SIGNAL */

.bottom{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.signal-title,
.confidence-title{
  font-size:12px;
  color:#9ba4b7;
}

.signal{
  margin-top:5px;
  font-size:28px;
  font-weight:bold;
}

.confidence{
  margin-top:5px;
  color:#ffd21c;
  font-size:27px;
  font-weight:bold;
}

/* ANALYSIS */

.analysis{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:0 0 18px 18px;
  padding:15px;
}

.analysis-title{
  font-size:15px;
  color:#aeb8cc;
  margin-bottom:12px;
}

.analysis-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #263454;
  background:#080c19;
  border-radius:12px;
  padding:13px 8px;
  text-align:center;
}

.card-title{
  font-size:11px;
  color:#8f99ae;
}

.card-value{
  margin-top:7px;
  font-size:16px;
  font-weight:bold;
}

/* EXTRA INFO */

.info{
  margin-top:10px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.info-card{
  background:#080c19;
  border:1px solid #263454;
  border-radius:12px;
  padding:12px;
}

.info-label{
  color:#8994aa;
  font-size:11px;
}

.info-value{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

/* COLORS */

.up{
  color:#00e6a0 !important;
}

.down{
  color:#ff536d !important;
}

.neutral{
  color:#ffd21c !important;
}

  body{
    padding:0;
  }

    max-width:none;

  .header{

  }

    font-size:13px;

  .chart-box{

    border-left:0;
    border-right:0;
  }

    padding:15px;

    border-radius:0;
  }

  }

  .card{

    gap:7px;
  }

  .chart-box{
    height:430px;
  }

  .title{
    font-size:16px;
  }

  .confidence,
  .signal{
    font-size:24px;
  }
}

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   FRONTEND ENGINE
   ========================================================= */


/* -------------------------
   SETTINGS
------------------------- */

const SYMBOL = "EUR/USD";
const INTERVAL = "1min";

const API_URL =
  "/api/market?symbol=" +
  encodeURIComponent(SYMBOL) +
  "&interval=" +
  INTERVAL;

const REFRESH_MS = 15000;


/* -------------------------
   ELEMENTS
------------------------- */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");


/* -------------------------
   CHART
------------------------- */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{
        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },

      width:chartElement.clientWidth,
      height:chartElement.clientHeight,

      grid:{
        vertLines:{
          color:"rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:"rgba(255,255,255,0.06)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",

        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{
        borderColor:"#263454",

        timeVisible:true,
        secondsVisible:false,

        rightOffset:8,

        barSpacing:7,

        minBarSpacing:2
      },

      crosshair:{
        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


/* -------------------------
   CANDLE SERIES
------------------------- */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a0",

    downColor:"#ff536d",

    borderUpColor:"#00d6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00d6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true
  });


/* =========================================================
   DATA HELPERS
   ========================================================= */


/* Convert time into Unix seconds */

function normalizeTime(value){

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(value / 1000);

    }

    return Math.floor(value);
  }


  if(!value){
    return null;
  }


  let date =
    new Date(value);


  if(isNaN(date.getTime())){

    /*
      Sometimes API time can arrive as
      HH:MM:SS without a full date.
    */

    const today =
      new Date();

    const parts =
      String(value).split(":");

    if(parts.length >= 2){

      today.setHours(
        Number(parts[0]) || 0,
        Number(parts[1]) || 0,
        Number(parts[2]) || 0,
        0
      );

      date = today;
    }
  }


  if(isNaN(date.getTime())){
    return null;
  }


  return Math.floor(
    date.getTime() / 1000
  );
}


/* -------------------------
   NORMALIZE CANDLES
------------------------- */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){
    return [];
  }


  const result = [];


  for(const item of raw){

    if(!item){
      continue;
    }


    const time =
      normalizeTime(
        item.time ??
        item.datetime ??
        item.timestamp
      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(
      !time ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){
      continue;
    }


    result.push({

      time,

      open,

      high,

      low,

      close
    });
  }


  /*
    Sort oldest → newest
  */

  result.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Remove duplicate timestamps
  */

  const unique = [];


  for(const candle of result){

    const last =
      unique[unique.length - 1];

    if(
      last &&
      last.time === candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(candle);
    }
  }


  return unique;
}


/* =========================================================
   INDICATORS
   ========================================================= */


/* -------------------------
   EMA
------------------------- */

function calculateEMA(values, period){

  if(values.length < period){
    return null;
  }


  const multiplier =
    2 / (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema += values[i];
  }


  ema /= period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] - ema
      ) * multiplier + ema;
  }


  return ema;
}


/* -------------------------
   RSI
------------------------- */

function calculateRSI(
  values,
  period = 14
){

  if(values.length <= period){
    return null;
  }


  let gains = 0;
  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] - values[i-1];


    if(change >= 0){

      gains += change;

    }else{

      losses += Math.abs(change);
    }
  }


  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;


  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] - values[i-1];


    const gain =
      Math.max(change,0);

    const loss =
      Math.max(-change,0);


    avgGain =
      (
        avgGain * (period - 1)
        + gain
      ) / period;


    avgLoss =
      (
        avgLoss * (period - 1)
        + loss
      ) / period;
  }


  if(avgLoss === 0){
    return 100;
  }


  const rs =
    avgGain / avgLoss;


  return 100 -
    (100 / (1 + rs));
}


/* -------------------------
   MACD
------------------------- */

function calculateMACD(values){

  if(values.length < 35){

    return {
      macd:null,
      signal:null,
      histogram:null
    };
  }


  const ema12 =
    calculateEMA(values,12);

  const ema26 =
    calculateEMA(values,26);


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {
      macd:null,
      signal:null,
      histogram:null
    };
  }


  const macd =
    ema12 - ema26;


  /*
    For a stable lightweight calculation,
    use the recent MACD value and compare
    EMA trend.
  */

  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD = null;


  if(previousValues.length >= 35){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );

    const p26 =
      calculateEMA(
        previousValues,
        26
      );

    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 - p26;
    }
  }


  const histogram =
    previousMACD === null
      ? 0
      : macd - previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram
  };
}


/* =========================================================
   SIGNAL ENGINE
   ========================================================= */

function calculateSignal(candles){

  if(candles.length < 35){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"
    };
  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[closes.length - 1];


  const previous =
    closes[closes.length - 2];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  /* EMA */

  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(ema9 > ema21){

      emaTrend = "UP";

      score += 2;

    }else if(ema9 < ema21){

      emaTrend = "DOWN";

      score -= 2;
    }
  }


  /* RSI */

  if(rsi !== null){

    if(rsi < 30){

      score += 1;

    }else if(rsi > 70){

      score -= 1;

    }else if(rsi > 50){

      score += 0.5;

    }else{

      score -= 0.5;
    }
  }


  /* MACD */

  let macdTrend =
    "NEUTRAL";


  if(macd.macd !== null){

    if(macd.histogram > 0){

      macdTrend = "BULLISH";

      score += 2;

    }else if(macd.histogram < 0){

      macdTrend = "BEARISH";

      score -= 2;
    }
  }


  /* Last candle direction */

  if(last > previous){

    score += 0.5;

  }else if(last < previous){

    score -= 0.5;
  }


  /*
    Convert score into direction.
  */

  let signal =
    "WAIT";


  if(score >= 2){

    signal = "UP";

  }else if(score <= -2){

    signal = "DOWN";
  }


  /*
    Score-based confidence.
    This is an algorithmic confidence score,
    NOT a guaranteed probability.
  */

  let confidence =
    50 + Math.abs(score) * 8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(confidence)
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:macd.macd
  };
}


/* =========================================================
   UI
   ========================================================= */

function setSignalUI(result){

  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.signal === "UP"){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(result.signal === "DOWN"){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );
  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence + "%"
      : "--%";


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.rsi !== null){

    if(result.rsi > 70){

      rsiElement.classList.add(
        "down"
      );

    }else if(result.rsi < 30){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );
    }
  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.emaTrend === "UP"){

    emaElement.classList.add(
      "up"
    );

  }else if(result.emaTrend === "DOWN"){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );
  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.macdTrend === "BULLISH"){

    macdElement.classList.add(
      "up"
    );

  }else if(result.macdTrend === "BEARISH"){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );
  }


  nextCandleElement.textContent =
    result.signal;
}


/* =========================================================
   LOAD MARKET
   ========================================================= */

let currentCandles = [];


async function loadMarket(){

  try{

    statusElement.textContent =
      "Connecting...";


    const response =
      await fetch(
        API_URL,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );
    }


    const data =
      await response.json();


    /*
      Support several possible API formats.
    */

    let rawCandles = [];


    if(Array.isArray(data)){

      rawCandles = data;

    }else if(
      Array.isArray(data.candles)
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(data.data.candles)
    ){

      rawCandles =
        data.data.candles;
    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(!candles.length){

      throw new Error(
        "No valid candle data"
      );
    }


    currentCandles =
      candles;


    /* -------------------------
       UPDATE CHART
    ------------------------- */

    candleSeries.setData(
      candles
    );


    /*
      Keep the newest candles visible.
    */

    chart.timeScale()
      .fitContent();


    /* -------------------------
       LAST PRICE
    ------------------------- */

    const last =
      candles[
        candles.length - 1
      ];


    const price =
      last.close;


    priceElement.textContent =
      price.toFixed(5);


    lastPriceElement.textContent =
      price.toFixed(5);


    candleCountElement.textContent =
      candles.length;


    /* -------------------------
       SIGNAL
    ------------------------- */

    const result =
      calculateSignal(
        candles
      );


    setSignalUI(
      result
    );


    /* -------------------------
       STATUS
    ------------------------- */

    statusElement.textContent =
      "Connected • Twelve Data";


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();


  }catch(error){

    console.error(
      "Finorix error:",
      error
    );


    statusElement.textContent =
      "Connection error";


    signalElement.textContent =
      "WAIT";


    confidenceElement.textContent =
      "--%";
  }
}


/* =========================================================
   RESPONSIVE CHART
   ========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if(width > 0 && height > 0){

    chart.applyOptions({

      width,

      height
    });
  }
}


window.addEventListener(
  "resize",
  resizeChart
);

setInterval(
