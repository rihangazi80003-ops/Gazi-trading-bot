<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;

}

body{

.app{

/* =========================
HEADER
========================= */

.header{

}

.title{

}

.market-row{
display:flex;
align-items:center;
gap:8px;

}

.live-dot{
display:inline-block;

height:9px;
background:#00e6a0;
border-radius:50%;
box-shadow:0 0 10px #00e6a0;

}

.market-select{
background:#09101f;
border:1px solid #28527d;
border-radius:9px;
color:#00e6a0;
font-size:15px;
font-weight:bold;
padding:7px 30px 7px 10px;
outline:none;

}

.market-select option{

}

.live-text{

font-weight:bold;

}

.market-type{

color:#8d9ab3;

}

.timeframe{

padding:11px 15px;
border-radius:10px;

}

/* =========================
CHART
========================= */

.chart-box{
position:relative;
width:100%;
height:500px;
background:#080c17;
border-left:1px solid #28365e;
border-right:1px solid #28365e;

}

#chart{

height:100%;

.status{
position:absolute;
top:10px;
left:10px;
z-index:10;

padding:8px 11px;
border-radius:8px;
font-size:12px;
max-width:75%;
white-space:nowrap;
overflow:hidden;

}

.advance-line{
position:absolute;
top:0;
bottom:0;
right:17%;
border-left:2px dashed rgba(255,255,255,.65);
pointer-events:none;
z-index:4;
}

.advance-label{
position:absolute;
top:20px;
right:calc(17% - 38px);

font-weight:bold;
color:#fff;
z-index:4;
}

/* =========================
CURRENT PRICE
========================= */

.price{
position:absolute;
right:7px;
top:45%;
background:#168cff;
padding:8px 11px;
border-radius:8px;
font-weight:bold;
font-size:14px;
z-index:8;
}

/* =========================
CANDLE TIMER
========================= */

.candle-timer{
position:absolute;

right:18px;
top:70px;

z-index:12;

min-width:145px;

background:rgba(5,8,18,.94);

border:1px solid #31446f;

border-radius:14px;

padding:10px 13px;

text-align:center;

box-shadow:
0 8px 25px rgba(0,0,0,.35);
}

.timer-title{

}

.timer-value{
margin-top:2px;

}

.timer-sub{
margin-top:3px;
font-size:10px;
color:#9ba6bb;
}

.timer-progress{
height:3px;
margin-top:8px;
background:#202a43;
border-radius:5px;
overflow:hidden;
}

.timer-progress-bar{
height:100%;
width:100%;
background:#00e6a0;
transition:width .25s linear;
}

/* =========================
BOTTOM SIGNAL
========================= */

.bottom{
background:linear-gradient(135deg,#10182c,#080b15);
border:1px solid #28365e;
padding:17px;
display:flex;
justify-content:space-between;
align-items:center;
}

.signal-title,
.confidence-title{
font-size:12px;
color:#9ba4b7;
}

.signal{
margin-top:5px;
font-size:28px;
font-weight:bold;
}

.confidence{
margin-top:5px;
color:#ffd21c;
font-size:27px;
font-weight:bold;
}

/* =========================
ANALYSIS
========================= */

.analysis{
background:linear-gradient(135deg,#10182c,#080b15);
border:1px solid #28365e;
border-radius:0 0 18px 18px;
padding:15px;
}

.analysis-title{
font-size:15px;
color:#aeb8cc;
margin-bottom:12px;
}

.analysis-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.card{
border:1px solid #263454;
background:#080c19;
border-radius:12px;
padding:13px 8px;
text-align:center;
}

.card-title{
font-size:11px;
color:#8f99ae;
}

.card-value{
margin-top:7px;
font-size:16px;
font-weight:bold;
}

/* =========================
INFO
========================= */

.info{
margin-top:10px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.info-card{
background:#080c19;
border:1px solid #263454;
border-radius:12px;
padding:12px;
}

.info-label{
color:#8994aa;
font-size:11px;
}

.info-value{
margin-top:5px;
font-size:14px;
font-weight:bold;
}

/* =========================
COLORS
========================= */

.up{
color:#00e6a0 !important;
}

.down{
color:#ff536d !important;
}

.neutral{
color:#ffd21c !important;

/* =========================
MOBILE
========================= */

.chart-box{
height:500px;

padding:15px;

.analysis{

.card-value{

font-size:13px;
}

min-width:120px;
}

<script>

/* =========================================================
FINORIX AI MARKET PRO
MOBILE CANDLE ENGINE
========================================================= */


/* =========================================================
MARKET SETTINGS
========================================================= */

let selectedMarket =
"real";

let selectedSymbol =
"EUR/USD";

const INTERVAL =
"1min";

const REFRESH_MS =
15000;

const VISIBLE_CANDLES =
15;


/* =========================================================
ELEMENTS
========================================================= */

const chartElement =
document.getElementById("chart");

const statusElement =
document.getElementById("status");

const priceElement =
document.getElementById("price");

const signalElement =
document.getElementById("signal");

const confidenceElement =
document.getElementById("confidence");

const rsiElement =
document.getElementById("rsi");

const emaElement =
document.getElementById("ema");

const macdElement =
document.getElementById("macd");

const lastPriceElement =
document.getElementById("lastPrice");

const nextCandleElement =
document.getElementById("nextCandle");

const candleCountElement =
document.getElementById("candleCount");

const updateTimeElement =
document.getElementById("updateTime");

const marketSelect =
document.getElementById("marketSelect");

const marketTypeElement =
document.getElementById("marketType");

const liveTextElement =
document.getElementById("liveText");

const timerValueElement =
document.getElementById("timerValue");

const timerSubElement =
document.getElementById("timerSub");

const timerProgressElement =
document.getElementById("timerProgress");


/* =========================================================
CHART
========================================================= */

const chart =
LightweightCharts.createChart(
chartElement,
{

layout:{
background:{
color:"#080c17"
},
textColor:"#aeb8cc"
},

width:
chartElement.clientWidth,

height:
chartElement.clientHeight,

grid:{
vertLines:{
color:"rgba(255,255,255,0.06)"
},

horzLines:{
color:"rgba(255,255,255,0.06)"
}
},

rightPriceScale:{
borderColor:"#263454",

scaleMargins:{
top:0.08,
bottom:0.12
}
},

timeScale:{

borderColor:"#263454",

timeVisible:true,

secondsVisible:false,

rightOffset:2,

barSpacing:18,

minBarSpacing:5,

fixLeftEdge:false,

lockVisibleTimeRangeOnResize:true
},

crosshair:{
mode:
LightweightCharts.CrosshairMode.Normal
}

}
);


/* =========================================================
CANDLE SERIES
========================================================= */

const candleSeries =
chart.addCandlestickSeries({

upColor:"#00d6a0",

downColor:"#ff536d",

borderUpColor:"#00d6a0",

borderDownColor:"#ff536d",

wickUpColor:"#00d6a0",

wickDownColor:"#ff536d",

priceLineVisible:true,

lastValueVisible:true

});


/* =========================================================
API URL
========================================================= */

function getApiUrl(){

return (
"/api/market" +
"?symbol=" +
encodeURIComponent(selectedSymbol) +
"&interval=" +
encodeURIComponent(INTERVAL) +
"&market=" +
encodeURIComponent(selectedMarket)
);

}


/* =========================================================
TIME NORMALIZER
========================================================= */

function normalizeTime(value){

if(typeof value === "number"){

if(value > 1000000000000){

return Math.floor(
value / 1000
);

}

return Math.floor(value);

}

if(!value){

return null;
}

let date =
new Date(value);

if(isNaN(date.getTime())){

const today =
new Date();

const parts =
String(value).split(":");

if(parts.length >= 2){

today.setHours(
Number(parts[0]) || 0,
Number(parts[1]) || 0,
Number(parts[2]) || 0,
0
);

date =
today;

}

}

if(isNaN(date.getTime())){

return null;
}

return Math.floor(
date.getTime() / 1000
);

}


/* =========================================================
NORMALIZE CANDLES
========================================================= */

function normalizeCandles(raw){

if(!Array.isArray(raw)){

return [];
}

const result = [];

for(const item of raw){

if(!item){

continue;
}

const time =
normalizeTime(
item.time ??
item.datetime ??
item.timestamp
);

const open =
Number(item.open);

const high =
Number(item.high);

const low =
Number(item.low);

const close =
Number(item.close);

if(
!time ||
!Number.isFinite(open) ||
!Number.isFinite(high) ||
!Number.isFinite(low) ||
!Number.isFinite(close)
){

continue;
}

result.push({

time,

open,

high,

low,

close

});

}


/* sort */

result.sort(
(a,b) =>
a.time - b.time
);


/* remove duplicates */

const unique = [];

for(const candle of result){

const last =
unique[
unique.length - 1
];

if(
last &&
last.time === candle.time
){

unique[
unique.length - 1
] =
candle;

}else{

unique.push(candle);

}

}

return unique;

}


/* =========================================================
EMA
========================================================= */

function calculateEMA(
values,
period
){

if(values.length < period){

return null;
}

const multiplier =
2 / (period + 1);

let ema = 0;

for(
let i = 0;
i < period;
i++
){

ema += values[i];

}

ema /= period;

for(
let i = period;
i < values.length;
i++
){

ema =
(
(values[i] - ema)
* multiplier
) + ema;

}

return ema;

}


/* =========================================================
RSI
========================================================= */

function calculateRSI(
values,
period = 14
){

if(values.length <= period){

return null;
}

let gains = 0;
let losses = 0;

for(
let i = 1;
i <= period;
i++
){

const change =
values[i] -
values[i - 1];

if(change >= 0){

gains += change;

}else{

losses +=
Math.abs(change);

}

}

let avgGain =
gains / period;

let avgLoss =
losses / period;

for(
let i = period + 1;
i < values.length;
i++
){

const change =
values[i] -
values[i - 1];

const gain =
Math.max(change,0);

const loss =
Math.max(-change,0);

avgGain =
(
avgGain * (period - 1)
+ gain
) / period;

avgLoss =
(
avgLoss * (period - 1)
+ loss
) / period;

}

if(avgLoss === 0){

return 100;
}

const rs =
avgGain / avgLoss;

return 100 -
(
100 / (1 + rs)
);

}


/* =========================================================
MACD
========================================================= */

function calculateMACD(values){

if(values.length < 35){

return {
macd:null,
signal:null,
histogram:null
};

}

const ema12 =
calculateEMA(
values,
12
);

const ema26 =
calculateEMA(
values,
26
);

if(
ema12 === null ||
ema26 === null
){

return {
macd:null,
signal:null,
histogram:null
};

}

const macd =
ema12 - ema26;

const previousValues =
values.slice(
0,
values.length - 1
);

let previousMACD = null;

if(previousValues.length >= 35){

const p12 =
calculateEMA(
previousValues,
12
);

const p26 =
calculateEMA(
previousValues,
26
);

if(
p12 !== null &&
p26 !== null
){

previousMACD =
p12 - p26;

}

}

const histogram =
previousMACD === null
? 0
: macd - previousMACD;

return {

macd,

signal:
previousMACD,

histogram

};

}


/* =========================================================
SIGNAL ENGINE
========================================================= */

function calculateSignal(candles){

if(candles.length < 35){

return {

signal:"WAIT",

confidence:0,

rsi:null,

emaTrend:"WAIT",

macdTrend:"WAIT"

};

}

const closes =
candles.map(
c => c.close
);

const last =
closes[
closes.length - 1
];

const previous =
closes[
closes.length - 2
];

const ema9 =
calculateEMA(
closes,
9
);

const ema21 =
calculateEMA(
closes,
21
);

const rsi =
calculateRSI(
closes,
14
);

const macd =
calculateMACD(
closes
);

let score = 0;


/* EMA */

let emaTrend =
"NEUTRAL";

if(
ema9 !== null &&
ema21 !== null
){

if(ema9 > ema21){

emaTrend =
"UP";

score += 2;

}else if(
ema9 < ema21
){

emaTrend =
"DOWN";

score -= 2;

}

}


/* RSI */

if(rsi !== null){

if(rsi < 30){

score += 1;

}else if(rsi > 70){

score -= 1;

}else if(rsi > 50){

score += .5;

}else{

score -= .5;

}

}


/* MACD */

let macdTrend =
"NEUTRAL";

if(macd.macd !== null){

if(macd.histogram > 0){

macdTrend =
"BULLISH";

score += 2;

}else if(
macd.histogram < 0
){

macdTrend =
"BEARISH";

score -= 2;

}

}


/* candle direction */

if(last > previous){

score += .5;

}else if(
last < previous
){

score -= .5;

}


/* direction */

let signal =
"WAIT";

if(score >= 2){

signal =
"UP";

}else if(
score <= -2
){

signal =
"DOWN";

}


/* confidence */

let confidence =
50 +
Math.abs(score) * 8;

confidence =
Math.min(
94,
Math.max(
50,
Math.round(confidence)
)
);

return {

signal,

confidence,

rsi,

emaTrend,

macdTrend,

ema9,

ema21,

macd:
macd.macd

};

}


/* =========================================================
SIGNAL UI
========================================================= */

function setSignalUI(result){

signalElement.classList.remove(
"up",
"down",
"neutral"
);

if(result.signal === "UP"){

signalElement.textContent =
"UP";

signalElement.classList.add(
"up"
);

}else if(
result.signal === "DOWN"
){

signalElement.textContent =
"DOWN";

signalElement.classList.add(
"down"
);

}else{

signalElement.textContent =
"WAIT";

signalElement.classList.add(
"neutral"
);

}

confidenceElement.textContent =
result.confidence
? result.confidence + "%"
: "--%";


rsiElement.textContent =
result.rsi === null
? "--"
: result.rsi.toFixed(1);

rsiElement.classList.remove(
"up",
"down",
"neutral"
);

if(result.rsi !== null){

if(result.rsi > 70){

rsiElement.classList.add(
"down"
);

}else if(
result.rsi < 30
){

rsiElement.classList.add(
"up"
);

}else{

rsiElement.classList.add(
"neutral"
);

}

}


emaElement.textContent =
result.emaTrend;

emaElement.classList.remove(
"up",
"down",
"neutral"
);

if(result.emaTrend === "UP"){

emaElement.classList.add(
"up"
);

}else if(
result.emaTrend === "DOWN"
){

emaElement.classList.add(
"down"
);

}else{

emaElement.classList.add(
"neutral"
);

}


macdElement.textContent =
result.macdTrend;

macdElement.classList.remove(
"up",
"down",
"neutral"
);

if(result.macdTrend === "BULLISH"){

macdElement.classList.add(
"up"
);

}else if(
result.macdTrend === "BEARISH"
){

macdElement.classList.add(
"down"
);

}else{

macdElement.classList.add(
"neutral"
);

}


nextCandleElement.textContent =
result.signal;

}


/* =========================================================
KEEP LAST 15 CANDLES LARGE
========================================================= */

function showLastCandles(candles){

if(!candles.length){

return;
}

const from =
Math.max(
0,
candles.length -
VISIBLE_CANDLES
);

const to =
candles.length + 1;

chart.timeScale()
.setVisibleLogicalRange({

from,

to

});

}


/* =========================================================
LOAD MARKET
========================================================= */

let currentCandles = [];

let lastServerPrice = null;


async function loadMarket(){

try{

statusElement.textContent =
"Connecting...";


const response =
await fetch(
getApiUrl(),
{
cache:"no-store"
}
);


if(!response.ok){

throw new Error(
"HTTP " +
response.status
);

}


const data =
await response.json();


/* OTC safety */

if(
selectedMarket === "otc"
){

/*
Do not silently display real
Twelve Data candles as OTC.
*/

if(
data.source === "Twelve Data" &&
!data.otc
){

throw new Error(
"OTC feed is not connected yet"
);

}

}


/* candles */

let rawCandles = [];


if(Array.isArray(data)){

rawCandles =
data;

}else if(
Array.isArray(data.candles)
){

rawCandles =
data.candles;

}else if(
data.data &&
Array.isArray(
data.data.candles
)
){

rawCandles =
data.data.candles;

}


const candles =
normalizeCandles(
rawCandles
);


if(!candles.length){

throw new Error(
"No valid candle data"
);

}


currentCandles =
candles;


/* =========================
CHART DATA
========================= */

candleSeries.setData(
candles
);


/*
Only last 15 are visible.
Older candles remain in data.
*/

showLastCandles(
candles
);


/* =========================
PRICE
========================= */

const last =
candles[
candles.length - 1
];


let price =
last.close;


/*
If API supplies a live price,
use it for the price display.
*/

if(
data.market &&
Number.isFinite(
Number(data.market.livePrice)
)
){

price =
Number(
data.market.livePrice
);

lastServerPrice =
price;

}else{

lastServerPrice =
price;

}


const decimals =
price >= 10
? 3
: 5;


priceElement.textContent =
price.toFixed(decimals);

lastPriceElement.textContent =
price.toFixed(decimals);

candleCountElement.textContent =
VISIBLE_CANDLES;


/* =========================
SIGNAL
========================= */

const result =
calculateSignal(
candles
);

setSignalUI(
result
);


/* =========================
STATUS
========================= */

if(selectedMarket === "real"){

statusElement.textContent =
"Connected • Twelve Data • " +
selectedSymbol;

}else{

statusElement.textContent =
"OTC • Waiting for OTC feed";

}

updateTimeElement.textContent =
new Date()
.toLocaleTimeString();


}catch(error){

console.error(
"FINORIX MARKET ERROR:",
error
);

statusElement.textContent =
error.message ||
"Connection error";

if(
selectedMarket === "otc"
){

liveTextElement.textContent =
"OTC";

liveTextElement.style.color =
"#ffd21c";

}else{

liveTextElement.textContent =
"LIVE";

liveTextElement.style.color =
"#00e6a0";

}

}

}


/* =========================================================
MARKET SELECTOR
========================================================= */

marketSelect.addEventListener(
"change",
function(){

const value =
this.value.split("|");

selectedMarket =
value[0];

selectedSymbol =
value[1];

marketTypeElement.textContent =
selectedMarket.toUpperCase();


if(selectedMarket === "real"){

marketTypeElement.style.color =
"#00e6a0";

liveTextElement.textContent =
"LIVE";

liveTextElement.style.color =
"#00e6a0";

}else{

marketTypeElement.style.color =
"#ffd21c";

liveTextElement.textContent =
"OTC";

liveTextElement.style.color =
"#ffd21c";

}


/*
Reset signal while switching.
*/

signalElement.textContent =
"WAIT";

confidenceElement.textContent =
"--%";

nextCandleElement.textContent =
"WAIT";


loadMarket();

}
);


/* =========================================================
CANDLE CLOCK
========================================================= */

/*
This timer follows the actual clock.

Example:

23:30:00
→ 00:60

23:30:01
→ 00:59

23:30:02
→ 00:58

...

23:30:59
→ 00:01

23:31:00
→ NEW CANDLE
→ 00:60
*/

function updateCandleTimer(){

const now =
new Date();

const seconds =
now.getSeconds();

const milliseconds =
now.getMilliseconds();


let remaining =
60 - seconds;


if(
remaining <= 0 ||
remaining > 60
){

remaining = 60;

}


timerValueElement.textContent =
"00:" +
String(
remaining
).padStart(
2,
"0"
);


/*
Progress percentage
*/

const elapsed =
seconds +
(milliseconds / 1000);

const percentage =
Math.max(
0,
Math.min(
100,
((60 - elapsed) / 60) * 100
)
);

timerProgressElement.style.width =
percentage + "%";


/*
Timer color changes near
candle close.
*/

if(remaining <= 5){

timerValueElement.style.color =
"#ff536d";

timerProgressElement.style.background =
"#ff536d";

}else if(
remaining <= 15
){

timerValueElement.style.color =
"#ffd21c";

timerProgressElement.style.background =
"#ffd21c";

}else{

timerValueElement.style.color =
"#00e6a0";

timerProgressElement.style.background =
"#00e6a0";

}


/*
At exact new minute,
refresh market quickly.
*/

if(
seconds === 0 &&
milliseconds < 1000
){

timerSubElement.textContent =
"NEW CANDLE";

setTimeout(
loadMarket,
500
);

}else{

timerSubElement.textContent =
"FORMING CANDLE";

}

}


/* =========================================================
TIMER LOOP
========================================================= */

setInterval(
updateCandleTimer,
250
);

updateCandleTimer();


/* =========================================================
RESPONSIVE CHART
========================================================= */

function resizeChart(){

const width =
chartElement.clientWidth;

const height =
chartElement.clientHeight;

if(
width > 0 &&
height > 0
){

chart.applyOptions({

width,

height

});

if(currentCandles.length){

showLastCandles(
currentCandles
);

}

}

}


window.addEventListener(
"resize",
resizeChart
);


/* =========================================================
INITIAL LOAD
========================================================= */

loadMarket();


/* =========================================================
15 SECOND DATA REFRESH
========================================================= */

setInterval(
loadMarket,
REFRESH_MS
);

</script>
