<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finorix AI Market Pro</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #070a10; font-family: Arial, Helvetica, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .finorix {
            width: 100%;
            max-width: 350px;
            background: #080b12;
            color: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #252b37;
            box-shadow: 0 15px 45px rgba(0,0,0,.5);
        }

        .header {
            height: 55px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0d111a;
            border-bottom: 1px solid #202633;
        }
        .title { font-size: 14px; font-weight: 700; }
        .market { margin-top: 3px; font-size: 11px; color: #b7becb; display: flex; align-items: center; }
        .live { color: #19e58b; margin-left: 4px; font-weight: bold; }
        .live-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #18e88a;
            box-shadow: 0 0 8px #18e88a;
            margin-right: 5px;
        }
        .tf { padding: 5px 10px; border-radius: 6px; background: #171d28; color: #dce2eb; font-size: 11px; }

        .chart-area {
            position: relative;
            width: 100%;
            height: 240px;
            background: #080b12;
        }
        #chart { width: 100%; height: 100%; }

        .price-label {
            position: absolute;
            right: 0;
            top: 45%;
            padding: 4px 8px;
            background: #178de5;
            border-radius: 4px 0 0 4px;
            font-size: 10px;
            font-weight: bold;
            z-index: 20;
        }

        .advance-line {
            position: absolute;
            top: 0; bottom: 0;
            right: 70px;
            border-left: 1px dashed rgba(255,255,255,0.4);
            pointer-events: none;
            z-index: 10;
        }
        .advance-text {
            position: absolute;
            top: 8px;
            left: -28px;
            font-size: 8px;
            color: #adb5c2;
            letter-spacing: 0.5px;
        }

        .footer {
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            background: #0d111a;
            border-top: 1px solid #202633;
        }
        .signal-title { color: #737d8d; font-size: 9px; display: block; }
        .signal { font-size: 12px; font-weight: bold; }
        .up { color: #18e88a; }
        .down { color: #ff4d5c; }
        .confidence { color: #ffc928; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div class="finorix">
    <div class="header">
        <div>
            <div class="title">Finorix AI Market</div>
            <div class="market">
                <span class="live-dot"></span> USD/ARS (OTC) <span class="live">LIVE</span>
            </div>
        </div>
        <div class="tf">1min</div>
    </div>

    <div class="chart-area">
        <div id="chart"></div>
        <div class="advance-line">
            <span class="advance-text">ADVANCE</span>
        </div>
        <div id="price" class="price-label">985.50</div>
    </div>

    <div class="footer">
        <div>
            <span class="signal-title">AI SIGNAL</span>
            <span id="signal" class="signal up">UP</span>
        </div>
        <div>
            <span class="signal-title">CONFIDENCE</span>
            <span id="confidence" class="confidence">88%</span>
        </div>
    </div>
</div>

<script>
    const container = document.getElementById("chart");
    const chart = LightweightCharts.createChart(container, {
        width: container.clientWidth,
        height: container.clientHeight,
        layout: {
            background: { color: "#080b12" },
            textColor: "#8993a4"
        },
        grid: {
            vertLines: { color: "rgba(255,255,255,0.04)" },
            horzLines: { color: "rgba(255,255,255,0.04)" }
        },
        rightPriceScale: {
            borderColor: "rgba(255,255,255,.1)",
            scaleMargins: { top: 0.15, bottom: 0.15 }
        },
        timeScale: {
            borderColor: "rgba(255,255,255,.1)",
            timeVisible: true,
            secondsVisible: false,
            rightOffset: 4,
            barSpacing: 10
        }
    });

    const candlestickSeries = chart.addCandlestickSeries({
        upColor: "#18d879",
        downColor: "#ff4b3e",
        borderUpColor: "#18d879",
        borderDownColor: "#ff4b3e",
        wickUpColor: "#18d879",
        wickDownColor: "#ff4b3e"
    });

    // Generate initial realistic candles
    let currentTime = Math.floor(Date.now() / 1000) - (60 * 50);
    let lastClose = 985.50;
    const initialData = [];

    for (let i = 0; i < 50; i++) {
        let open = lastClose;
        let change = (Math.random() - 0.48) * 1.5;
        let close = open + change;
        let high = Math.max(open, close) + Math.random() * 0.8;
        let low = Math.min(open, close) - Math.random() * 0.8;
        
        initialData.push({
            time: currentTime,
            open: parseFloat(open.toFixed(2)),
            high: parseFloat(high.toFixed(2)),
            low: parseFloat(low.toFixed(2)),
            close: parseFloat(close.toFixed(2))
        });
        
        lastClose = close;
        currentTime += 60;
    }

    candlestickSeries.setData(initialData);

    // Real-time live candle update simulation
    let lastCandle = initialData[initialData.length - 1];
    
    setInterval(() => {
        let change = (Math.random() - 0.49) * 0.6;
        lastCandle.close = parseFloat((lastCandle.close + change).toFixed(2));
        lastCandle.high = Math.max(lastCandle.high, lastCandle.close);
        lastCandle.low = Math.min(lastCandle.low, lastCandle.close);

        candlestickSeries.update(lastCandle);
        document.getElementById("price").innerText = lastCandle.close.toFixed(2);
    }, 1000);

    // AI Signal Switcher
    setInterval(() => {
        const signal = document.getElementById("signal");
        const confidence = document.getElementById("confidence");
        
        const isUp = Math.random() > 0.4;
        signal.innerText = isUp ? "UP" : "DOWN";
        signal.className = isUp ? "signal up" : "signal down";

        confidence.innerText = Math.floor(82 + Math.random() * 15) + "%";
    }, 6000);

    window.addEventListener("resize", () => {
        chart.applyOptions({
            width: container.clientWidth,
            height: container.clientHeight
        });
    });
</script>

</body>
</html>
