<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Finorix AI Market Pro</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #05070d;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 8px;
    }

    .app {
      width: 100%;
      max-width: 950px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 16px 16px 0 0;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .market {
      margin-top: 6px;
      font-size: 13px;
      color: #00e6a0;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00e6a0;
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 8px #00e6a0;
    }

    .timeframe {
      background: #182343;
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 430px;
      background: #080c17;
      border-left: 1px solid #28365e;
      border-right: 1px solid #28365e;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    .advance-line {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 18%;
      border-left: 2px dashed rgba(255, 255, 255, 0.65);
      pointer-events: none;
      z-index: 3;
    }

    .advance-label {
      position: absolute;
      top: 12px;
      right: calc(18% - 35px);
      font-size: 11px;
      color: #ffffff;
      font-weight: bold;
      pointer-events: none;
      z-index: 3;
    }

    .price {
      position: absolute;
      right: 6px;
      top: 45%;
      background: #168cff;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      z-index: 3;
    }

    .status {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.65);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 10px;
      z-index: 5;
    }

    .bottom {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 0 0 16px 16px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signal-title,
    .confidence-title {
      font-size: 10px;
      color: #9ba4b7;
    }

    .signal {
      margin-top: 4px;
      color: #00e6a0;
      font-size: 22px;
      font-weight: bold;
    }

    .confidence {
      margin-top: 4px;
      color: #ffd21c;
      font-size: 22px;
      font-weight: bold;
      text-align: right;
    }

    .info-panel {
      margin-top: 8px;
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 12px;
      padding: 12px;
    }

    .info-title {
      font-size: 11px;
      color: #9ba4b7;
      margin-bottom: 8px;
    }

    .indicators {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .indicator {
      background: #0b1020;
      border: 1px solid #202d4d;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .indicator-name {
      font-size: 9px;
      color: #8e99af;
    }

    .indicator-value {
      margin-top: 4px;
      font-size: 12px;
      font-weight: bold;
    }

    .green {
      color: #00e6a0;
    }

    .red {
      color: #ff5364;
    }

    .yellow {
      color: #ffd21c;
    }

    @media (min-width: 700px) {
      body {
        padding: 20px;
      }

      .chart-box {
        height: 500px;
      }

      .title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div>
      <div class="title">
        Finorix AI Market Pro
      </div>

      <div class="market">
        <span class="live-dot"></span>
        <span id="marketName">EUR/USD</span>
        <strong id="liveText">CONNECTING...</strong>
      </div>
    </div>

    <div class="timeframe">
      1min
    </div>

  </div>


  <div class="chart-box">

    <div id="chart"></div>

    <div class="status" id="status">
      Connecting...
    </div>

    <div class="advance-line"></div>

    <div class="advance-label">
      ADVANCE
    </div>

    <div class="price" id="price">
      --
    </div>

  </div>


  <div class="bottom">

    <div>
      <div class="signal-title">
        AI SIGNAL
      </div>

      <div class="signal" id="signal">
        WAIT
      </div>
    </div>

    <div>
      <div class="confidence-title">
        CONFIDENCE
      </div>

      <div class="confidence" id="confidence">
        --%
      </div>
    </div>

  </div>


  <div class="info-panel">

    <div class="info-title">
      MARKET ANALYSIS
    </div>

    <div class="indicators">

      <div class="indicator">
        <div class="indicator-name">
          RSI (14)
        </div>

        <div class="indicator-value yellow" id="rsi">
          --
        </div>
      </div>


      <div class="indicator">
        <div class="indicator-name">
          EMA TREND
        </div>

        <div class="indicator-value" id="ema">
          --
        </div>
      </div>


      <div class="indicator">
        <div class="indicator-name">
          MACD
        </div>

        <div class="indicator-value" id="macd">
          --
        </div>
      </div>

    </div>

  </div>

</div>


<script>

const API_URL =
  "/api/market?symbol=EUR%2FUSD&interval=1min";


const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const liveTextElement =
  document.getElementById("liveText");

const marketNameElement =
  document.getElementById("marketName");


/* =========================
   CREATE CHART
========================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {
      layout: {
        background: {
          color: "#080c17"
        },

        textColor: "#aeb8cc"
      },

      grid: {
        vertLines: {
          color: "rgba(255,255,255,0.06)"
        },

        horzLines: {
          color: "rgba(255,255,255,0.06)"
        }
      },

      rightPriceScale: {
        borderColor: "#263454"
      },

      timeScale: {
        borderColor: "#263454",
        timeVisible: true,
        secondsVisible: false
      },

      crosshair: {
        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


const candleSeries =
  chart.addCandlestickSeries({

    upColor: "#00d6a0",
    downColor: "#ff5364",

    borderUpColor: "#00d6a0",
    borderDownColor: "#ff5364",

    wickUpColor: "#00d6a0",
    wickDownColor: "#ff5364"

  });


/* =========================
   MOBILE RESIZE
========================= */

function resizeChart() {

  chart.applyOptions({
    width: chartElement.clientWidth,
    height: chartElement.clientHeight
  });

}

window.addEventListener(
  "resize",
  resizeChart
);


/* =========================
   EMA
========================= */

function calculateEMA(
  values,
  period
) {

  if (
    !values ||
    values.length < period
  ) {
    return [];
  }

  const result = [];

  const multiplier =
    2 / (period + 1);

  let ema =
    values
      .slice(0, period)
      .reduce(
        (a, b) => a + b,
        0
      ) / period;

  result.push(ema);

  for (
    let i = period;
    i < values.length;
    i++
  ) {

    ema =
      (values[i] - ema) *
      multiplier +
      ema;

    result.push(ema);

  }

  return result;

}


/* =========================
   RSI
========================= */

function calculateRSI(
  values,
  period = 14
) {

  if (
    !values ||
    values.length <= period
  ) {
    return null;
  }

  let gains = 0;
  let losses = 0;

  for (
    let i = 1;
    i <= period;
    i++
  ) {

    const change =
      values[i] - values[i - 1];

    if (change >= 0) {
      gains += change;
    } else {
      losses -= change;
    }

  }

  let averageGain =
    gains / period;

  let averageLoss =
    losses / period;

  for (
    let i = period + 1;
    i < values.length;
    i++
  ) {

    const change =
      values[i] - values[i - 1];

    const gain =
      change > 0 ? change : 0;

    const loss =
      change < 0 ? -change : 0;

    averageGain =
      ((averageGain * (period - 1)) + gain)
      / period;

    averageLoss =
      ((averageLoss * (period - 1)) + loss)
      / period;

  }

  if (averageLoss === 0) {
    return 100;
  }

  const rs =
    averageGain / averageLoss;

  return 100 - (100 / (1 + rs));

}


/* =========================
   MACD
========================= */

function calculateMACD(
  values
) {

  if (
    !values ||
    values.length < 35
  ) {
    return null;
  }

  const ema12 =
    calculateEMA(values, 12);

  const ema26 =
    calculateEMA(values, 26);

  const macdValues = [];

  const start =
    26 - 12;

  for (
    let i = 0;
    i < ema26.length;
    i++
  ) {

    const fast =
      ema12[i + start];

    const slow =
      ema26[i];

    macdValues.push(
      fast - slow
    );

  }

  if (macdValues.length < 9) {
    return null;
  }

  const signalLine =
    calculateEMA(
      macdValues,
      9
    );

  const macd =
    macdValues[
      macdValues.length - 1
    ];

  const signal =
    signalLine[
      signalLine.length - 1
    ];

  return {
    macd,
    signal,
    histogram:
      macd - signal
  };

}


/* =========================
   FORMAT TIME
========================= */

function candleTimeToUnix(
  value
) {

  if (
    typeof value === "number"
  ) {

    if (value > 10000000000) {
      return Math.floor(
        value / 1000
      );
    }

    return value;
  }

  const parsed =
    Date.parse(
      String(value).replace(
        " ",
        "T"
      ) + "Z"
    );

  if (
    Number.isNaN(parsed)
  ) {

    return null;

  }

  return Math.floor(
    parsed / 1000
  );

}


/* =========================
   LOAD MARKET DATA
========================= */

async function loadMarketData() {

  try {

    statusElement.textContent =
      "Loading market data...";

    const response =
      await fetch(
        API_URL,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }

    const data =
      await response.json();


    if (
      data.status !== "ok"
    ) {

      throw new Error(
        "API status is not OK"
      );

    }


    if (
      !Array.isArray(
        data.candles
      ) ||
      data.candles.length === 0
    ) {

      throw new Error(
        "No candle data received"
      );

    }


    /* =========================
       MARKET STATUS
    ========================= */

    const symbol =
      data.symbol ||
      "EUR/USD";

    marketNameElement.textContent =
      symbol;

    liveTextElement.textContent =
      "LIVE";

    statusElement.textContent =
      "Connected • " +
      (data.source || "Market Data");


    /* =========================
       PREPARE CANDLES
    ========================= */

    const candles =
      data.candles
        .map(c => {

          const time =
            candleTimeToUnix(
              c.time
            );

          return {

            time,

            open:
              Number(c.open),

            high:
              Number(c.high),

            low:
              Number(c.low),

            close:
              Number(c.close)

          };

        })
        .filter(c =>
          c.time &&
          Number.isFinite(c.open) &&
          Number.isFinite(c.high) &&
          Number.isFinite(c.low) &&
          Number.isFinite(c.close)
        )
        .sort(
          (a, b) =>
            a.time - b.time
        );


    if (
      candles.length === 0
    ) {

      throw new Error(
        "Invalid candle data"
      );

    }


    /* =========================
       REMOVE DUPLICATES
    ========================= */

    const uniqueCandles = [];

    const seen =
      new Set();

    for (
      const candle of candles
    ) {

      if (
        seen.has(candle.time)
      ) {
        continue;
      }

      seen.add(candle.time);

      uniqueCandles.push(
        candle
      );

    }


    /* =========================
       SHOW CHART
    ========================= */

    candleSeries.setData(
      uniqueCandles
    );

    chart.timeScale().fitContent();

    resizeChart();


    /* =========================
       PRICE
    ========================= */

    const lastCandle =
      uniqueCandles[
        uniqueCandles.length - 1
      ];

    const closes =
      uniqueCandles.map(
        c => c.close
      );

    priceElement.textContent =
      lastCandle.close.toFixed(5);


    /* =========================
       RSI
    ========================= */

    const rsi =
      calculateRSI(
        closes,
        14
      );


    if (
      rsi !== null
    ) {

      rsiElement.textContent =
        rsi.toFixed(1);

      if (rsi >= 70) {

        rsiElement.className =
          "indicator-value red";

      } else if (rsi <= 30) {

        rsiElement.className =
          "indicator-value green";

      } else {

        rsiElement.className =
          "indicator-value yellow";

      }

    }


    /* =========================
       EMA 9 / EMA 21
    ========================= */

    const ema9 =
      calculateEMA(
        closes,
        9
      );

    const ema21 =
      calculateEMA(
        closes,
        21
      );


    let emaTrend =
      "NEUTRAL";


    if (
      ema9.length &&
      ema21.length
    ) {

      const e9 =
        ema9[ema9.length - 1];

      const e21 =
        ema21[ema21.length - 1];

      if (e9 > e21) {

        emaTrend =
          "UP";

        emaElement.className =
          "indicator-value green";

      } else if (e9 < e21) {

        emaTrend =
          "DOWN";

        emaElement.className =
          "indicator-value red";

      } else {

        emaTrend =
          "NEUTRAL";

        emaElement.className =
          "indicator-value yellow";

      }

    }


    emaElement.textContent =
      emaTrend;


    /* =========================
       MACD
    ========================= */

    const macdData =
      calculateMACD(
        closes
      );


    let macdTrend =
      "NEUTRAL";


    if (
      macdData
    ) {

      if (
        macdData.histogram > 0
      ) {

        macdTrend =
          "BULLISH";

        macdElement.className =
          "indicator-value green";

      } else if (
        macdData.histogram < 0
      ) {

        macdTrend =
          "BEARISH";

        macdElement.className =
          "indicator-value red";

      } else {

        macdTrend =
          "NEUTRAL";

        macdElement.className =
          "indicator-value yellow";

      }

    }


    macdElement.textContent =
      macdTrend;


    /* =========================
       SIGNAL ENGINE
    ========================= */

    let upScore = 0;
    let downScore = 0;


    /* EMA */

    if (
      emaTrend === "UP"
    ) {

      upScore += 2;

    } else if (
      emaTrend === "DOWN"
    ) {

      downScore += 2;

    }


    /* RSI */

    if (
      rsi !== null
    ) {

      if (
        rsi > 50 &&
        rsi < 70
      ) {

        upScore += 1;

      } else if (
        rsi < 50 &&
        rsi > 30
      ) {

        downScore += 1;

      }

    }


    /* MACD */

    if (
      macdTrend === "BULLISH"
    ) {

      upScore += 2;

    } else if (
      macdTrend === "BEARISH"
    ) {

      downScore += 2;

    }


    /* Last candle */

    if (
      lastCandle.close >
      lastCandle.open
    ) {

      upScore += 1;

    } else if (
      lastCandle.close <
      lastCandle.open
    ) {

      downScore += 1;

    }


    const totalScore =
      upScore + downScore;


    let signal =
      "WAIT";

    let confidence =
      50;


    if (
      totalScore > 0
    ) {

      if (
        upScore > downScore
      ) {

        signal =
          "UP";

        confidence =
          Math.round(
            50 +
            (
              upScore /
              totalScore
            ) * 40
          );

      } else if (
        downScore > upScore
      ) {

        signal =
          "DOWN";

        confidence =
          Math.round(
            50 +
            (
              downScore /
              totalScore
            ) * 40
          );

      } else {

        signal =
          "WAIT";

        confidence =
          50;

      }

    }


    /* =========================
       DISPLAY SIGNAL
    ========================= */

    signalElement.textContent =
      signal;

    confidenceElement.textContent =
      confidence + "%";


    if (
      signal === "UP"
    ) {

      signalElement.className =
        "signal green";

    } else if (
      signal === "DOWN"
    ) {

      signalElement.className =
        "signal red";

    } else {

      signalElement.className =
        "signal yellow";

    }


  } catch (error) {

    console.error(
      "Market Error:",
      error
    );

    statusElement.textContent =
      "ERROR: " +
      error.message;

    liveTextElement.textContent =
      "OFFLINE";

    signalElement.textContent =
      "WAIT";

    confidenceElement.textContent =
      "--%";

  }

}


/* =========================
   START
========================= */

loadMarketData();


/* Refresh every 60 seconds */

setInterval(
  loadMarketData,
  60000
);

</script>

</body>
</html>
