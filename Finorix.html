<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Finorix AI Market Pro</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:0;
}

.app{
  width:100%;
  max-width:950px;
  margin:0 auto;
}


/* =====================================================
   HEADER
===================================================== */

.header{

  background:linear-gradient(
    135deg,
    #10182c,
    #080b15
  );

  border:1px solid #28365e;

  padding:14px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;
}

.title{

  font-size:20px;

  font-weight:700;
}

.market-row{

  margin-top:7px;

  display:flex;

  align-items:center;

  gap:8px;
}

.live-dot{

  width:9px;

  height:9px;

  flex:none;

  background:#00e6a0;

  border-radius:50%;

  box-shadow:
    0 0 10px #00e6a0;
}

.market-select{

  appearance:auto;

  background:#0a1326;

  color:#00e6a0;

  border:1px solid #28466d;

  border-radius:9px;

  padding:7px 28px 7px 10px;

  font-size:15px;

  font-weight:bold;

  outline:none;

  max-width:180px;
}

.market-select:focus{

  border-color:#00e6a0;
}

.live-text{

  color:#00e6a0;

  font-size:14px;

  font-weight:bold;
}

.market-type{

  color:#8793ab;

  font-size:11px;

  margin-left:2px;
}

.timeframe{

  background:#182343;

  padding:11px 15px;

  border-radius:12px;

  font-weight:bold;

  white-space:nowrap;
}


/* =====================================================
   CHART
===================================================== */

.chart-box{

  position:relative;

  width:100%;

  height:500px;

  background:#080c17;

  border-left:1px solid #28365e;

  border-right:1px solid #28365e;

  overflow:hidden;
}

#chart{

  width:100%;

  height:100%;
}

.status{

  position:absolute;

  top:10px;

  left:10px;

  z-index:20;

  background:rgba(0,0,0,.68);

  padding:8px 11px;

  border-radius:9px;

  font-size:12px;

  max-width:70%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =====================================================
   ADVANCE LINE
===================================================== */

.advance-line{

  position:absolute;

  top:0;

  bottom:0;

  right:17%;

  border-left:2px dashed rgba(255,255,255,.65);

  pointer-events:none;

  z-index:4;
}

.advance-label{

  position:absolute;

  top:20px;

  right:calc(17% - 38px);

  font-size:13px;

  font-weight:bold;

  color:#fff;

  z-index:4;
}


/* =====================================================
   LIVE PRICE
===================================================== */

.price{

  position:absolute;

  right:7px;

  top:45%;

  background:#168cff;

  padding:8px 11px;

  border-radius:8px;

  font-weight:bold;

  font-size:13px;

  z-index:15;

  box-shadow:
    0 4px 12px rgba(0,0,0,.25);
}


/* =====================================================
   CURRENT CANDLE TIMER
   THIS ELEMENT IS POSITIONED BY JAVASCRIPT
   DIRECTLY AGAINST THE CURRENT CANDLE
===================================================== */

.candle-timer{

  position:absolute;

  left:0;

  top:0;

  z-index:30;

  width:150px;

  padding:10px 10px 9px;

  background:rgba(5,10,20,.94);

  border:1px solid #304a76;

  border-radius:15px;

  box-shadow:
    0 8px 24px rgba(0,0,0,.40);

  pointer-events:none;

  transform:translate(12px,-50%);

  backdrop-filter:blur(8px);

  -webkit-backdrop-filter:blur(8px);
}

.timer-title{

  text-align:center;

  color:#aeb8cc;

  font-size:11px;

  letter-spacing:.3px;
}

.timer-value{

  margin-top:3px;

  text-align:center;

  color:#00e6a0;

  font-size:28px;

  line-height:30px;

  font-weight:800;

  font-variant-numeric:tabular-nums;
}

.timer-status{

  margin-top:2px;

  text-align:center;

  color:#9ba7bd;

  font-size:10px;

  font-weight:bold;
}

.timer-progress{

  height:4px;

  margin-top:8px;

  background:#1c2942;

  border-radius:10px;

  overflow:hidden;
}

.timer-progress-bar{

  width:0%;

  height:100%;

  background:#00e6a0;

  border-radius:10px;

  transition:width .25s linear;
}


/* =====================================================
   BOTTOM SIGNAL
===================================================== */

.bottom{

  background:linear-gradient(
    135deg,
    #10182c,
    #080b15
  );

  border:1px solid #28365e;

  padding:15px;

  display:grid;

  grid-template-columns:1fr auto 1fr;

  align-items:center;

  gap:10px;
}

.signal-title,
.confidence-title{

  font-size:12px;

  color:#9ba4b7;
}

.signal{

  margin-top:5px;

  font-size:28px;

  font-weight:bold;
}

.confidence{

  margin-top:5px;

  color:#ffd21c;

  font-size:27px;

  font-weight:bold;
}


/* =====================================================
   NEXT CANDLE PREDICTION
===================================================== */

.next-prediction{

  text-align:center;

  min-width:125px;
}

.next-label{

  color:#8994aa;

  font-size:10px;

  font-weight:bold;

  white-space:nowrap;
}

.next-direction{

  margin-top:3px;

  font-size:17px;

  font-weight:800;
}

.next-time{

  margin-top:3px;

  color:#b5bfd2;

  font-size:11px;

  font-variant-numeric:tabular-nums;
}


/* =====================================================
   ANALYSIS
===================================================== */

.analysis{

  background:linear-gradient(
    135deg,
    #10182c,
    #080b15
  );

  border:1px solid #28365e;

  padding:15px;
}

.analysis-title{

  font-size:15px;

  color:#aeb8cc;

  margin-bottom:12px;
}

.analysis-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.card{

  border:1px solid #263454;

  background:#080c19;

  border-radius:12px;

  padding:13px 8px;

  text-align:center;
}

.card-title{

  font-size:11px;

  color:#8f99ae;
}

.card-value{

  margin-top:7px;

  font-size:16px;

  font-weight:bold;
}


/* =====================================================
   EXTRA INFO
===================================================== */

.info{

  margin-top:10px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.info-card{

  background:#080c19;

  border:1px solid #263454;

  border-radius:12px;

  padding:12px;
}

.info-label{

  color:#8994aa;

  font-size:11px;
}

.info-value{

  margin-top:5px;

  font-size:14px;

  font-weight:bold;
}


/* =====================================================
   COLORS
===================================================== */

.up{

  color:#00e6a0 !important;
}

.down{

  color:#ff536d !important;
}

.neutral{

  color:#ffd21c !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .header{

    padding:13px;

    gap:8px;
  }

  .title{

    font-size:18px;
  }

  .market-row{

    flex-wrap:wrap;

    gap:6px;
  }

  .market-select{

    font-size:14px;

    max-width:150px;

    padding:7px 22px 7px 9px;
  }

  .live-text{

    font-size:13px;
  }

  .timeframe{

    padding:10px 13px;

    font-size:13px;
  }

  .chart-box{

    height:500px;

    border-left:0;

    border-right:0;
  }

  .bottom{

    padding:14px 12px;

    grid-template-columns:
      1fr auto 1fr;

    gap:5px;
  }

  .signal{

    font-size:27px;
  }

  .confidence{

    font-size:26px;
  }

  .next-prediction{

    min-width:105px;
  }

  .next-direction{

    font-size:15px;
  }

  .next-time{

    font-size:10px;
  }

  .candle-timer{

    width:132px;

    padding:8px;
  }

  .timer-value{

    font-size:24px;

    line-height:26px;
  }

  .analysis{

    padding:13px;
  }

  .analysis-grid{

    gap:7px;
  }

  .card{

    padding:11px 5px;
  }

  .card-value{

    font-size:14px;
  }

  .info{

    gap:7px;
  }
}


@media(max-width:380px){

  .chart-box{

    height:450px;
  }

  .title{

    font-size:16px;
  }

  .confidence,
  .signal{

    font-size:23px;
  }

  .next-prediction{

    min-width:90px;
  }

  .next-direction{

    font-size:13px;
  }
}

</style>

</head>

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   UPDATED FRONTEND ENGINE
========================================================= */


/* =========================================================
   SETTINGS
========================================================= */

const INTERVAL = "1min";

const REFRESH_MS = 15000;

/*
   Only 15 candles are visible on mobile.
   Older candles remain available for indicators.
*/
const VISIBLE_BARS = 15;


/* =========================================================
   MARKET CONFIG
========================================================= */

const marketSelect =
  document.getElementById("marketSelect");

const marketTypeLabel =
  document.getElementById("marketTypeLabel");

let selectedMarket =
  parseMarketSelection();


function parseMarketSelection(){

  const value =
    marketSelect.value.split("|");

  return {

    symbol:
      value[0] || "EUR/USD",

    marketType:
      value[1] || "real"

  };
}


/* =========================================================
   ELEMENTS
========================================================= */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");

const nextDirectionElement =
  document.getElementById("nextDirection");

const nextTimeElement =
  document.getElementById("nextTime");

const candleTimerElement =
  document.getElementById("candleTimer");

const timerValueElement =
  document.getElementById("timerValue");

const timerProgressElement =
  document.getElementById("timerProgress");


/* =========================================================
   API URL
========================================================= */

function getApiUrl(){

  const params =
    new URLSearchParams({

      symbol:
        selectedMarket.symbol,

      interval:
        INTERVAL,

      marketType:
        selectedMarket.marketType,

      market:
        selectedMarket.marketType,

      outputsize:
        "150"

    });


  return "/api/market?" +
    params.toString();
}


/*
   IMPORTANT:

   REAL:
   /api/market?symbol=EUR/USD&marketType=real

   OTC:
   /api/market?symbol=EUR/USD&marketType=otc

   Your backend must route OTC to a real OTC feed.
*/


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{

        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },


      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,


      grid:{

        vertLines:{
          color:
            "rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.06)"
        }
      },


      rightPriceScale:{

        borderColor:
          "#263454",

        scaleMargins:{

          top:0.08,

          bottom:0.12
        }
      },


      timeScale:{

        borderColor:
          "#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:2,

        barSpacing:13,

        minBarSpacing:7
      },


      crosshair:{

        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


/* =========================================================
   CANDLE SERIES
========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:
      "#00d6a0",

    downColor:
      "#ff536d",

    borderUpColor:
      "#00d6a0",

    borderDownColor:
      "#ff536d",

    wickUpColor:
      "#00d6a0",

    wickDownColor:
      "#ff536d",

    priceLineVisible:true,

    lastValueVisible:true
  });


/* =========================================================
   DATA
========================================================= */

let currentCandles = [];

let latestMarketPrice = null;

let lastLoadedCandleTime = null;


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(value){

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(
        value / 1000
      );
    }

    return Math.floor(value);
  }


  if(!value){

    return null;
  }


  /*
    Twelve Data forex datetime is UTC.
  */

  let text =
    String(value).trim();


  /*
    If timestamp is numeric text.
  */

  if(/^\d+$/.test(text)){

    const number =
      Number(text);

    if(number > 1000000000000){

      return Math.floor(
        number / 1000
      );
    }

    return number;
  }


  /*
    YYYY-MM-DD HH:MM:SS
    from Twelve Data
  */

  const match =
    text.match(
      /^(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})$/
    );


  if(match){

    const utc =
      Date.UTC(

        Number(match[1]),

        Number(match[2]) - 1,

        Number(match[3]),

        Number(match[4]),

        Number(match[5]),

        Number(match[6])

      );


    return Math.floor(
      utc / 1000
    );
  }


  const date =
    new Date(value);


  if(isNaN(date.getTime())){

    return null;
  }


  return Math.floor(
    date.getTime() / 1000
  );
}


/* =========================================================
   NORMALIZE CANDLES
========================================================= */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){

    return [];
  }


  const result = [];


  for(const item of raw){

    if(!item){

      continue;
    }


    const time =
      normalizeTime(

        item.time ??
        item.datetime ??
        item.timestamp

      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(

      !time ||

      !Number.isFinite(open) ||

      !Number.isFinite(high) ||

      !Number.isFinite(low) ||

      !Number.isFinite(close)

    ){

      continue;
    }


    result.push({

      time,

      open,

      high,

      low,

      close
    });
  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  const unique = [];


  for(const candle of result){

    const last =
      unique[
        unique.length - 1
      ];


    if(

      last &&
      last.time === candle.time

    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(candle);
    }
  }


  return unique;
}


/* =========================================================
   CURRENT MINUTE
========================================================= */

function getCurrentMinuteStart(){

  const now =
    Math.floor(
      Date.now() / 1000
    );


  return now -
    (now % 60);
}


/* =========================================================
   BUILD FORMING CANDLE
========================================================= */

function buildFormingCandle(){

  if(
    !currentCandles.length
  ){

    return null;
  }


  const currentMinute =
    getCurrentMinuteStart();


  const last =
    currentCandles[
      currentCandles.length - 1
    ];


  /*
    If API already supplied the current candle,
    use its values and update close from latest price.
  */

  if(last.time === currentMinute){

    const livePrice =
      latestMarketPrice ??
      last.close;


    return {

      time:
        currentMinute,

      open:
        last.open,

      high:
        Math.max(
          last.high,
          livePrice
        ),

      low:
        Math.min(
          last.low,
          livePrice
        ),

      close:
        livePrice
    };
  }


  /*
    API has not supplied the current minute yet.

    Create a temporary forming candle from
    the latest known market price.

    This gives the timer and candle a proper
    current-minute position.
  */

  const price =
    latestMarketPrice ??
    last.close;


  return {

    time:
      currentMinute,

    open:
      last.close,

    high:
      Math.max(
        last.close,
        price
      ),

    low:
      Math.min(
        last.close,
        price
      ),

    close:
      price
  };
}


/* =========================================================
   DISPLAY CANDLES
========================================================= */

function getDisplayCandles(){

  const base =
    currentCandles.slice();


  const forming =
    buildFormingCandle();


  if(!forming){

    return base;
  }


  const last =
    base[
      base.length - 1
    ];


  if(
    last &&
    last.time === forming.time
  ){

    base[
      base.length - 1
    ] = forming;

  }else{

    base.push(forming);
  }


  return base;
}


/* =========================================================
   VISIBLE RANGE
========================================================= */

function setMobileVisibleRange(){

  const total =
    getDisplayCandles().length;


  if(total <= 0){

    return;
  }


  const from =
    Math.max(
      0,
      total - VISIBLE_BARS - 1
    );


  const to =
    total + 1;


  chart.timeScale()
    .setVisibleLogicalRange({

      from,

      to
    });
}


/* =========================================================
   INDICATORS
========================================================= */

function calculateEMA(
  values,
  period
){

  if(
    values.length < period
  ){

    return null;
  }


  const multiplier =
    2 / (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema += values[i];
  }


  ema /= period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] - ema
      ) * multiplier
      + ema;
  }


  return ema;
}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(
    values.length <= period
  ){

    return null;
  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    if(change >= 0){

      gains += change;

    }else{

      losses +=
        Math.abs(change);
    }
  }


  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;


  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =
      (
        avgGain * (period - 1)
        + gain
      ) / period;


    avgLoss =
      (
        avgLoss * (period - 1)
        + loss
      ) / period;
  }


  if(avgLoss === 0){

    return 100;
  }


  const rs =
    avgGain /
    avgLoss;


  return 100 -
    (
      100 /
      (1 + rs)
    );
}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(values){

  if(
    values.length < 35
  ){

    return {

      macd:null,

      signal:null,

      histogram:null
    };
  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {

      macd:null,

      signal:null,

      histogram:null
    };
  }


  const macd =
    ema12 - ema26;


  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD =
    null;


  if(
    previousValues.length >= 35
  ){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );


    const p26 =
      calculateEMA(
        previousValues,
        26
      );


    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 - p26;
    }
  }


  const histogram =
    previousMACD === null
      ? 0
      : macd - previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram
  };
}


/* =========================================================
   SIGNAL ENGINE
========================================================= */

function calculateSignal(
  candles
){

  /*
    Do NOT use the forming candle for the
    main indicator calculation.

    This prevents the signal from changing
    every second simply because the current
    candle is moving.
  */

  if(
    candles.length < 35
  ){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"
    };
  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(
      ema9 > ema21
    ){

      emaTrend =
        "UP";

      score += 2;

    }else if(
      ema9 < ema21
    ){

      emaTrend =
        "DOWN";

      score -= 2;
    }
  }


  if(rsi !== null){

    if(rsi < 30){

      score += 1;

    }else if(rsi > 70){

      score -= 1;

    }else if(rsi > 50){

      score += .5;

    }else{

      score -= .5;
    }
  }


  let macdTrend =
    "NEUTRAL";


  if(
    macd.macd !== null
  ){

    if(
      macd.histogram > 0
    ){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(
      macd.histogram < 0
    ){

      macdTrend =
        "BEARISH";

      score -= 2;
    }
  }


  if(
    last > previous
  ){

    score += .5;

  }else if(
    last < previous
  ){

    score -= .5;
  }


  let signal =
    "WAIT";


  if(score >= 2){

    signal =
      "UP";

  }else if(
    score <= -2
  ){

    signal =
      "DOWN";
  }


  let confidence =
    50 +
    Math.abs(score) * 8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(confidence)
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd
  };
}

   UI SIGNAL
========================================================= */

){

  );

  ){

    );

  ){

    signalElement.classList.add(

    );

    nextDirectionElement.classList.add(
      "down"
    );


  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );


    nextDirectionElement.textContent =
      "WAIT";

    nextDirectionElement.classList.add(
      "neutral"
    );
  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence + "%"
      : "--%";


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.rsi !== null
  ){

    if(
      result.rsi > 70
    ){

      rsiElement.classList.add(
        "down"
      );

    }else if(
      result.rsi < 30
    ){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );
    }
  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.emaTrend === "UP"
  ){

    emaElement.classList.add(
      "up"
    );

  }else if(
    result.emaTrend === "DOWN"
  ){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );
  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.macdTrend === "BULLISH"
  ){

    macdElement.classList.add(
      "up"
    );

  }else if(
    result.macdTrend === "BEARISH"
  ){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );
  }


  nextCandleElement.textContent =
    result.signal;
}


/* =========================================================
   NEXT CANDLE TIME
========================================================= */

function getNextCandleTime(){

  const next =
    getCurrentMinuteStart()
    + 60;


  const date =
    new Date(
      next * 1000
    );


  return date.toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );
}


/* =========================================================
   CURRENT CANDLE TIMER
========================================================= */

function formatSeconds(seconds){

  const safe =
    Math.max(
      0,
      Math.min(
        59,
        seconds
      )
    );


  return "00:" +
    String(safe)
      .padStart(2,"0");
}


function updateCandleTimer(){

  const now =
    Math.floor(
      Date.now() / 1000
    );


  const currentStart =
    now -
    (now % 60);


  const elapsed =
    now -
    currentStart;


  /*
    00:00 -> 00:59
    then automatically resets to 00:00
  */

  timerValueElement.textContent =
    formatSeconds(
      elapsed
    );


  timerProgressElement.style.width =
    (
      (elapsed / 60) * 100
    ) + "%";


  nextTimeElement.textContent =
    "TIME " +
    getNextCandleTime();


  /*
    Rebuild current forming candle
    every second so the candle position
    remains synchronized with the timer.
  */

  if(
    currentCandles.length
  ){

    updateFormingCandle();
  }
}


/* =========================================================
   UPDATE FORMING CANDLE
========================================================= */

function updateFormingCandle(){

  const candles =
    getDisplayCandles();


  if(
    !candles.length
  ){

    return;
  }


  candleSeries.setData(
    candles
  );


  positionCandleTimer(
    candles[
      candles.length - 1
    ]
  );
}


/* =========================================================
   PIXEL-SYNCHRONIZED TIMER
========================================================= */

function positionCandleTimer(
  candle
){

  if(!candle){

    return;
  }


  /*
    Convert candle timestamp into
    actual chart X coordinate.
  */

  const x =
    chart.timeScale()
      .timeToCoordinate(
        candle.time
      );


  /*
    Convert candle price into
    actual chart Y coordinate.
  */

  const y =
    candleSeries.priceToCoordinate(
      candle.close
    );


  if(
    x === null ||
    y === null
  ){

    return;
  }


  const timerWidth =
    candleTimerElement.offsetWidth ||
    150;


  const timerHeight =
    candleTimerElement.offsetHeight ||
    100;


  const chartWidth =
    chartElement.clientWidth;


  const chartHeight =
    chartElement.clientHeight;


  /*
    Normally place the timer
    just to the right of current candle.
  */

  let left =
    x + 12;


  let top =
    y - 35;


  /*
    Keep inside chart.
  */

  if(
    left + timerWidth >
    chartWidth - 5
  ){

    left =
      x - timerWidth - 12;
  }


  if(
    left < 5
  ){

    left = 5;
  }


  if(
    top + timerHeight >
    chartHeight - 5
  ){

    top =
      chartHeight -
      timerHeight -
      5;
  }


  if(
    top < 55
  ){

    top = 55;
  }


  candleTimerElement.style.left =
    left + "px";


  candleTimerElement.style.top =
    top + "px";


  /*
    Cancel the normal transform
    because we are now using exact
    pixel coordinates.
  */

  candleTimerElement.style.transform =
    "none";
}


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(){

  try{

    selectedMarket =
      parseMarketSelection();


    marketTypeLabel.textContent =
      selectedMarket.marketType
        .toUpperCase();


    statusElement.textContent =
      "Connecting • " +
      selectedMarket.symbol;


    const response =
      await fetch(
        getApiUrl(),
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    /*
      Support multiple API formats.
    */

    let rawCandles = [];


    if(
      Array.isArray(data)
    ){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;

    }else if(
      Array.isArray(
        data.values
      )
    ){

      rawCandles =
        data.values;
    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(
      !candles.length
    ){

      throw new Error(
        "No valid candle data"
      );
    }


    currentCandles =
      candles;


    lastLoadedCandleTime =
      candles[
        candles.length - 1
      ].time;


    latestMarketPrice =
      candles[
        candles.length - 1
      ].close;


    /*
      If API provides latest price
      separately, use it.
    */

    if(
      data.market &&
      Number.isFinite(
        Number(
          data.market.latestPrice
        )
      )
    ){

      latestMarketPrice =
        Number(
          data.market.latestPrice
        );
    }


    if(
      Number.isFinite(
        Number(
          data.latestPrice
        )
      )
    ){

      latestMarketPrice =
        Number(
          data.latestPrice
        );
    }


    /* =====================================================
       CHART DATA
    ===================================================== */

    const displayCandles =
      getDisplayCandles();


    candleSeries.setData(
      displayCandles
    );


    /*
      Keep approximately 15 latest candles
      large and readable on mobile.
    */

    setMobileVisibleRange();


    /* =====================================================
       PRICE
    ===================================================== */

    const last =
      displayCandles[
        displayCandles.length - 1
      ];


    const price =
      last.close;


    priceElement.textContent =
      Number(price).toFixed(5);


    lastPriceElement.textContent =
      Number(price).toFixed(5);


    candleCountElement.textContent =
      candles.length;


    /* =====================================================
       SIGNAL
    ===================================================== */

    /*
      Use completed candles for signal.
    */

    const completed =
      candles.filter(
        c =>
          c.time <
          getCurrentMinuteStart()
      );


    const result =
      calculateSignal(
        completed.length >= 35
          ? completed
          : candles
      );


    setSignalUI(
      result
    );


    /* =====================================================
       STATUS
    ===================================================== */

    statusElement.textContent =
      "Connected • " +
      (
        selectedMarket.marketType ===
        "otc"
          ? "OTC Feed"
          : "Twelve Data"
      ) +
      " • " +
      selectedMarket.symbol;


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();


    /*
      Immediately position timer
      against current candle.
    */

    positionCandleTimer(
      displayCandles[
        displayCandles.length - 1
      ]
    );


  }catch(error){

    console.error(
      "Finorix error:",
      error
    );


    statusElement.textContent =
      (
        selectedMarket.marketType ===
        "otc"
      )
        ? "OTC feed unavailable"
        : "Connection error";


    /*
      Do NOT destroy the old chart
      when a refresh fails.

      This prevents the dashboard from
      becoming blank during a temporary
      API error.
    */

    if(
      !currentCandles.length
    ){

      signalElement.textContent =
        "WAIT";

      confidenceElement.textContent =
        "--%";
    }
  }
}


/* =========================================================
   MARKET CHANGE
========================================================= */

marketSelect.addEventListener(
  "change",
  () => {

    selectedMarket =
      parseMarketSelection();


    /*
      Clear old market state only AFTER
      a new market has actually been selected.
    */

    currentCandles = [];

    latestMarketPrice = null;

    lastLoadedCandleTime = null;


    candleSeries.setData([]);


    signalElement.textContent =
      "WAIT";


    signalElement.classList.remove(
      "up",
      "down",
      "neutral"
    );

    signalElement.classList.add(
      "neutral"
    );


    confidenceElement.textContent =
      "--%";


    nextDirectionElement.textContent =
      "WAIT";


    nextDirectionElement.className =
      "next-direction neutral";


    loadMarket();

  }
);


/* =========================================================
   RESPONSIVE CHART
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height
    });


    const candles =
      getDisplayCandles();


    if(
      candles.length
    ){

      positionCandleTimer(
        candles[
          candles.length - 1
        ]
      );
    }
  }
}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   CHART SCROLL / RANGE CHANGE
========================================================= */

chart.timeScale()
  .subscribeVisibleLogicalRangeChange(
    () => {

      const candles =
        getDisplayCandles();


      if(
        candles.length
      ){

        positionCandleTimer(
          candles[
            candles.length - 1
          ]
        );
      }
    }
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMarket();


/* =========================================================
   MARKET DATA REFRESH
========================================================= */

setInterval(
  loadMarket,
  REFRESH_MS
);


/* =========================================================
   EXACT 1-SECOND CANDLE CLOCK
========================================================= */

updateCandleTimer();


setInterval(
  updateCandleTimer,
  1000
);

</script>
