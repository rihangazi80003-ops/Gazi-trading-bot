<!-- FINORIX AI MINI LIVE MARKET -->
<div class="finorix-market">

  <div class="finorix-header">
    <div>
      <div class="finorix-title">Finorix AI Market</div>
      <div class="finorix-pair">
        🇦🇷 USD/ARS (OTC)
        <span class="live-dot"></span>
        LIVE
      </div>
    </div>

    <div class="timeframe">1m</div>
  </div>

  <div class="chart-wrap">

    <div id="priceChart"></div>

    <!-- Current price -->
    <div id="currentPrice" class="current-price">
      1460.14
    </div>

    <!-- Future candle marker -->
    <div class="future-marker">
      <span>ADVANCE</span>
    </div>

  </div>

  <div class="finorix-footer">

    <div>
      <span class="signal-label">AI SIGNAL</span>
      <span id="signal" class="signal-up">UP</span>
    </div>

    <div id="confidence" class="confidence">
      86%
    </div>

  </div>

</div>


<!-- Lightweight Charts -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<style>

.finorix-market {
  width: 100%;
  max-width: 360px;
  background: #070a10;
  border: 1px solid #242b38;
  border-radius: 15px;
  overflow: hidden;
  color: white;
  font-family: Arial, sans-serif;
  box-shadow: 0 12px 35px rgba(0,0,0,.45);
}

.finorix-header {
  height: 58px;
  padding: 10px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0b0f17;
  border-bottom: 1px solid #1d2430;
}

.finorix-title {
  font-size: 14px;
  font-weight: 700;
}

.finorix-pair {
  margin-top: 5px;
  font-size: 12px;
  color: #b8bec9;
}

.live-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 5px;
  margin-right: 3px;
  border-radius: 50%;
  background: #22e28a;
  box-shadow: 0 0 8px #22e28a;
}

.timeframe {
  padding: 6px 10px;
  border-radius: 7px;
  background: #151b25;
  font-size: 12px;
  color: #d9dce3;
}

.chart-wrap {
  position: relative;
  width: 100%;
  height: 260px;
  background: #080c13;
}

#priceChart {
  width: 100%;
  height: 100%;
}

.current-price {
  position: absolute;
  right: 4px;
  top: 48%;
  background: #148ee8;
  color: white;
  padding: 5px 8px;
  border-radius: 5px 0 0 5px;
  font-size: 11px;
  font-weight: bold;
  z-index: 5;
}

.future-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 72px;
  width: 1px;
  border-left: 1px dashed rgba(255,255,255,.45);
  pointer-events: none;
}

.future-marker span {
  position: absolute;
  top: 8px;
  left: -29px;
  font-size: 8px;
  color: #9da5b2;
  white-space: nowrap;
}

.finorix-footer {
  height: 43px;
  padding: 0 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #0b0f17;
  border-top: 1px solid #1d2430;
}

.signal-label {
  color: #777f8d;
  font-size: 9px;
  margin-right: 5px;
}

.signal-up {
  color: #16e88a;
  font-size: 13px;
  font-weight: bold;
}

.signal-down {
  color: #ff4c5b;
  font-size: 13px;
  font-weight: bold;
}

.confidence {
  color: #f4bd38;
  font-weight: bold;
  font-size: 14px;
}

</style>


<script>

const chartElement = document.getElementById("priceChart");

const chart = LightweightCharts.createChart(chartElement, {

  layout: {
    background: {
      color: "#080c13"
    },
    textColor: "#8c95a5"
  },

  grid: {
    vertLines: {
      color: "rgba(255,255,255,0.06)"
    },
    horzLines: {
      color: "rgba(255,255,255,0.06)"
    }
  },

  rightPriceScale: {
    borderColor: "rgba(255,255,255,0.12)"
  },

  timeScale: {
    borderColor: "rgba(255,255,255,0.12)",
    timeVisible: true,
    secondsVisible: false
  },

  crosshair: {
    mode: LightweightCharts.CrosshairMode.Normal
  },

  width: chartElement.clientWidth,
  height: chartElement.clientHeight
});


const candleSeries = chart.addCandlestickSeries({

  upColor: "#16d878",
  downColor: "#ff4b3e",

  borderUpColor: "#16d878",
  borderDownColor: "#ff4b3e",

  wickUpColor: "#16d878",
  wickDownColor: "#ff4b3e"
});


/*
   Initial market candles
*/

let candles = [

  {time: 1710000000, open:1460.02, high:1460.12, low:1459.94, close:1460.08},

  {time: 1710000060, open:1460.08, high:1460.25, low:1460.02, close:1460.20},

  {time: 1710000120, open:1460.20, high:1460.31, low:1460.12, close:1460.27},

  {time: 1710000180, open:1460.27, high:1460.29, low:1460.05, close:1460.11},

  {time: 1710000240, open:1460.11, high:1460.22, low:1459.98, close:1460.04},

  {time: 1710000300, open:1460.04, high:1460.18, low:1459.91, close:1459.97},

  {time: 1710000360, open:1459.97, high:1460.10, low:1459.88, close:1460.06},

  {time: 1710000420, open:1460.06, high:1460.35, low:1460.01, close:1460.28},

  {time: 1710000480, open:1460.28, high:1460.44, low:1460.19, close:1460.36},

  {time: 1710000540, open:1460.36, high:1460.41, low:1460.08, close:1460.14}

];

candleSeries.setData(candles);


/*
   Current live candle
*/

let currentCandle = {

  time: 1710000600,

  open: 1460.14,

  high: 1460.14,

  low: 1460.14,

  close: 1460.14

};

candleSeries.update(currentCandle);


/*
   Simulated live price movement

   Later this section can be replaced
   with real OTC WebSocket/API data.
*/

let price = 1460.14;

setInterval(() => {

  const movement =
    (Math.random() - 0.48) * 0.08;

  price += movement;

  currentCandle.close = price;

  if (price > currentCandle.high)
    currentCandle.high = price;

  if (price < currentCandle.low)
    currentCandle.low = price;

  candleSeries.update(currentCandle);

  document.getElementById("currentPrice")
    .innerText = price.toFixed(2);

}, 1000);


/*
   Create a new 1-minute candle
*/

setInterval(() => {

  const newTime =
    currentCandle.time + 60;

  currentCandle = {

    time: newTime,

    open: price,

    high: price,

    low: price,

    close: price

  };

  candleSeries.update(currentCandle);

}, 60000);


/*
   Responsive chart
*/

window.addEventListener("resize", () => {

  chart.applyOptions({

    width: chartElement.clientWidth,

    height: chartElement.clientHeight

  });

});

</script>
