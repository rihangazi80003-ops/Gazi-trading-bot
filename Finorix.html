<html lang="en">

<head>

<meta charset="UTF-8">

<meta

<title>Finorix AI Market Pro</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:8px;
}

.app{
  width:100%;
  max-width:950px;
  margin:0 auto;
}


/* =========================================================
   HEADER
========================================================= */

.header{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  border-radius:
    18px 18px 0 0;

  padding:14px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}


.header-left{
  min-width:0;
}


.title{

  font-size:20px;

  font-weight:700;

}


.market-row{

  margin-top:7px;

  display:flex;

  align-items:center;

  gap:7px;

  flex-wrap:wrap;

}


.live-dot{

  display:inline-block;

  width:9px;

  height:9px;

  background:#00e6a0;

  border-radius:50%;

  box-shadow:
    0 0 10px #00e6a0;

}


.market-select{

  background:#0b1223;

  color:#00e6a0;

  border:1px solid #2b416d;

  border-radius:8px;

  padding:6px 9px;

  font-size:14px;

  font-weight:bold;

  outline:none;

  max-width:180px;

}


.market-select:focus{

  border-color:#00e6a0;

}


.live-text{

  font-size:11px;

  color:#00e6a0;

  font-weight:bold;

}


.timeframe{

  background:#182343;

  padding:10px 14px;

  border-radius:10px;

  font-weight:bold;

  white-space:nowrap;

}


/* =========================================================
   CHART AREA
========================================================= */

.chart-box{

  position:relative;

  width:100%;

  height:480px;

  background:#080c17;

  border-left:1px solid #28365e;

  border-right:1px solid #28365e;

  overflow:hidden;

}


#chart{

  width:100%;

  height:100%;

}


/* connection status */

.status{

  position:absolute;

  top:10px;

  left:10px;

  z-index:20;

  background:rgba(0,0,0,.65);

  padding:7px 10px;

  border-radius:8px;

  font-size:11px;

  pointer-events:none;

}


/* =========================================================
   ADVANCE LINE
========================================================= */

.advance-line{

  position:absolute;

  top:0;

  bottom:0;

  right:17%;

  border-left:
    2px dashed
    rgba(255,255,255,.45);

  pointer-events:none;

  z-index:4;

}


.advance-label{

  position:absolute;

  top:18px;

  right:calc(17% - 38px);

  font-size:12px;

  font-weight:bold;

  color:#fff;

  z-index:4;

  pointer-events:none;

}


/* =========================================================
   CURRENT PRICE
========================================================= */

.price{

  position:absolute;

  right:7px;

  top:45%;

  background:#168cff;

  padding:6px 9px;

  border-radius:6px;

  font-weight:bold;

  font-size:12px;

  z-index:12;

  pointer-events:none;

}


/* =========================================================
   RUNNING CANDLE TIMER
   IMPORTANT:
   This is NOT a fixed box.
   JS dynamically moves it according to
   the latest candle coordinates.
========================================================= */

.candle-timer{

  position:absolute;

  z-index:30;

  pointer-events:none;

  display:none;

  white-space:nowrap;

  background:rgba(5,8,16,.88);

  border:1px solid rgba(255,255,255,.22);

  border-radius:6px;

  padding:3px 6px;

  font-size:11px;

  line-height:1;

  font-weight:bold;

  color:#ffffff;

  box-shadow:
    0 2px 8px rgba(0,0,0,.35);

  transform:
    translate(0,-100%);

}


/*
  small pointer
*/

.candle-timer::after{

  content:"";

  position:absolute;

  left:8px;

  bottom:-4px;

  width:7px;

  height:7px;

  background:rgba(5,8,16,.88);

  border-right:
    1px solid
    rgba(255,255,255,.22);

  border-bottom:
    1px solid
    rgba(255,255,255,.22);

  transform:rotate(45deg);

}


/* =========================================================
   BOTTOM SIGNAL
========================================================= */

.bottom{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  padding:15px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

}


.signal-title,

  font-size:12px;

  color:#9ba4b7;

}


.signal{

  margin-top:5px;

  font-size:28px;

  font-weight:bold;

}


.confidence{

  margin-top:5px;

  color:#ffd21c;

  font-size:27px;

  font-weight:bold;

}


/* =========================================================
   ANALYSIS
========================================================= */

.analysis{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  border-radius:
    0 0 18px 18px;

  padding:15px;

}


.analysis-title{

  font-size:15px;

  color:#aeb8cc;

  margin-bottom:12px;

}


.analysis-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;

}


.card{

  border:1px solid #263454;

  background:#080c19;

  border-radius:12px;

  padding:13px 8px;

  text-align:center;

}


.card-title{

  font-size:11px;

  color:#8f99ae;

}


.card-value{

  margin-top:7px;

  font-size:16px;

  font-weight:bold;

}


/* =========================================================
   EXTRA INFO
========================================================= */

.info{

  margin-top:10px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;

}


.info-card{

  background:#080c19;

  border:1px solid #263454;

  border-radius:12px;

  padding:12px;

}


.info-label{

  color:#8994aa;

  font-size:11px;

}


.info-value{

  margin-top:5px;

  font-size:14px;

  font-weight:bold;

}


/* =========================================================
   COLORS
========================================================= */

.up{
  color:#00e6a0 !important;
}

.down{
  color:#ff536d !important;
}

.neutral{
  color:#ffd21c !important;

/* =========================================================

========================================================= */

  .card{

<script>


/* =========================================================

/* =========================================================

const INTERVAL = "1min";

const REFRESH_MS = 15000;


/*
  Visible candles on mobile.

  Data will still contain 150 candles,
  but the chart will show approximately
  12-15 recent candles.
*/

const VISIBLE_CANDLES = 14;


/*

*/

  "EUR/USD";


/*

*/

let currentCandles = [];


/*
  Prevent overlapping API requests
*/

let isLoading = false;


/* =========================================================
   ELEMENTS
========================================================= */

  );


const statusElement =

const marketSelect =

  );


const selectedMarketElement =

  );


const pairTypeElement =
  document.getElementById(

  );


const liveTextElement =
  document.getElementById(
    "liveText"
  );

  );


/* =========================================================
   API URL
========================================================= */

function getAPIURL(){

  return (
    "/api/market?symbol=" +
    encodeURIComponent(
      currentSymbol
    ) +
    "&interval=" +
    encodeURIComponent(
      INTERVAL
    ) +
    "&_=" +
    Date.now()
  );

}


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{

        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"

      },


      width:
        chartElement.clientWidth,


      height:
        chartElement.clientHeight,


      grid:{

        },

        }

      },

      },

        secondsVisible:false,

/* =========================================================
   CANDLE SERIES
========================================================= */

const candleSeries =

    borderUpColor:

    borderDownColor:

    wickDownColor:

    priceLineVisible:true,

    lastValueVisible:true

/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(
  value
){

  if(
    typeof value ===
    "number"
  ){

    if(
      value >
      1000000000000
    ){

      return Math.floor(
        value / 1000
      );

    }

    return Math.floor(
      value
    );

  }


  if(!value){

    return null;

  }


  const stringValue =
    String(value)
      .trim();


  /*
    Full ISO / datetime
  */

  let date =
    new Date(
      stringValue
    );


  /*
    If API datetime is:

    2026-08-17 16:51:00

    JavaScript may interpret it
    according to browser timezone.

    We explicitly treat it as UTC.
  */

  if(
    /^\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}$/
      .test(stringValue)
  ){

    date =
      new Date(
        stringValue
          .replace(" ","T") +
        "Z"
      );

  }


  /*
    HH:MM:SS only
  */

  if(
    isNaN(
      date.getTime()
    )
  ){

    const parts =
      stringValue.split(":");


    if(
      parts.length >= 2
    ){

      const now =
        new Date();


      now.setHours(
        Number(parts[0]) || 0,
        Number(parts[1]) || 0,
        Number(parts[2]) || 0,
        0
      );


      date = now;

    }

  }


  if(
    isNaN(
      date.getTime()
    )
  ){

    return null;

  }


  return Math.floor(
    date.getTime() / 1000
  );

}


/* =========================================================
   NORMALIZE CANDLES
========================================================= */

function normalizeCandles(
  raw
){

  if(
    !Array.isArray(raw)
  ){

    return [];

  }


  const result = [];


  for(
    const item of raw
  ){

    if(!item){

      continue;

    }


    const time =
      normalizeTime(

        item.time ??
        item.datetime ??
        item.timestamp

      );


    const open =
      Number(
        item.open
      );


    const high =
      Number(
        item.high
      );


    const low =
      Number(
        item.low
      );


    const close =
      Number(
        item.close
      );


    if(

      !time ||

      !Number.isFinite(
        open
      ) ||

      !Number.isFinite(
        high
      ) ||

      !Number.isFinite(
        low
      ) ||

      !Number.isFinite(
        close
      )

    ){

      continue;

    }


    if(
      high < low
    ){

      continue;

    }


    if(
      high < open ||
      high < close
    ){

      continue;

    }


    if(
      low > open ||
      low > close
    ){

      continue;

    }


    result.push({

      time,

      open,

      high,

      low,

      close

    });

  }


  /*
    Oldest → newest
  */

  result.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Remove duplicates
  */

  const unique = [];


  for(
    const candle of result
  ){

    const last =
      unique[
        unique.length - 1
      ];


    if(
      last &&
      last.time ===
      candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(
        candle
      );

    }

  }


  return unique;

}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
  values,
  period
){

  if(
    values.length <
    period
  ){

    return null;

  }


  const multiplier =
    2 /
    (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema +=
      values[i];

  }


  ema /=
    period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] -
        ema
      ) *
      multiplier +
      ema;

  }


  return ema;

}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(
    values.length <=
    period
  ){

    return null;

  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i-1];


    if(
      change >= 0
    ){

      gains +=
        change;

    }else{

      losses +=
        Math.abs(
          change
        );

    }

  }


  let avgGain =
    gains / period;


  let avgLoss =
    losses / period;


  for(
    let i =
      period + 1;

    i <
      values.length;

    i++
  ){

    const change =
      values[i] -
      values[i-1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =
      (
        avgGain *
        (period - 1) +
        gain
      ) /
      period;


    avgLoss =
      (
        avgLoss *
        (period - 1) +
        loss
      ) /
      period;

  }


  if(
    avgLoss === 0
  ){

    return 100;

  }


  const rs =
    avgGain /
    avgLoss;


  return (
    100 -
    (
      100 /
      (1 + rs)
    )
  );

}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(
  values
){

  if(
    values.length < 35
  ){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {

      macd:null,

      signal:null,

      histogram:null

    };

  }


  const macd =
    ema12 -
    ema26;


  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD =
    null;


  if(
    previousValues.length >= 35
  ){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );


    const p26 =
      calculateEMA(
        previousValues,
        26
      );


    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 -
        p26;

    }

  }


  const histogram =
    previousMACD === null
      ? 0
      : macd -
        previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram

  };

}


/* =========================================================
   SIGNAL ENGINE
========================================================= */

function calculateSignal(
  candles
){

  if(
    candles.length < 35
  ){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"

    };

  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  /* EMA */

  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(
      ema9 >
      ema21
    ){

      emaTrend =
        "UP";

      score += 2;

    }else if(
      ema9 <
      ema21
    ){

      emaTrend =
        "DOWN";

      score -= 2;

    }

  }


  /* RSI */

  if(
    rsi !== null
  ){

    if(
      rsi < 30
    ){

      score += 1;

    }else if(
      rsi > 70
    ){

      score -= 1;

    }else if(
      rsi > 50
    ){

      score += 0.5;

    }else{

      score -= 0.5;

    }

  }


  /* MACD */

  let macdTrend =
    "NEUTRAL";


  if(
    macd.macd !== null
  ){

    if(
      macd.histogram > 0
    ){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(
      macd.histogram < 0
    ){

      macdTrend =
        "BEARISH";

      score -= 2;

    }

  }


  /* Last candle */

  if(
    last > previous
  ){

    score += 0.5;

  }else if(
    last < previous
  ){

    score -= 0.5;

  }


  let signal =
    "WAIT";


  if(
    score >= 2
  ){

    signal =
      "UP";

  }else if(
    score <= -2
  ){

    signal =
      "DOWN";

  }


  let confidence =
    50 +
    Math.abs(score) *
    8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          confidence
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd

  };

}


/* =========================================================
   SIGNAL UI
========================================================= */

function setSignalUI(
  result
){

  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.signal ===
    "UP"
  ){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(
    result.signal ===
    "DOWN"
  ){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );

  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence +
        "%"
      : "--%";


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.rsi !== null
  ){

    if(
      result.rsi > 70
    ){

      rsiElement.classList.add(
        "down"
      );

    }else if(
      result.rsi < 30
    ){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );

    }

  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.emaTrend ===
    "UP"
  ){

    emaElement.classList.add(
      "up"
    );

  }else if(
    result.emaTrend ===
    "DOWN"
  ){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );

  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.macdTrend ===
    "BULLISH"
  ){

    macdElement.classList.add(
      "up"
    );

  }else if(
    result.macdTrend ===
    "BEARISH"
  ){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );

  }


  nextCandleElement.textContent =
    result.signal;

}


/* =========================================================
   VISIBLE CANDLE WINDOW
========================================================= */

function showRecentCandles(){

  if(
    currentCandles.length === 0
  ){

    return;

  }


  const total =
    currentCandles.length;


  const visible =
    Math.min(
      VISIBLE_CANDLES,
      total
    );


  const from =
    Math.max(
      0,
      total - visible
    );


  const firstTime =
    currentCandles[
      from
    ].time;


  const lastTime =
    currentCandles[
      total - 1
    ].time;


  /*
    Add a little space on both sides.

    This makes the running candle
    clearly visible.
  */

  const padding =
    60;


  chart.timeScale()
    .setVisibleRange({

      from:
        firstTime -

        padding,

      to:
        lastTime +

        padding

    });

}


/* =========================================================
   RUNNING CANDLE TIMER
========================================================= */

function getCurrentCandleStart(){

  const now =
    Math.floor(
      Date.now() / 1000
    );


  return (
    Math.floor(
      now / 60
    ) * 60
  );

}


/*
  Returns seconds elapsed in
  the current minute.
*/

function getElapsedSeconds(){

  const now =
    Math.floor(
      Date.now() / 1000
    );


  return (
    now %
    60
  );

}


/*
  Remaining seconds.

  60 means new candle just started.
*/

function getRemainingSeconds(){

  const elapsed =
    getElapsedSeconds();


  if(
    elapsed === 0
  ){

    return 60;

  }


  return (
    60 -
    elapsed
  );

}


/* =========================================================
   TIMER UI
========================================================= */

function updateTimerText(){

  const remaining =
    getRemainingSeconds();


  const seconds =
    Math.max(
      0,
      Math.min(
        60,
        remaining
      )
    );


  const formatted =
    String(
      seconds
    ).padStart(
      2,
      "0"
    );


  candleTimerElement.textContent =
    "00:" +
    formatted;


  /*
    Keep timer visible only
    when market data exists.
  */

  if(
    currentCandles.length
  ){

    candleTimerElement.style.display =
      "block";

  }

}


/* =========================================================
   POSITION TIMER NEXT TO RUNNING CANDLE
========================================================= */

function positionCandleTimer(){

  if(
    !currentCandles.length
  ){

    candleTimerElement.style.display =
      "none";

    return;

  }


  const latest =
    currentCandles[
      currentCandles.length - 1
    ];


  /*
    Convert candle time
    into chart X coordinate.
  */

  const x =
    chart.timeScale()
      .timeToCoordinate(
        latest.time
      );


  /*
    Convert candle high into
    chart Y coordinate.
  */

  const highY =
    candleSeries
      .priceToCoordinate(
        latest.high
      );


  if(
    x === null ||
    highY === null
  ){

    candleTimerElement.style.display =
      "none";

    return;

  }


  /*
    IMPORTANT:

    Timer is placed a little RIGHT
    of the running candle.

    It is NOT placed directly on top
    of the candle body.
  */

  const rightOffset =
    15;


  let left =
    x +
    rightOffset;


  /*
    Keep timer inside chart.
  */

  const timerWidth =
    candleTimerElement
      .offsetWidth || 48;


  const chartWidth =
    chartElement.clientWidth;


  if(
    left +
    timerWidth >
    chartWidth - 4
  ){

    left =
      chartWidth -
      timerWidth -
      4;

  }


  /*
    Put it above the latest
    candle high.

    This avoids covering
    the candle body.
  */

  let top =
    highY - 10;


  const timerHeight =
    candleTimerElement
      .offsetHeight || 18;


  if(
    top <
    timerHeight + 4
  ){

    top =
      timerHeight + 4;

  }


  candleTimerElement.style.left =
    Math.max(
      4,
      left
    ) +
    "px";


  candleTimerElement.style.top =
    Math.max(
      4,
      top
    ) +
    "px";


  candleTimerElement.style.display =
    "block";

}


/* =========================================================
   TIMER LOOP
========================================================= */

function timerLoop(){

  updateTimerText();

  positionCandleTimer();

}


setInterval(
  timerLoop,
  250
);


/* =========================================================
   LOAD MARKET
========================================================= */

async function loadMarket(){

  /*
    Prevent multiple requests
    from overlapping.
  */

  if(
    isLoading
  ){

    return;

  }


  isLoading = true;


  try{


    statusElement.textContent =
      "Updating " +
      currentSymbol +
      "...";


    const response =
      await fetch(
        getAPIURL(),
        {

          method:"GET",

          cache:"no-store",

          headers:{

            Accept:
              "application/json"

          }

        }

      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      Support API formats.
    */

    let rawCandles = [];


    if(
      Array.isArray(
        data
      )
    ){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;

    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(
      candles.length === 0
    ){

      throw new Error(
        "No valid candle data"
      );

    }


    /*
      Only replace current data
      after successful validation.

      This prevents dashboard
      from becoming blank after
      a temporary API problem.
    */

    currentCandles =
      candles;


    /* =====================================================
       UPDATE CHART
    ====================================================== */

    candleSeries.setData(
      currentCandles
    );


    /*
      Show approximately
      12-15 candles.
    */

    showRecentCandles();


    /*
      Position timer again
      after chart update.
    */

    requestAnimationFrame(
      positionCandleTimer
    );


    /* =====================================================
       LAST CANDLE
    ====================================================== */

    const last =
      currentCandles[
        currentCandles.length - 1
      ];


    const price =
      last.close;


    priceElement.textContent =
      Number(
        price
      ).toFixed(5);


    lastPriceElement.textContent =
      Number(
        price
      ).toFixed(5);


    candleCountElement.textContent =
      currentCandles.length;


    selectedMarketElement.textContent =
      currentSymbol;


    marketSelect.value =
      currentSymbol;


    /* =====================================================
       SIGNAL
    ====================================================== */

    const result =
      calculateSignal(
        currentCandles
      );


    setSignalUI(
      result
    );


    /* =====================================================
       MARKET STATUS
    ====================================================== */

    let quality =
      data?.market?.dataQuality ||
      "OK";


    if(
      data?.market?.isStale
    ){

      quality =
        "STALE";

    }


    dataStatusElement.textContent =
      quality;


    if(
      quality ===
      "OK"
    ){

      dataStatusElement.classList.remove(
        "down",
        "neutral"
      );

      dataStatusElement.classList.add(
        "up"
      );

    }else{

      dataStatusElement.classList.remove(
        "up"
      );

      dataStatusElement.classList.add(
        "neutral"
      );

    }


    statusElement.textContent =
      "LIVE • " +
      currentSymbol;


    liveTextElement.textContent =
      "LIVE";


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();


  }catch(error){

    console.error(
      "FINORIX MARKET ERROR:",
      error
    );


    /*
      IMPORTANT:

      Do NOT erase current chart
      or current signal here.

      If API temporarily fails,
      existing valid data remains.
    */

    statusElement.textContent =
      "Feed retrying...";


    dataStatusElement.textContent =
      "RETRY";


    liveTextElement.textContent =
      "RETRY";

  }finally{

    isLoading = false;

  }

}


/* =========================================================
   MARKET PAIR CHANGE
========================================================= */

marketSelect.addEventListener(
  "change",
  async function(){

    const newSymbol =
      String(
        this.value
      ).trim();


    if(
      !newSymbol ||
      newSymbol ===
      currentSymbol
    ){

      return;

    }


    /*
      Change symbol.
    */

    currentSymbol =
      newSymbol;


    /*
      Update UI immediately.
    */

    selectedMarketElement.textContent =
      currentSymbol;


    statusElement.textContent =
      "Loading " +
      currentSymbol +
      "...";


    liveTextElement.textContent =
      "LOADING";


    /*
      Reset signal only.
      We do not destroy chart.
    */

    signalElement.textContent =
      "WAIT";


    signalElement.classList.remove(
      "up",
      "down"
    );


    signalElement.classList.add(
      "neutral"
    );


    confidenceElement.textContent =
      "--%";


    /*
      Clear chart only after
      pair actually changes.
    */

    currentCandles = [];


    candleSeries.setData(
      []
    );


    candleTimerElement.style.display =
      "none";


    await loadMarket();

  }
);


/* =========================================================
   RESPONSIVE CHART
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;


  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height

    });


    /*
      Re-position timer
      after resize.
    */

    requestAnimationFrame(
      positionCandleTimer
    );

  }

}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   CHART VISIBLE RANGE CHANGE
========================================================= */

chart.timeScale()
  .subscribeVisibleTimeRangeChange(
    function(){

      requestAnimationFrame(
        positionCandleTimer
      );

    }
  );


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMarket();


/* =========================================================
   LIVE REFRESH
========================================================= */

setInterval(
  loadMarket,
  REFRESH_MS
);


/* =========================================================
   NEW CANDLE DETECTION
========================================================= */

let lastKnownCandleTime =
  null;


setInterval(
  function(){

    if(
      !currentCandles.length
    ){

      return;

    }


    const latest =
      currentCandles[
        currentCandles.length - 1
      ];


    if(
      lastKnownCandleTime ===
      null
    ){

      lastKnownCandleTime =
        latest.time;

      return;

    }


    /*
      If API delivers a new candle,
      refresh chart immediately.
    */

    if(
      latest.time >
      lastKnownCandleTime
    ){

      lastKnownCandleTime =
        latest.time;


      requestAnimationFrame(
        function(){

          showRecentCandles();

          positionCandleTimer();

        }
      );

    }

  },
  1000
);


/* =========================================================
   KEEP TIMER POSITION UPDATED
========================================================= */

setInterval(
  function(){

    positionCandleTimer();

  },
  500
);


/* =========================================================
   PAGE VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      !document.hidden
    ){

      resizeChart();

      loadMarket();

    }

  }
);


</script>
