<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finorix AI Market Pro</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 8px;
    }

    .app {
      width: 100%;
      max-width: 950px;
    }

    .header {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 16px 16px 0 0;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
    }

    .market {
      margin-top: 7px;
      font-size: 14px;
      color: #00e6a0;
    }

    .live-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00e6a0;
      border-radius: 50%;
      margin-right: 5px;
      box-shadow: 0 0 8px #00e6a0;
    }

    .timeframe {
      background: #182343;
      padding: 9px 13px;
      border-radius: 9px;
      font-weight: bold;
      white-space: nowrap;
    }

    .chart-box {
      position: relative;
      width: 100%;
      height: 440px;
      background: #080c17;
      border-left: 1px solid #28365e;
      border-right: 1px solid #28365e;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    .advance-line {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 17%;
      border-left: 2px dashed rgba(255,255,255,0.7);
      pointer-events: none;
      z-index: 3;
    }

    .advance-label {
      position: absolute;
      top: 14px;
      right: calc(17% - 35px);
      font-size: 12px;
      color: white;
      font-weight: bold;
      pointer-events: none;
      z-index: 4;
    }

    .price {
      position: absolute;
      right: 7px;
      top: 45%;
      background: #168cff;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      pointer-events: none;
      z-index: 5;
    }

    .status {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0,0,0,.65);
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 11px;
      z-index: 6;
    }

    .bottom {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 0 0 16px 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signal-title,
    .confidence-title {
      font-size: 11px;
      color: #9ba4b7;
    }

    .signal {
      margin-top: 4px;
      color: #00e6a0;
      font-size: 21px;
      font-weight: bold;
    }

    .confidence {
      margin-top: 4px;
      color: #ffd21c;
      font-size: 21px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 5px;
      }

      .header {
        padding: 12px;
      }

      .title {
        font-size: 16px;
      }

      .market {
        font-size: 12px;
      }

      .timeframe {
        padding: 8px 10px;
        font-size: 12px;
      }

      .chart-box {
        height: 400px;
      }

      .bottom {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">

    <div>
      <div class="title">
        Finorix AI Market Pro
      </div>

      <div class="market">
        <span class="live-dot"></span>
        EUR/USD
        <strong id="liveText">CONNECTING</strong>
      </div>
    </div>

    <div class="timeframe">
      1min
    </div>

  </div>


  <div class="chart-box">

    <div id="chart"></div>

    <div class="status" id="status">
      Connecting to market...
    </div>

    <div class="advance-line"></div>

    <div class="advance-label">
      ADVANCE
    </div>

    <div class="price" id="price">
      --
    </div>

  </div>


  <div class="bottom">

    <div>
      <div class="signal-title">
        AI SIGNAL
      </div>

      <div class="signal" id="signal">
        WAIT
      </div>
    </div>


    <div>
      <div class="confidence-title">
        CONFIDENCE
      </div>

      <div class="confidence" id="confidence">
        --%
      </div>
    </div>

  </div>

</div>
