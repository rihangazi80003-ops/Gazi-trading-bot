<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Finorix AI Market Pro</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070d;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 950px;
    }

    .header {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 18px 18px 0 0;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
    }

    .market {
      margin-top: 7px;
      font-size: 15px;
      color: #00e6a0;
    }

    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #00e6a0;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px #00e6a0;
    }

    .timeframe {
      background: #182343;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: bold;
    }

    .chart-box {
      position: relative;
      height: 500px;
      background: #080c17;
      border-left: 1px solid #28365e;
      border-right: 1px solid #28365e;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    .advance-line {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 17%;
      border-left: 2px dashed rgba(255,255,255,0.7);
      pointer-events: none;
    }

    .advance-label {
      position: absolute;
      top: 15px;
      right: calc(17% - 35px);
      font-size: 13px;
      color: white;
      font-weight: bold;
      pointer-events: none;
    }

    .price {
      position: absolute;
      right: 8px;
      top: 45%;
      background: #168cff;
      padding: 7px 11px;
      border-radius: 7px;
      font-weight: bold;
      pointer-events: none;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,.55);
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      z-index: 5;
    }

    .bottom {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 0 0 18px 18px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signal-title {
      font-size: 12px;
      color: #9ba4b7;
    }

    .signal {
      margin-top: 5px;
      color: #00e6a0;
      font-size: 22px;
      font-weight: bold;
    }

    .confidence-title {
      font-size: 12px;
      color: #9ba4b7;
    }

    .confidence {
      margin-top: 5px;
      color: #ffd21c;
      font-size: 22px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .chart-box {
        height: 430px;
      }

      .title {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="title">Finorix AI Market Pro</div>

      <div class="market">
        <span class="live-dot"></span>
        EUR/USD (OTC)
        <strong>LIVE</strong>
      </div>
    </div>

    <div class="timeframe">1min</div>
  </div>


  <div class="chart-box">

    <div id="chart"></div>

    <div class="status" id="status">
      Connecting...
    </div>

    <div class="advance-line"></div>

    <div class="advance-label">
      ADVANCE
    </div>

    <div class="price" id="price">
      --
    </div>

  </div>


  <div class="bottom">

    <div>
      <div class="signal-title">
        AI SIGNAL
      </div>

      <div class="signal" id="signal">
        WAIT
      </div>
    </div>


    <div>
      <div class="confidence-title">
        CONFIDENCE
      </div>

      <div class="confidence" id="confidence">
        --%
      </div>
    </div>

  </div>

</div>


<script>

const API_URL =
  "/api/market?symbol=EUR%2FUSD&interval=1min";


const chartElement =
  document.getElementById("chart");


const chart =
  LightweightCharts.createChart(chartElement, {

      background: {
        color: "#080c17"
      },

      textColor: "#aeb8cc"
    },

    grid: {
      vertLines: {
        color: "rgba(255,255,255,0.06)"
      },

      horzLines: {
        color: "rgba(255,255,255,0.06)"
      }
    },

    rightPriceScale: {
      borderColor: "#263454"
    },

    timeScale: {
      borderColor: "#263454",

      timeVisible: true,

      secondsVisible: false
    },

    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal
    }
  });
