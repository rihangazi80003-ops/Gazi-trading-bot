<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Finorix AI Market Pro</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#050811;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  padding:8px;
}

.app{
  width:100%;
  max-width:980px;
}

/* HEADER */

.header{
  background:linear-gradient(135deg,#111a31,#080c18);
  border:1px solid #293862;
  border-radius:18px 18px 0 0;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:22px;
  font-weight:700;
}

.market{
  margin-top:7px;
  color:#00e6a0;
  font-size:16px;
}

.live-dot{
  display:inline-block;
  width:10px;
  height:10px;
  background:#00e6a0;
  border-radius:50%;
  margin-right:7px;
  box-shadow:0 0 10px #00e6a0;
}

.timeframe{
  background:#182546;
  border:1px solid #2c4070;
  padding:12px 17px;
  border-radius:12px;
  font-weight:bold;
}

/* CHART */

.chart-box{
  position:relative;
  width:100%;
  height:500px;
  background:#080c17;
  border-left:1px solid #293862;
  border-right:1px solid #293862;
  overflow:hidden;
}

#chart{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  top:12px;
  left:12px;
  z-index:10;
  background:rgba(0,0,0,.70);
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  color:#d9e2f5;
}

.advance-line{
  position:absolute;
  top:0;
  bottom:0;
  right:14%;
  border-left:2px dashed rgba(255,255,255,.65);
  pointer-events:none;
  z-index:4;
}

.advance-label{
  position:absolute;
  top:16px;
  right:calc(14% - 40px);
  font-size:13px;
  font-weight:bold;
  color:#fff;
  pointer-events:none;
  z-index:5;
}

.price-box{
  position:absolute;
  right:7px;
  top:47%;
  background:#168cff;
  padding:8px 11px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
  z-index:8;
  pointer-events:none;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}

/* BOTTOM SIGNAL */

.bottom{
  background:linear-gradient(135deg,#111a31,#080c18);
  border:1px solid #293862;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.signal-title,
.confidence-title{
  color:#9da7bd;
  font-size:13px;
}

.signal{
  margin-top:6px;
  font-size:28px;
  font-weight:800;
  color:#00e6a0;
}

.signal.down{
  color:#ff4f6d;
}

.signal.wait{
  color:#ffd21c;
}

.confidence{
  margin-top:6px;
  font-size:28px;
  font-weight:800;
  color:#ffd21c;
}

/* ANALYSIS */

.analysis{
  background:linear-gradient(135deg,#0d1529,#080c18);
  border:1px solid #293862;
  padding:18px;
}

.section-title{
  color:#aab4c9;
  font-size:17px;
  margin-bottom:14px;
}

.analysis-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  background:#080d1c;
  border:1px solid #27365e;
  border-radius:13px;
  padding:14px 8px;
  text-align:center;
}

.card-title{
  color:#8995ae;
  font-size:12px;
}

.card-value{
  margin-top:8px;
  font-size:18px;
  font-weight:bold;
}

.up{
  color:#00e6a0;
}

.down{
  color:#ff4f6d;
}

.neutral{
  color:#ffd21c;
}

.details{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.detail{
  background:#080d1c;
  border:1px solid #27365e;
  border-radius:13px;
  padding:14px;
}

.detail-title{
  color:#8995ae;
  font-size:12px;
}

.detail-value{
  margin-top:8px;
  font-size:17px;
  font-weight:bold;
}

/* FOOTER */

.footer{
  background:#080c17;
  border:1px solid #293862;
  border-radius:0 0 18px 18px;
  padding:12px 16px;
  text-align:center;
  color:#707b93;
  font-size:11px;
}

/* MOBILE */

@media(max-width:600px){

  body{
    padding:0;
  }

  .app{
    max-width:none;
  }

  .header{
    border-radius:0;
    padding:14px;
  }

  .title{
    font-size:20px;
  }

  .market{
    font-size:15px;
  }

  .timeframe{
    padding:11px 14px;
  }

  .chart-box{
    height:455px;
  }

  .bottom{
    padding:17px;
  }

  .signal{
    font-size:27px;
  }

  .confidence{
    font-size:27px;
  }

  .analysis{
    padding:14px;
  }

  .analysis-grid{
    gap:7px;
  }

  .card{
    padding:13px 5px;
  }

  .details{
    gap:7px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div>

      <div class="title">
        Finorix AI Market Pro
      </div>

      <div class="market">
        <span class="live-dot"></span>
        EUR/USD <strong>LIVE</strong>
      </div>

    </div>

    <div class="timeframe">
      1min
    </div>

  </div>


  <!-- CHART -->

  <div class="chart-box">

    <div id="chart"></div>

    <div class="status" id="status">
      Connecting...
    </div>

    <div class="advance-line"></div>

    <div class="advance-label">
      ADVANCE
    </div>

    <div class="price-box" id="price">
      --
    </div>

  </div>


  <!-- SIGNAL -->

  <div class="bottom">

    <div>

      <div class="signal-title">
        AI SIGNAL
      </div>

      <div class="signal wait" id="signal">
        WAIT
      </div>

    </div>

    <div>

      <div class="confidence-title">
        CONFIDENCE
      </div>

      <div class="confidence" id="confidence">
        --%
      </div>

    </div>

  </div>


  <!-- ANALYSIS -->

  <div class="analysis">

    <div class="section-title">
      MARKET ANALYSIS
    </div>

    <div class="analysis-grid">

      <div class="card">
        <div class="card-title">
          RSI (14)
        </div>

        <div class="card-value neutral"
             id="rsi">
          --
        </div>
      </div>


      <div class="card">

        <div class="card-title">
          EMA TREND
        </div>

        <div class="card-value"
             id="ema">
          --
        </div>

      </div>


      <div class="card">

        <div class="card-title">
          MACD
        </div>

        <div class="card-value"
             id="macd">
          --
        </div>

      </div>

    </div>


    <div class="details">

      <div class="detail">

        <div class="detail-title">
          LAST PRICE
        </div>

        <div class="detail-value"
             id="lastPrice">
          --
        </div>

      </div>


      <div class="detail">

        <div class="detail-title">
          NEXT CANDLE
        </div>

        <div class="detail-value"
             id="nextCandle">
          WAIT
        </div>

      </div>


      <div class="detail">

        <div class="detail-title">
          CANDLES
        </div>

        <div class="detail-value"
             id="candleCount">
          0
        </div>

      </div>


      <div class="detail">

        <div class="detail-title">
          UPDATE
        </div>

        <div class="detail-value"
             id="updateTime">
          --
        </div>

      </div>

    </div>

  </div>


  <div class="footer">
    Finorix AI Market Pro • Market analysis engine
  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
  "/api/market?symbol=EUR%2FUSD&interval=1min";

const REFRESH_MS = 10000;


/* =====================================================
   ELEMENTS
===================================================== */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");


/* =====================================================
   CHART
===================================================== */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {
      width: chartElement.clientWidth,
      height: chartElement.clientHeight,

      layout:{
        background:{
          color:"#080c17"
        },
        textColor:"#aeb8cc"
      },

      grid:{
        vertLines:{
          color:"rgba(255,255,255,0.045)"
        },

        horzLines:{
          color:"rgba(255,255,255,0.045)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",
        minimumWidth:72,
        autoScale:true,
        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{
        borderColor:"#263454",
        timeVisible:true,
        secondsVisible:false,

        barSpacing:7,
        minBarSpacing:3,

        rightOffset:3,

        fixLeftEdge:false,
        fixRightEdge:false
      },

      crosshair:{
        mode:
          LightweightCharts.CrosshairMode.Normal
      },

      handleScroll:{
        mouseWheel:true,
        pressedMouseMove:true
      },

      handleScale:{
        axisPressedMouseMove:true,
        mouseWheel:true,
        pinch:true
      }
    }
  );


/* =====================================================
   CANDLE SERIES
===================================================== */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a3",
    downColor:"#ff4f6d",

    borderUpColor:"#00d6a3",
    borderDownColor:"#ff4f6d",

    wickUpColor:"#00d6a3",
    wickDownColor:"#ff4f6d",

    priceFormat:{
      type:"price",
      precision:5,
      minMove:0.00001
    }
  });


/* =====================================================
   RESPONSIVE CHART
===================================================== */

function resizeChart(){

  chart.applyOptions({
    width:chartElement.clientWidth,
    height:chartElement.clientHeight
  });

}

window.addEventListener(
  "resize",
  resizeChart
);


/* =====================================================
   DATA NORMALIZATION
===================================================== */

function parseTime(value){

  if(!value) return null;

  if(typeof value === "number"){

    if(value > 1000000000000){
      return Math.floor(value / 1000);
    }

    return Math.floor(value);
  }

  let text =
    String(value).trim();

  text =
    text.replace(" ","T");

  if(!text.endsWith("Z")){
    text += "Z";
  }

  const ms =
    Date.parse(text);

  if(!Number.isFinite(ms)){
    return null;
  }

  return Math.floor(ms / 1000);
}


function normalizeCandles(raw){

  if(!Array.isArray(raw)){
    return [];
  }

  const result = [];

  for(const item of raw){

    const time =
      parseTime(
        item.time ??
        item.datetime ??
        item.timestamp
      );

    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);

    if(
      !time ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){
      continue;
    }

    if(
      high < Math.max(open,close) ||
      low > Math.min(open,close)
    ){
      continue;
    }

    result.push({
      time,
      open,
      high,
      low,
      close
    });
  }


  result.sort(
    (a,b)=>a.time-b.time
  );


  const unique = [];

  for(const candle of result){

    const previous =
      unique[unique.length-1];

    if(
      previous &&
      previous.time === candle.time
    ){
      unique[unique.length-1] =
        candle;
    }else{
      unique.push(candle);
    }
  }

  return unique;
}


/* =====================================================
   RSI
===================================================== */

function calculateRSI(
  candles,
  period=14
){

  if(candles.length <= period){
    return 50;
  }

  let gain = 0;
  let loss = 0;

  for(
    let i=1;
    i<=period;
    i++
  ){

    const diff =
      candles[i].close -
      candles[i-1].close;

    if(diff >= 0){
      gain += diff;
    }else{
      loss += Math.abs(diff);
    }
  }

  let avgGain =
    gain / period;

  let avgLoss =
    loss / period;


  for(
    let i=period+1;
    i<candles.length;
    i++
  ){

    const diff =
      candles[i].close -
      candles[i-1].close;

    const currentGain =
      diff > 0 ? diff : 0;

    const currentLoss =
      diff < 0 ? Math.abs(diff) : 0;

    avgGain =
      ((avgGain * (period-1)) +
       currentGain) / period;

    avgLoss =
      ((avgLoss * (period-1)) +
       currentLoss) / period;
  }


  if(avgLoss === 0){
    return 100;
  }

  const rs =
    avgGain / avgLoss;

  return 100 -
    (100 / (1 + rs));
}


/* =====================================================
   EMA
===================================================== */

function calculateEMA(
  values,
  period
){

  if(values.length === 0){
    return 0;
  }

  const multiplier =
    2 / (period + 1);

  let ema =
    values[0];

  for(
    let i=1;
    i<values.length;
    i++
  ){

    ema =
      ((values[i] - ema) *
       multiplier) + ema;
  }

  return ema;
}


/* =====================================================
   MACD
===================================================== */

function calculateMACD(
  candles
){

  const closes =
    candles.map(
      c=>c.close
    );

  if(closes.length < 35){
    return {
      macd:0,
      signal:0,
      histogram:0
    };
  }


  const ema12 =
    calculateEMA(
      closes,
      12
    );

  const ema26 =
    calculateEMA(
      closes,
      26
    );

  const macd =
    ema12 - ema26;


  const macdValues = [];

  for(
    let i=26;
    i<closes.length;
    i++
  ){

    const shortEMA =
      calculateEMA(
        closes.slice(0,i+1),
        12
      );

    const longEMA =
      calculateEMA(
        closes.slice(0,i+1),
        26
      );

    macdValues.push(
      shortEMA-longEMA
    );
  }


  const signal =
    calculateEMA(
      macdValues,
      9
    );

  return {
    macd,
    signal,
    histogram:
      macd-signal
  };
}


/* =====================================================
   SIGNAL ENGINE
===================================================== */

function calculateSignal(
  candles
){

  if(candles.length < 35){

    return {
      signal:"WAIT",
      confidence:50,
      rsi:50,
      emaTrend:"WAIT",
      macdTrend:"NEUTRAL"
    };
  }


  const closes =
    candles.map(
      c=>c.close
    );

  const last =
    candles[candles.length-1];


  const ema9 =
    calculateEMA(
      closes,
      9
    );

  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      candles,
      14
    );


  const macd =
    calculateMACD(
      candles
    );


  let score = 0;


  /* EMA */

  if(ema9 > ema21){

    score += 30;

  }else if(ema9 < ema21){

    score -= 30;
  }


  /* MACD */

  if(macd.histogram > 0){

    score += 30;

  }else if(macd.histogram < 0){

    score -= 30;
  }


  /* RSI */

  if(rsi > 55){

    score += 20;

  }else if(rsi < 45){

    score -= 20;
  }


  /* MOMENTUM */

  const previous =
    candles[
      candles.length-6
    ];


  if(previous){

    const momentum =
      last.close -
      previous.close;

    if(momentum > 0){
      score += 20;
    }

    if(momentum < 0){
      score -= 20;
    }
  }


  let signal =
    "WAIT";


  if(score >= 30){
    signal = "UP";
  }

  if(score <= -30){
    signal = "DOWN";
  }


  /*
    This is a model score,
    not a guaranteed probability.
  */

  const confidence =
    Math.min(
      95,
      Math.max(
        50,
        Math.round(
          50 +
          Math.abs(score) * 0.45
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend:
      ema9 > ema21
        ? "UP"
        : ema9 < ema21
          ? "DOWN"
          : "FLAT",

    macdTrend:
      macd.histogram > 0
        ? "BULLISH"
        : macd.histogram < 0
          ? "BEARISH"
          : "NEUTRAL"
  };
}


/* =====================================================
   UI UPDATE
===================================================== */

function updateUI(
  candles
){

  if(!candles.length){
    return;
  }


  const last =
    candles[candles.length-1];


  const analysis =
    calculateSignal(
      candles
    );


  const price =
    last.close;


  /* PRICE */

  priceElement.textContent =
    price.toFixed(5);

  lastPriceElement.textContent =
    price.toFixed(5);


  /* RSI */

  rsiElement.textContent =
    analysis.rsi.toFixed(1);


  rsiElement.className =
    "card-value " +
    (
      analysis.rsi >= 55
        ? "up"
        : analysis.rsi <= 45
          ? "down"
          : "neutral"
    );


  /* EMA */

  emaElement.textContent =
    analysis.emaTrend;

  emaElement.className =
    "card-value " +
    (
      analysis.emaTrend === "UP"
        ? "up"
        : analysis.emaTrend === "DOWN"
          ? "down"
          : "neutral"
    );


  /* MACD */

  macdElement.textContent =
    analysis.macdTrend;

  macdElement.className =
    "card-value " +
    (
      analysis.macdTrend === "BULLISH"
        ? "up"
        : analysis.macdTrend === "BEARISH"
          ? "down"
          : "neutral"
    );


  /* SIGNAL */

  signalElement.textContent =
    analysis.signal;

  signalElement.className =
    "signal " +
    (
      analysis.signal === "UP"
        ? "up"
        : analysis.signal === "DOWN"
          ? "down"
          : "wait"
    );


  /* CONFIDENCE */

  confidenceElement.textContent =
    analysis.confidence + "%";


  /* NEXT CANDLE */

  nextCandleElement.textContent =
    analysis.signal;

  nextCandleElement.className =
    "detail-value " +
    (
      analysis.signal === "UP"
        ? "up"
        : analysis.signal === "DOWN"
          ? "down"
          : "neutral"
    );


  /* COUNT */

  candleCountElement.textContent =
    candles.length;


  /* UPDATE */

  updateTimeElement.textContent =
    new Date().toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    );
}


/* =====================================================
   LOAD MARKET DATA
===================================================== */

async function loadMarket(){

  try{

    statusElement.textContent =
      "Connecting • Twelve Data";


    const response =
      await fetch(
        API_URL,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){
      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const json =
      await response.json();


    let raw =
      json.candles;


    /*
      Supports both:
      { candles: [...] }
      and
      { data: [...] }
    */

    if(!raw && Array.isArray(json.data)){
      raw = json.data;
    }


    const candles =
      normalizeCandles(
        raw
      );


    if(candles.length === 0){

      throw new Error(
        "No valid candles"
      );
    }


    /* CHART */

    candleSeries.setData(
      candles
    );


    /* LAST PRICE */

    const last =
      candles[candles.length-1];


    priceElement.textContent =
      last.close.toFixed(5);


    /*
      Automatically keep a
      sensible mobile view.
    */

    chart.timeScale()
      .fitContent();


    chart.timeScale()
      .applyOptions({
        rightOffset:3,
        barSpacing:
          window.innerWidth < 600
            ? 6
            : 7
      });


    /* ANALYSIS */

    updateUI(
      candles
    );


    statusElement.textContent =
      "Connected • Twelve Data";


  }catch(error){

    console.error(
      "Market error:",
      error
    );

    statusElement.textContent =
      "Data connection error";

  }
}


/* =====================================================
   START
===================================================== */

loadMarket();


setInterval(
  loadMarket,
  REFRESH_MS
);

</script>

</body>
</html>
