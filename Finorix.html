<style>

/* =========================================================
   GLOBAL
   ========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{

  margin:0;
  padding:0;

  width:100%;
  min-height:100%;

  background:#05070d;
  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  padding:8px;
}

.app{

  width:100%;
  max-width:950px;

  margin:0 auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.header{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  border-radius:
    18px 18px 0 0;

  padding:15px;

  display:flex;

  justify-content:space-between;

  align-items:center;
}

.title{

  font-size:20px;

  font-weight:700;
}

.market{

  margin-top:7px;

  font-size:14px;

  color:#00e6a0;

  display:flex;

  align-items:center;

  gap:5px;
}

.live-dot{

  display:inline-block;

  width:9px;
  height:9px;

  background:#00e6a0;

  border-radius:50%;

  box-shadow:
    0 0 10px #00e6a0;

  flex-shrink:0;
}

#marketName{

  font-weight:500;
}

#liveText{

  font-weight:700;
}

.timeframe{

  background:#182343;

  padding:11px 15px;

  border-radius:10px;

  font-weight:bold;

  white-space:nowrap;
}


/* =========================================================
   CHART AREA
   ========================================================= */

.chart-box{

  position:relative;

  width:100%;

  height:480px;

  background:#080c17;

  border-left:1px solid #28365e;
  border-right:1px solid #28365e;

  overflow:hidden;
}

#chart{

  width:100%;
  height:100%;
}


/* =========================================================
   STATUS
   ========================================================= */

.status{

  position:absolute;

  top:10px;
  left:10px;

  z-index:20;

  background:
    rgba(0,0,0,.68);

  padding:8px 11px;

  border-radius:8px;

  font-size:12px;

  white-space:nowrap;

  pointer-events:none;
}


/* =========================================================
   ADVANCE LINE
   ========================================================= */

.advance-line{

  position:absolute;

  top:0;
  bottom:0;

  right:17%;

  border-left:
    2px dashed
    rgba(255,255,255,.65);

  pointer-events:none;

  z-index:10;
}

.advance-label{

  position:absolute;

  top:20px;

  right:
    calc(17% - 38px);

  font-size:13px;

  font-weight:bold;

  color:#fff;

  z-index:10;

  pointer-events:none;
}


/* =========================================================
   PRICE LABEL
   ========================================================= */

.price{

  position:absolute;

  right:7px;

  top:45%;

  background:#168cff;

  padding:7px 10px;

  border-radius:7px;

  font-weight:bold;

  font-size:13px;

  z-index:15;

  pointer-events:none;

  white-space:nowrap;
}


/* =========================================================
   FORMING CANDLE TIMER
   IMPORTANT:
   NO BOX
   NO BACKGROUND
   POSITIONED BY CANDLE COORDINATES
   ========================================================= */

.forming-candle-timer{

  position:absolute;

  z-index:25;

  pointer-events:none;

  transform:
    translate(-50%,-50%);

  font-size:12px;

  font-weight:800;

  color:#ffffff;

  text-align:center;

  white-space:nowrap;

  text-shadow:
    0 1px 3px rgba(0,0,0,.95),
    0 0 6px rgba(0,0,0,.90);

  display:none;
}

.forming-candle-timer.visible{

  display:block;
}

.forming-candle-timer.warning{

  color:#ffd21c;
}

.forming-candle-timer.final{

  color:#ff536d;
}


/* =========================================================
   BOTTOM SIGNAL
   ========================================================= */

.bottom{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  padding:15px;

  display:grid;

  grid-template-columns:
    1fr
    auto
    1fr;

  align-items:center;

  gap:12px;
}


/* SIGNAL */

.signal-title,
.confidence-title,
.next-title{

  font-size:12px;

  color:#9ba4b7;
}

.signal{

  margin-top:5px;

  font-size:28px;

  font-weight:bold;
}


/* NEXT CANDLE */

.next-candle{

  text-align:center;

  min-width:90px;

  padding:
    6px 10px;

  border-left:
    1px solid #263454;

  border-right:
    1px solid #263454;
}

.next-direction{

  margin-top:4px;

  font-size:20px;

  font-weight:800;

  line-height:1;
}


/* CONFIDENCE */

.confidence-area{

  text-align:right;
}

.confidence{

  margin-top:5px;

  color:#ffd21c;

  font-size:27px;

  font-weight:bold;
}


/* =========================================================
   ANALYSIS
   ========================================================= */

.analysis{

  background:
    linear-gradient(
      135deg,
      #10182c,
      #080b15
    );

  border:1px solid #28365e;

  border-radius:
    0 0 18px 18px;

  padding:15px;
}

.analysis-title{

  font-size:15px;

  color:#aeb8cc;

  margin-bottom:12px;
}

.analysis-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.card{

  border:
    1px solid #263454;

  background:#080c19;

  border-radius:12px;

  padding:13px 8px;

  text-align:center;
}

.card-title{

  font-size:11px;

  color:#8f99ae;
}

.card-value{

  margin-top:7px;

  font-size:16px;

  font-weight:bold;
}


/* =========================================================
   EXTRA INFO
   ========================================================= */

.info{

  margin-top:10px;

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:10px;
}

.info-card{

  background:#080c19;

  border:
    1px solid #263454;

  border-radius:12px;

  padding:12px;
}

.info-label{

  color:#8994aa;

  font-size:11px;
}

.info-value{

  margin-top:5px;

  font-size:14px;

  font-weight:bold;
}


/* =========================================================
   COLORS
   ========================================================= */

.up{

  color:#00e6a0 !important;
}

.down{

  color:#ff536d !important;
}

.neutral{

  color:#ffd21c !important;

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

  .timeframe{

  }

    gap:7px;
  }

  .card{

  }

  .next-direction{

  }

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   COMPLETE FRONTEND ENGINE
   ========================================================= */


/* =========================================================
   SETTINGS
   ========================================================= */

const SYMBOL = "EUR/USD";

const INTERVAL = "1min";

const API_URL =
  "/api/market?symbol=" +
  encodeURIComponent(SYMBOL) +
  "&interval=" +
  INTERVAL;


/*
  API refresh:
  15 seconds

  Candle timer:
  1 second

  These two systems are completely separate.
*/

const REFRESH_MS = 15000;

const VISIBLE_BARS = 15;


/* =========================================================
   ELEMENTS
   ========================================================= */

const chartElement =
  document.getElementById("chart");


const statusElement =
  document.getElementById("status");


const priceElement =
  document.getElementById("price");


const signalElement =
  document.getElementById("signal");


const confidenceElement =
  document.getElementById("confidence");


const rsiElement =
  document.getElementById("rsi");


const emaElement =
  document.getElementById("ema");


const macdElement =
  document.getElementById("macd");


const lastPriceElement =
  document.getElementById("lastPrice");


const nextCandleElement =
  document.getElementById("nextCandle");


const nextCandleDirectionElement =
  document.getElementById(
    "nextCandleDirection"
  );


const candleCountElement =
  document.getElementById("candleCount");


const updateTimeElement =
  document.getElementById("updateTime");


const marketNameElement =
  document.getElementById("marketName");


const formingTimerElement =
  document.getElementById(
    "formingCandleTimer"
  );


/* =========================================================
   CHART
   ========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{

        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },


      width:
        chartElement.clientWidth,


      height:
        chartElement.clientHeight,


      grid:{

        vertLines:{
          color:
            "rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.06)"
        }
      },


      rightPriceScale:{

        borderColor:
          "#263454",

        scaleMargins:{

          top:0.08,

          bottom:0.12
        }
      },


      timeScale:{

        borderColor:
          "#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:2,

        barSpacing:16,

        minBarSpacing:6,

        lockVisibleTimeRangeOnResize:true
      },


      crosshair:{

        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


/* =========================================================
   CANDLE SERIES
   ========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:
      "#00d6a0",

    downColor:
      "#ff536d",

    borderUpColor:
      "#00d6a0",

    borderDownColor:
      "#ff536d",

    wickUpColor:
      "#00d6a0",

    wickDownColor:
      "#ff536d",

    priceLineVisible:true,

    lastValueVisible:true
  });


/* =========================================================
   DATA STORAGE
   ========================================================= */

let currentCandles = [];

let analysisCandles = [];

let formingCandle = null;

let lastApiData = null;

let isLoading = false;


/* =========================================================
   TIME HELPERS
   ========================================================= */


/*
  Convert any supported timestamp
  into Unix seconds.
*/

function normalizeTime(value){

  if(typeof value === "number"){

    if(
      value >
      1000000000000
    ){

      return Math.floor(
        value / 1000
      );
    }

    return Math.floor(value);
  }


  if(!value){

    return null;
  }


  let date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    const today =
      new Date();

    const parts =
      String(value)
        .split(":");


    if(
      parts.length >= 2
    ){

      today.setHours(

        Number(parts[0]) || 0,

        Number(parts[1]) || 0,

        Number(parts[2]) || 0,

        0
      );

      date = today;
    }
  }


  if(
    isNaN(
      date.getTime()
    )
  ){

    return null;
  }


  return Math.floor(
    date.getTime() / 1000
  );
}


/*
  Current minute timestamp.
*/

function getCurrentMinuteTimestamp(){

  return Math.floor(
    Date.now() / 60000
  ) * 60;
}


/*
  Seconds remaining in current minute.
*/

function getRemainingSeconds(){

  const now =
    Math.floor(
      Date.now() / 1000
    );

  const currentMinute =
    Math.floor(
      now / 60
    ) * 60;

  const elapsed =
    now -
    currentMinute;

  const remaining =
    60 - elapsed;

  return remaining >= 60
    ? 60
    : remaining;
}


/* =========================================================
   NORMALIZE CANDLES
   ========================================================= */

function normalizeCandles(raw){

  if(
    !Array.isArray(raw)
  ){

    return [];
  }


  const result = [];


  for(
    const item of raw
  ){

    if(!item){

      continue;
    }


    const time =
      normalizeTime(

        item.time ??
        item.datetime ??
        item.timestamp
      );


    const open =
      Number(item.open);


    const high =
      Number(item.high);


    const low =
      Number(item.low);


    const close =
      Number(item.close);


    if(

      !time ||

      !Number.isFinite(open) ||

      !Number.isFinite(high) ||

      !Number.isFinite(low) ||

      !Number.isFinite(close)

    ){

      continue;
    }


    result.push({

      time,

      open,

      high,

      low,

      close
    });
  }


  /*
    Oldest → newest
  */

  result.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Remove duplicate timestamps.
  */

  const unique = [];


  for(
    const candle of result
  ){

    const last =
      unique[
        unique.length - 1
      ];


    if(

      last &&

      last.time ===
      candle.time

    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(
        candle
      );
    }
  }


  return unique;
}


/* =========================================================
   EMA
   ========================================================= */

function calculateEMA(
  values,
  period
){

  if(
    values.length <
    period
  ){

    return null;
  }


  const multiplier =
    2 /
    (period + 1);


  let ema = 0;


  for(
    let i = 0;

    i < period;

    i++
  ){

    ema +=
      values[i];
  }


  ema /=
    period;


  for(
    let i = period;

    i < values.length;

    i++
  ){

    ema =

      (
        values[i] -
        ema
      ) *
      multiplier
      +
      ema;
  }


  return ema;
}


/* =========================================================
   RSI
   ========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(
    values.length <=
    period
  ){

    return null;
  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;

    i <= period;

    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    if(
      change >= 0
    ){

      gains +=
        change;

    }else{

      losses +=
        Math.abs(change);
    }
  }


  let avgGain =
    gains / period;


  let avgLoss =
    losses / period;


  for(
    let i =
      period + 1;

    i < values.length;

    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =

      (
        avgGain *
        (period - 1)
        +
        gain
      ) /
      period;


    avgLoss =

      (
        avgLoss *
        (period - 1)
        +
        loss
      ) /
      period;
  }


  if(
    avgLoss === 0
  ){

    return 100;
  }


  const rs =
    avgGain /
    avgLoss;


  return 100 -
    (
      100 /
      (1 + rs)
    );
}


/* =========================================================
   MACD
   ========================================================= */

function calculateMACD(
  values
){

  if(
    values.length < 35
  ){

    return {

      macd:null,

      signal:null,

      histogram:null
    };
  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(

    ema12 === null ||

    ema26 === null

  ){

    return {

      macd:null,

      signal:null,

      histogram:null
    };
  }


  const macd =
    ema12 -
    ema26;


  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD =
    null;


  if(
    previousValues.length >=
    35
  ){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );


    const p26 =
      calculateEMA(
        previousValues,
        26
      );


    if(

      p12 !== null &&

      p26 !== null

    ){

      previousMACD =
        p12 - p26;
    }
  }


  const histogram =
    previousMACD === null

      ? 0

      : macd -
        previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram
  };
}


/* =========================================================
   SIGNAL ENGINE
   ========================================================= */

function calculateSignal(
  candles
){

  if(
    candles.length < 35
  ){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"
    };
  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  /* =====================================================
     EMA
     ===================================================== */

  let emaTrend =
    "NEUTRAL";


  if(

    ema9 !== null &&

    ema21 !== null

  ){

    if(
      ema9 >
      ema21
    ){

      emaTrend =
        "UP";

      score += 2;

    }else if(
      ema9 <
      ema21
    ){

      emaTrend =
        "DOWN";

      score -= 2;
    }
  }


  /* =====================================================
     RSI
     ===================================================== */

  if(
    rsi !== null
  ){

    if(
      rsi < 30
    ){

      score += 1;

    }else if(
      rsi > 70
    ){

      score -= 1;

    }else if(
      rsi > 50
    ){

      score += 0.5;

    }else{

      score -= 0.5;
    }
  }


  /* =====================================================
     MACD
     ===================================================== */

  let macdTrend =
    "NEUTRAL";


  if(
    macd.macd !== null
  ){

    if(
      macd.histogram > 0
    ){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(
      macd.histogram < 0
    ){

      macdTrend =
        "BEARISH";

      score -= 2;
    }
  }


  /* =====================================================
     LAST CLOSED CANDLE
     ===================================================== */

  if(
    last >
    previous
  ){

    score += 0.5;

  }else if(
    last <
    previous
  ){

    score -= 0.5;
  }


  /* =====================================================
     SIGNAL
     ===================================================== */

  let signal =
    "WAIT";


  if(
    score >= 2
  ){

    signal =
      "UP";

  }else if(
    score <= -2
  ){

    signal =
      "DOWN";
  }


  /*
    Algorithmic confidence.

    This is NOT a guaranteed
    probability of winning.
  */

  let confidence =
    50 +
    Math.abs(score) *
    8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          confidence
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd
  };
}

/* =========================================================
   BUILD FORMING CANDLE
   ========================================================= */

/*
  This creates a current-minute candle
  from the latest available price.

  It does NOT enter the signal calculation.
  It is only used for the visual live candle.
*/

function buildFormingCandle(
  baseCandles,
  data
){

  if(
    !baseCandles.length
  ){

    return null;
  }


  const currentMinute =
    getCurrentMinuteTimestamp();


  const last =
    baseCandles[
      baseCandles.length - 1
    ];


  /*
    Try to get the freshest price
    supplied by the API.
  */

  let livePrice =
    Number(
      data?.market?.latestPrice
    );


  if(
    !Number.isFinite(
      livePrice
    )
  ){

    livePrice =
      last.close;
  }


  /*
    If API already supplied a candle
    for the current minute, use it.
  */

  const existingCurrent =
    baseCandles.find(
      candle =>
        candle.time ===
        currentMinute
    );


  if(
    existingCurrent
  ){

    return {

      time:
        currentMinute,

      open:
        existingCurrent.open,

      high:
        existingCurrent.high,

      low:
        existingCurrent.low,

      close:
        livePrice
    };
  }


  /*
    Otherwise create a visual
    forming candle from the last
    closed candle.
  */

  const open =
    last.close;


  const high =
    Math.max(
      open,
      livePrice
    );


  const low =
    Math.min(
      open,
      livePrice
    );


  return {

    time:
      currentMinute,

    open,

    high,

    low,

    close:
      livePrice
  };
}


/* =========================================================
   POSITION FORMING CANDLE TIMER
   ========================================================= */

/*
  This is the important fix.

  Timer position is calculated from:

  1. Candle TIME
  2. Candle PRICE

  So it moves with the candle,
  instead of staying at a fixed
  screen position.
*/

function positionFormingTimer(){

  if(
    !formingCandle
  ){

    formingTimerElement.classList.remove(
      "visible"
    );

    return;
  }


  const candle =
    formingCandle;


  /*
    Convert candle time
    to screen X.
  */

  const x =
    chart
      .timeScale()
      .timeToCoordinate(
        candle.time
      );


  /*
    Put timer around the body
    of the forming candle.
  */

  const bodyPrice =
    (
      candle.open +
      candle.close
    ) / 2;


  const y =
    candleSeries
      .priceToCoordinate(
        bodyPrice
      );


  if(
    x === null ||
    y === null ||
    !Number.isFinite(x) ||
    !Number.isFinite(y)
  ){

    formingTimerElement.classList.remove(
      "visible"
    );

    return;
  }


  /*
    Keep the timer inside
    the chart boundaries.
  */

  const safeX =
    Math.max(
      25,
      Math.min(
        chartElement.clientWidth - 25,
        x
      )
    );


  const safeY =
    Math.max(
      25,
      Math.min(
        chartElement.clientHeight - 25,
        y
      )
    );


  formingTimerElement.style.left =
    safeX + "px";


  formingTimerElement.style.top =
    safeY + "px";


  formingTimerElement.classList.add(
    "visible"
  );
}


/* =========================================================
   UPDATE FORMING CANDLE TIMER
   ========================================================= */

function updateFormingCandleTimer(){

  const remaining =
    getRemainingSeconds();


  const formatted =
    String(
      remaining
    ).padStart(
      2,
      "0"
    );


  formingTimerElement.textContent =
    "00:" +
    formatted;


  /*
    Visual warning states.
  */

  formingTimerElement.classList.remove(
    "warning",
    "final"
  );


  if(
    remaining <= 10
  ){

    formingTimerElement.classList.add(
      "final"
    );

  }else if(
    remaining <= 20
  ){

    formingTimerElement.classList.add(
      "warning"
    );
  }


  /*
    Recalculate the candle
    position every second.
  */

  if(
    formingCandle
  ){

    positionFormingTimer();
  }
}


/* =========================================================
   RENDER CHART
   ========================================================= */

function renderChart(
  candles,
  data
){

  if(
    !candles.length
  ){

    return;
  }


  /*
    Completed/base candles.
  */

  const base =
    candles.slice();


  /*
    Build current forming candle.
  */

  const live =
    buildFormingCandle(
      base,
      data
    );


  formingCandle =
    live;


  /*
    Remove any API candle that
    has the same timestamp as
    the forming candle.

    Then put forming candle last.
  */

  let displayCandles =
    base.filter(
      candle =>
        !live ||
        candle.time !==
        live.time
    );


  if(live){

    displayCandles.push(
      live
    );
  }


  /*
    Sort again.
  */

  displayCandles.sort(
    (a,b) =>
      a.time - b.time
  );


  /*
    Keep the full dataset internally,
    but only show the newest
    15 candles on mobile/chart.
  */

  currentCandles =
    displayCandles;


  candleSeries.setData(
    displayCandles
  );


  /*
    Show only approximately
    15 candles.

    This is the important mobile
    readability change.
  */

  const total =
    displayCandles.length;


  const from =
    Math.max(
      0,
      total -
      VISIBLE_BARS
    );


  const to =
    total +
    1;


  try{

    chart
      .timeScale()
      .setVisibleLogicalRange({

        from,

        to
      });

  }catch(error){

    /*
      Fallback if the chart is not
      ready yet.
    */

    try{

      chart
        .timeScale()
        .fitContent();

    }catch(e){

      console.warn(
        "Chart range error:",
        e
      );
    }
  }


  /*
    Position timer after
    chart rendering.
  */

  requestAnimationFrame(
    positionFormingTimer
  );
}


/* =========================================================
   LOAD MARKET
   ========================================================= */

async function loadMarket(){

  /*
    Prevent overlapping API requests.
  */

  if(isLoading){

    return;
  }


  isLoading = true;


  try{

    statusElement.textContent =
      "Updating...";


    const response =
      await fetch(
        API_URL,
        {

          cache:"no-store",

          headers:{

            "Cache-Control":
              "no-cache",

            "Pragma":
              "no-cache"
          }
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    lastApiData =
      data;


    /*
      Update market name
      if API supplies one.
    */

    const apiSymbol =
      data?.symbol ??
      data?.market?.symbol ??
      SYMBOL;


    if(
      apiSymbol
    ){

      marketNameElement.textContent =
        apiSymbol;
    }


    /*
      Support several API formats.
    */

    let rawCandles = [];


    if(
      Array.isArray(data)
    ){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;
    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(
      !candles.length
    ){

      throw new Error(
        "No valid candle data"
      );
    }


    /*
      Keep analysis separate from
      the visual forming candle.
    */

    let closedCandles =
      candles.slice();


    const currentMinute =
      getCurrentMinuteTimestamp();


    /*
      If API already contains the
      current minute candle, remove
      it from indicator calculations.
    */

    if(
      closedCandles.length &&
      closedCandles[
        closedCandles.length - 1
      ].time ===
      currentMinute
    ){

      closedCandles =
        closedCandles.slice(
          0,
          -1
        );
    }


    /*
      We need at least 35 candles
      for the current indicator engine.
    */

    analysisCandles =
      closedCandles.length >= 35

        ? closedCandles

        : candles;


    /*
      Render chart.
    */

    renderChart(
      candles,
      data
    );


    /* =====================================================
       PRICE
       ===================================================== */

    const lastBase =
      candles[
        candles.length - 1
      ];


    let displayPrice =
      Number(
        data?.market?.latestPrice
      );


    if(
      !Number.isFinite(
        displayPrice
      )
    ){

      displayPrice =
        formingCandle
          ? formingCandle.close
          : lastBase.close;
    }


    /*
      Determine decimal places.
    */

    const decimals =
      displayPrice < 1
        ? 5
        : 5;


    const priceText =
      displayPrice.toFixed(
        decimals
      );


    priceElement.textContent =
      priceText;


    lastPriceElement.textContent =
      priceText;


    candleCountElement.textContent =
      candles.length;


    /* =====================================================
       SIGNAL
       ===================================================== */

    const result =
      calculateSignal(
        analysisCandles
      );


    setSignalUI(
      result
    );


    /* =====================================================
       STATUS
       ===================================================== */

    let statusText =
      "Connected • Twelve Data";


    if(
      apiSymbol
    ){

      statusText +=
        " • " +
        apiSymbol;
    }


    statusElement.textContent =
      statusText;


    /* =====================================================
       UPDATE TIME
       ===================================================== */

    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();


    /*
      Make sure timer is visible
      immediately after API update.
    */

    updateFormingCandleTimer();


  }catch(error){

    console.error(
      "Finorix error:",
      error
    );


    /*
      IMPORTANT:
      Do NOT wipe the existing
      dashboard values just because
      one API refresh failed.

      This prevents the dashboard
      from appearing completely empty
      during a temporary API error.
    */

    statusElement.textContent =
      "Connection retrying...";


    /*
      Keep existing signal,
      confidence, chart and
      price on screen.
    */

    updateFormingCandleTimer();


  }finally{

    isLoading = false;
  }
}


/* =========================================================
   RESPONSIVE CHART
   ========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;


  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height
    });


    /*
      Recalculate candle timer
      position after resize.
    */

    requestAnimationFrame(
      positionFormingTimer
    );
  }
}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   CHART VISIBLE RANGE CHANGE
   ========================================================= */

chart
  .timeScale()
  .subscribeVisibleLogicalRangeChange(
    () => {

      requestAnimationFrame(
        positionFormingTimer
      );
    }
  );


/* =========================================================
   INITIAL LOAD
   ========================================================= */

loadMarket();


/* =========================================================
   API LIVE REFRESH
   ========================================================= */

setInterval(
  loadMarket,
  REFRESH_MS
);


/* =========================================================
   ONE-SECOND CANDLE CLOCK
   ========================================================= */

/*
  This timer is independent of API refresh.

  Therefore:

  API refresh = every 15 seconds

  Candle clock = every 1 second

  The countdown will NOT jump back
  whenever the API refreshes.
*/

updateFormingCandleTimer();


setInterval(
  updateFormingCandleTimer,
  1000
);


/* =========================================================
   FINAL INITIAL POSITION
   ========================================================= */

window.addEventListener(
  "load",
  () => {

    resizeChart();

    setTimeout(
      positionFormingTimer,
      300
    );

    setTimeout(
      positionFormingTimer,
      1000
    );
  }
);

</script>
