<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finorix Pro - Real Live Growth Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e14; color: white; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .finorix-widget {
            background: #121824;
            border: 1px solid #2a3447;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
            border-radius: 14px;
            width: 100%;
            max-width: 330px;
        }
        .chart-container {
            background: #070a10;
            border: 1px solid #1e2636;
            border-radius: 8px;
            height: 150px;
            position: relative;
            overflow: hidden;
        }
        .candle-green { background: #0faf59; box-shadow: 0 0 6px rgba(15,175,89,0.5); }
        .candle-red { background: #ff4757; box-shadow: 0 0 6px rgba(255,71,87,0.5); }
        .grid-line {
            position: absolute; left: 0; right: 0; height: 1px;
            border-top: 1px dashed rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen p-3">

    <div class="finorix-widget p-3.5 space-y-3">
        
        <!-- Header -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-2.5">
            <div class="flex items-center space-x-1.5">
                <span class="bg-purple-600 text-[10px] font-black px-2 py-0.5 rounded text-white tracking-wider">FINORIX</span>
                <span class="text-[8px] text-gray-400 font-semibold">RAPI SOFTWARE</span>
            </div>
            <div class="flex items-center space-x-1 bg-black/50 px-2 py-0.5 rounded border border-gray-800">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                <span class="text-[8px] text-green-400 font-bold">Autoconnect</span>
            </div>
        </div>

        <!-- Pair Selector -->
        <div class="bg-black/60 border border-gray-800 rounded-lg p-2.5 flex justify-between items-center cursor-pointer hover:border-purple-500 transition-all">
            <div class="flex items-center space-x-2">
                <span class="text-sm">📈</span>
                <div>
                    <p class="text-[11px] font-bold text-gray-100">EUR/NZD (OTC) 1m</p>
                    <p class="text-[8px] text-gray-400">763.5487.8685</p>
                </div>
            </div>
            <span class="text-gray-400 text-xs">▼</span>
        </div>

        <!-- Chart Screen with Real Growing Candles & Wicks -->
        <div class="chart-container flex items-center justify-between px-2.5">
            <div class="grid-line" style="top: 25%;"></div>
            <div class="grid-line" style="top: 50%;"></div>
            <div class="grid-line" style="top: 75%;"></div>
            
            <!-- Past Stable Candles -->
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:6px;" class="w-[1px] bg-red-500"></div><div class="candle-red w-2 h-10 rounded-sm"></div><div style="height:5px;" class="w-[1px] bg-red-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:4px;" class="w-[1px] bg-green-500"></div><div class="candle-green w-2 h-14 rounded-sm"></div><div style="height:7px;" class="w-[1px] bg-green-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:8px;" class="w-[1px] bg-red-500"></div><div class="candle-red w-2 h-8 rounded-sm"></div><div style="height:4px;" class="w-[1px] bg-red-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:5px;" class="w-[1px] bg-green-500"></div><div class="candle-green w-2 h-16 rounded-sm"></div><div style="height:6px;" class="w-[1px] bg-green-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:3px;" class="w-[1px] bg-red-500"></div><div class="candle-red w-2 h-12 rounded-sm"></div><div style="height:5px;" class="w-[1px] bg-red-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:6px;" class="w-[1px] bg-green-500"></div><div class="candle-green w-2 h-18 rounded-sm"></div><div style="height:3px;" class="w-[1px] bg-green-500"></div></div>
            <div class="flex flex-col items-center justify-center h-full w-3.5"><div style="height:4px;" class="w-[1px] bg-red-500"></div><div class="candle-red w-2 h-10 rounded-sm"></div><div style="height:6px;" class="w-[1px] bg-red-500"></div></div>

            <!-- LIVE GROWING CANDLE (The Last Active One) -->
            <div class="flex flex-col items-center justify-center h-full w-3.5">
                <div id="liveTopWick" style="height: 6px;" class="w-[1px] bg-green-500 transition-all duration-300"></div>
                <div id="liveBody" class="candle-green w-2 h-12 rounded-sm transition-all duration-300"></div>
                <div id="liveBottomWick" style="height: 4px;" class="w-[1px] bg-green-500 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Bottom Panel -->
        <div class="grid grid-cols-2 gap-2.5 pt-1">
            <div class="bg-black/60 border border-gray-800 p-2 rounded-lg text-center">
                <span class="text-[8px] text-gray-400 block tracking-wider">PENDING TRADE</span>
                <span class="text-xs font-bold text-blue-400 font-mono">300 $</span>
            </div>
            <div class="bg-black/60 border border-gray-800 p-2 rounded-lg text-center">
                <span class="text-[8px] text-gray-400 block tracking-wider">SIGNAL STATUS</span>
                <span id="signalText" class="text-xs font-black text-green-400 tracking-wide">NEXT UP</span>
            </div>
        </div>

    </div>

    <script>
        // Live Candle Formation Simulation (Wicks and Body growing naturally like real market)
        setInterval(() => {
            const body = document.getElementById('liveBody');
            const topWick = document.getElementById('liveTopWick');
            const bottomWick = document.getElementById('liveBottomWick');

            if(body && topWick && bottomWick) {
                // Randomly decide if current live candle is Green or Red
                const isGreen = Math.random() > 0.45;
                
                // Random heights for body and wicks simulating live price action
                const bodyHeight = Math.floor(Math.random() * 20) + 10; // 10px to 30px
                const topWickHeight = Math.floor(Math.random() * 12) + 2;   // 2px to 14px
                const bottomWickHeight = Math.floor(Math.random() * 12) + 2; // 2px to 14px

                // Apply styles based on trend
                if(isGreen) {
                    body.className = "candle-green w-2 rounded-sm transition-all duration-300";
                    topWick.className = "w-[1px] bg-green-500 transition-all duration-300";
                    bottomWick.className = "w-[1px] bg-green-500 transition-all duration-300";
                } else {
                    body.className = "candle-red w-2 rounded-sm transition-all duration-300";
                    topWick.className = "w-[1px] bg-red-500 transition-all duration-300";
                    bottomWick.className = "w-[1px] bg-red-500 transition-all duration-300";
                }

                body.style.height = bodyHeight + 'px';
                topWick.style.height = topWickHeight + 'px';
                bottomWick.style.height = bottomWickHeight + 'px';
            }
        }, 1200); // Every 1.2 seconds the live candle updates and grows smoothly

        // Signal Status Switcher
        setInterval(() => {
            const sig = document.getElementById('signalText');
            if(Math.random() > 0.5) {
                sig.textContent = "NEXT UP";
                sig.className = "text-xs font-black text-green-400 tracking-wide";
            } else {
                sig.textContent = "NEXT DOWN";
                sig.className = "text-xs font-black text-red-400 tracking-wide";
            }
        }, 4000);
    </script>
</body>
</html>
