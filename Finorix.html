<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Finorix AI Market Pro</title>

  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #05070d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 8px;
    }

    .app {
      width: 100%;
      max-width: 950px;
    }

    .header {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 18px 18px 0 0;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 21px;
      font-weight: 700;
    }

    .market {
      margin-top: 7px;
      font-size: 14px;
      color: #00e6a0;
    }

    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background: #00e6a0;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 10px #00e6a0;
    }

    .timeframe {
      background: #182343;
      padding: 9px 13px;
      border-radius: 10px;
      font-weight: bold;
      white-space: nowrap;
    }

    .chart-box {
      position: relative;
      height: 500px;
      background: #080c17;
      border-left: 1px solid #28365e;
      border-right: 1px solid #28365e;
      overflow: hidden;
    }

    #chart {
      width: 100%;
      height: 100%;
    }

    .advance-line {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 17%;
      border-left: 2px dashed rgba(255, 255, 255, 0.7);
      pointer-events: none;
      z-index: 3;
    }

    .advance-label {
      position: absolute;
      top: 15px;
      right: calc(17% - 35px);
      font-size: 13px;
      color: white;
      font-weight: bold;
      pointer-events: none;
      z-index: 3;
    }

    .price {
      position: absolute;
      right: 8px;
      top: 45%;
      background: #168cff;
      padding: 7px 11px;
      border-radius: 7px;
      font-weight: bold;
      pointer-events: none;
      z-index: 4;
    }

    .status {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      z-index: 5;
    }

    .status.ok {
      color: #00e6a0;
    }

    .status.error {
      color: #ff6b6b;
    }

    .bottom {
      background: linear-gradient(135deg, #10182c, #080b15);
      border: 1px solid #28365e;
      border-radius: 0 0 18px 18px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .signal-title,
    .confidence-title {
      font-size: 12px;
      color: #9ba4b7;
    }

    .signal {
      margin-top: 5px;
      color: #00e6a0;
      font-size: 23px;
      font-weight: bold;
    }

    .signal.down {
      color: #ff4d6d;
    }

    .signal.wait {
      color: #ffd21c;
    }

    .confidence {
      margin-top: 5px;
      color: #ffd21c;
      font-size: 23px;
      font-weight: bold;
    }

    .info {
      background: #080c17;
      border: 1px solid #28365e;
      border-top: none;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: #aeb8cc;
    }

    .indicator {
      white-space: nowrap;
    }

    .indicator strong {
      color: #ffffff;
    }

    @media (max-width: 600px) {
      body {
        padding: 5px;
      }

      .header {
        padding: 13px;
      }

      .title {
        font-size: 17px;
      }

      .market {
        font-size: 12px;
      }

      .timeframe {
        font-size: 12px;
        padding: 8px 10px;
      }

      .chart-box {
        height: 430px;
      }

      .bottom {
        padding: 14px;
      }

      .signal,
      .confidence {
        font-size: 20px;
      }

      .info {
        overflow-x: auto;
        justify-content: flex-start;
      }
    }
  </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

      <div>
        <div class="title">
          Finorix AI Market Pro
        </div>

        <div class="market">
          <span class="live-dot"></span>
          <span id="marketName">EUR/USD</span>
          <strong id="liveText">CONNECTING...</strong>
        </div>
      </div>

      <div class="timeframe">
        1min
      </div>

    </div>


    <!-- CHART -->
    <div class="chart-box">

      <div id="chart"></div>

      <div
        class="status"
        id="status"
      >
