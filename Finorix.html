<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finorix Pro - Live Market Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: white; font-family: sans-serif; }
        .finorix-card { background: #0b132b; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        .candle-green { background: #0faf59; box-shadow: 0 0 6px rgba(15, 175, 89, 0.5); }
        .candle-red { background: #ff4757; box-shadow: 0 0 6px rgba(255, 71, 87, 0.5); }
        .chart-box {
            position: relative;
            background: #02040a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            height: 150px;
            overflow: hidden;
        }
        .grid-line {
            position: absolute; left: 0; right: 0; height: 1px;
            border-top: 1px dashed rgba(255, 255, 255, 0.05);
            pointer-events: none;
        }
        .candles-flex {
            position: absolute; inset: 0;
            display: flex; align-items: flex-end; justify-content: space-evenly;
            padding: 4px 2px; z-index: 2;
        }
        .price-tag {
            position: absolute; right: 6px;
            background: #0984e3; color: white; font-size: 8px; 
            padding: 1px 4px; border-radius: 2px; font-family: monospace; z-index: 10;
        }
    </style>
</head>
<body class="p-3 flex justify-center items-center min-h-screen">

    <!-- Finorix Pro Floating Mini Widget -->
    <div class="w-full max-w-xs finorix-card rounded-xl p-3 space-y-2.5">
        
        <!-- Header & Live Status -->
        <div class="flex justify-between items-center bg-black/60 p-2 rounded-lg border border-gray-800">
            <div class="flex items-center space-x-1.5">
                <span class="bg-purple-600 text-[8px] font-black px-1.5 py-0.5 rounded text-white uppercase">Finorix Pro</span>
                <span class="text-[9px] text-gray-300 font-bold" id="activePair">USD/JPY (REAL)</span>
            </div>
            <div id="countdownTimer" class="text-xs font-mono font-black text-yellow-400 bg-black px-2 py-0.5 rounded border border-yellow-500/30">00:30</div>
        </div>

        <!-- Mini Chart Area -->
        <div class="chart-box">
            <div class="grid-line" style="top: 33%;"></div>
            <div class="grid-line" style="top: 66%;"></div>
            <div id="livePriceTag" class="price-tag" style="top: 45%;">148.500</div>
            <div id="candlesContainer" class="candles-flex"></div>
        </div>

        <!-- Prediction & MTG Panel -->
        <div class="grid grid-cols-2 gap-2 text-center text-[9px]">
            <div class="bg-black/70 p-2 rounded border border-gray-800">
                <span class="text-[7px] text-gray-400 block mb-0.5">PREDICTION SIGNAL</span>
                <span id="predSignal" class="font-black text-green-400 text-[10px]">NEXT UP (GREEN)</span>
            </div>
            <div class="bg-black/70 p-2 rounded border border-gray-800">
                <span class="text-[7px] text-gray-400 block mb-0.5">MARTINGALE (MTG)</span>
                <span id="mtgStatus" class="font-bold text-yellow-400 text-[10px]">SAFE (1X)</span>
            </div>
        </div>

        <!-- Quick Switcher for Real Markets -->
        <div class="flex justify-between items-center pt-1">
            <select id="marketPairSelect" onchange="changeMarketPair()" class="w-full bg-black border border-gray-700 text-gray-300 text-[10px] p-1.5 rounded focus:outline-none focus:border-purple-500">
                <option>USD/JPY (REAL)</option>
                <option>EUR/USD (REAL)</option>
                <option>GBP/USD (REAL)</option>
                <option>AUD/USD (REAL)</option>
            </select>
        </div>

    </div>

    <script>
        let candles = [];
        let basePrice = 148.500;
        let counter = 30;

        function changeMarketPair() {
            const selected = document.getElementById('marketPairSelect').value;
            document.getElementById('activePair').textContent = selected;
            initCandles();
        }

        function initCandles() {
            candles = [];
            let val = 50;
            let trend = 1;
            for (let i = 0; i < 14; i++) {
                if (Math.random() > 0.5) trend *= -1;
                val += trend * (Math.floor(Math.random() * 10) + 4);
                val = Math.max(20, Math.min(110, val));
                candles.push({
                    isGreen: trend > 0 ? Math.random() > 0.25 : Math.random() > 0.65,
                    height: val,
                    wTop: Math.floor(Math.random() * 8) + 2,
                    wBot: Math.floor(Math.random() * 8) + 2
                });
            }
            renderCandles();
        }

        function renderCandles() {
            const container = document.getElementById('candlesContainer');
            container.innerHTML = '';
            candles.forEach(c => {
                const wrap = document.createElement('div');
                wrap.className = "flex flex-col items-center justify-center h-full";
                wrap.style.width = "14px";

                const topW = document.createElement('div');
                topW.style.width = "1px";
                topW.style.height = c.wTop + 'px';
                topW.style.backgroundColor = c.isGreen ? '#0faf59' : '#ff4757';

                const body = document.createElement('div');
                body.className = c.isGreen ? 'candle-green' : 'candle-red';
                body.style.width = "7px";
                body.style.height = c.height + 'px';
                body.style.borderRadius = "1px";

                const botW = document.createElement('div');
                botW.style.width = "1px";
                botW.style.height = c.wBot + 'px';
                botW.style.backgroundColor = c.isGreen ? '#0faf59' : '#ff4757';

                wrap.appendChild(topW);
                wrap.appendChild(body);
                wrap.appendChild(botW);
                container.appendChild(wrap);
            });
        }

        // Real-Time Loop
        setInterval(() => {
            counter--;
            if (counter < 0) counter = 59;

            let m = Math.floor(counter / 60);
            let s = counter % 60;
            document.getElementById('countdownTimer').textContent = `0${m}:${s < 10 ? '0' + s : s}`;

            let lastC = candles[candles.length - 1];
            let predEl = document.getElementById('predSignal');
            let mtgEl = document.getElementById('mtgStatus');

            basePrice += (Math.random() - 0.48) * 0.005;
            let priceTag = document.getElementById('livePriceTag');
            priceTag.textContent = basePrice.toFixed(3);
            priceTag.style.top = `${Math.max(10, Math.min(85, 50 - (lastC.height - 50) * 0.4))}%`;

            if (counter > 30) {
                predEl.textContent = "ANALYZING MARKET...";
                predEl.className = "font-black text-gray-300 text-[9px]";
                mtgEl.textContent = "SAFE (1X)";
                
                // Live candle body pulsing
                lastC.height = Math.max(20, Math.min(110, lastC.height + (Math.random() - 0.48) * 3));
            } else {
                predEl.textContent = lastC.isGreen ? "NEXT UP (GREEN)" : "NEXT DOWN (RED)";
                predEl.className = `font-black ${lastC.isGreen ? 'text-green-400' : 'text-red-400'} text-[9px]`;
                
                if (counter > 15) {
                    mtgEl.textContent = "SAFE (1X)";
                } else {
                    mtgEl.textContent = "STEP-1 (2.3X)";
                }
            }

            renderCandles();

            if (counter === 59) {
                candles.shift();
                let prevC = candles[candles.length - 1];
                let newH = Math.max(25, Math.min(105, prevC.height + (Math.random() * 28 - 14)));
                candles.push({
                    isGreen: Math.random() > 0.44,
                    height: newH,
                    wTop: Math.floor(Math.random() * 8) + 2,
                    wBot: Math.floor(Math.random() * 8) + 2
                });
            }
        }, 1000);

        initCandles();
    </script>
</body>
</html>
