<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Finorix AI Market Pro</title>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#05070d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:8px;
}

.app{
  width:100%;
  max-width:950px;
  margin:0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  background:linear-gradient(135deg,#10182c,#080b15);
  border:1px solid #28365e;
  border-radius:18px 18px 0 0;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.title{
  font-size:20px;
  font-weight:700;
}

.market-row{
  margin-top:8px;
  display:flex;
  align-items:center;
  gap:7px;
}

.live-dot{
  display:inline-block;
  width:9px;
  height:9px;
  background:#00e6a0;
  border-radius:50%;
  box-shadow:0 0 10px #00e6a0;
  flex-shrink:0;
}

.market-select{
  background:#071326;
  color:#00e6a0;
  border:1px solid #1d4760;
  border-radius:8px;
  padding:6px 28px 6px 8px;
  font-size:14px;
  font-weight:bold;
  outline:none;
  min-width:130px;
}

.market-select option{
  background:#080c17;
  color:#fff;
}

.live-text{
  color:#00e6a0;
  font-size:13px;
  font-weight:bold;
}

.header-controls{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
}

.timeframe{
  background:#182343;
  padding:11px 15px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap;
}

/* =========================================================
   CHART
========================================================= */

.chart-box{
  position:relative;
  width:100%;
  height:480px;
  background:#080c17;
  border-left:1px solid #28365e;
  border-right:1px solid #28365e;
  overflow:hidden;
}

#chart{
  width:100%;
  height:100%;
}

.status{
  position:absolute;
  top:10px;
  left:10px;
  z-index:10;
  background:rgba(0,0,0,.70);
  padding:8px 11px;
  border-radius:8px;
  font-size:12px;
}

/* =========================================================
   ADVANCE LINE
========================================================= */

.advance-line{
  position:absolute;
  top:0;
  bottom:0;
  right:17%;
  border-left:2px dashed rgba(255,255,255,.65);
  pointer-events:none;
  z-index:4;
}

.advance-label{
  position:absolute;
  top:20px;
  right:calc(17% - 38px);
  font-size:13px;
  font-weight:bold;
  color:#fff;
  z-index:4;
}

/* =========================================================
   CANDLE TIMER
========================================================= */

.candle-timer{
  position:absolute;

  right:17%;
  bottom:48px;

  transform:translateX(50%);

  min-width:190px;

  padding:9px 14px;

  background:rgba(5,9,20,.92);

  border:1px solid #34446d;

  border-radius:12px;

  text-align:center;

  z-index:20;

  pointer-events:none;

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);
}

.timer-title{
  font-size:11px;
  color:#aeb8cc;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.timer-value{
  margin-top:3px;
  color:#00e6a0;
  font-size:26px;
  font-weight:800;
  line-height:1;
}

.timer-candle{
  margin-top:5px;
  font-size:11px;
  color:#8f99ae;
}

.timer-live{
  color:#00e6a0;
}

/* =========================================================
   PRICE
========================================================= */

.price{
  position:absolute;
  right:7px;
  top:45%;

  background:#168cff;

  padding:7px 10px;

  border-radius:7px;

  font-weight:bold;
  font-size:13px;

  z-index:12;
}

/* =========================================================
   BOTTOM SIGNAL
========================================================= */

.bottom{
  background:linear-gradient(135deg,#10182c,#080b15);

  border:1px solid #28365e;

  padding:17px;

  display:flex;

  justify-content:space-between;
  align-items:center;
}

.signal-title,
.confidence-title{
  font-size:12px;
  color:#9ba4b7;
}

.signal{
  margin-top:5px;
  font-size:28px;
  font-weight:bold;
}

.confidence{
  margin-top:5px;
  color:#ffd21c;
  font-size:27px;
  font-weight:bold;
}

/* =========================================================
   ANALYSIS
========================================================= */

.analysis{
  background:linear-gradient(135deg,#10182c,#080b15);

  border:1px solid #28365e;

  border-radius:0 0 18px 18px;

  padding:15px;
}

.analysis-title{
  font-size:15px;
  color:#aeb8cc;
  margin-bottom:12px;
}

.analysis-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  border:1px solid #263454;
  background:#080c19;
  border-radius:12px;
  padding:13px 8px;
  text-align:center;
}

.card-title{
  font-size:11px;
  color:#8f99ae;
}

.card-value{
  margin-top:7px;
  font-size:16px;
  font-weight:bold;
}

/* =========================================================
   EXTRA INFO
========================================================= */

.info{
  margin-top:10px;

  display:grid;

  grid-template-columns:repeat(2,1fr);

  gap:10px;
}

.info-card{
  background:#080c19;

  border:1px solid #263454;

  border-radius:12px;

  padding:12px;
}

.info-label{
  color:#8994aa;
  font-size:11px;
}

.info-value{
  margin-top:5px;
  font-size:14px;
  font-weight:bold;
}

/* =========================================================
   COLORS
========================================================= */

.up{
  color:#00e6a0 !important;
}

.down{
  color:#ff536d !important;
}

.neutral{
  color:#ffd21c !important;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  body{
    padding:0;
  }

  .app{
    max-width:none;
  }

  .header{
    border-radius:0;
    padding:14px;
  }

  .title{
    font-size:18px;
  }

  .market-select{
    font-size:13px;
    min-width:120px;
  }

  .live-text{
    font-size:12px;
  }

  .timeframe{
    padding:10px 13px;
    font-size:13px;
  }

  .chart-box{
    height:470px;
    border-left:0;
    border-right:0;
  }

  .bottom{
    padding:15px;
  }

  .analysis{
    border-radius:0;
  }

  .analysis-grid{
    gap:7px;
  }

  .card{
    padding:11px 5px;
  }

  .card-value{
    font-size:14px;
  }

  .info{
    gap:7px;
  }

  .candle-timer{
    right:17%;
    bottom:45px;
    min-width:155px;
    padding:8px 10px;
  }

  .timer-value{
    font-size:23px;
  }
}

@media(max-width:380px){

  .chart-box{
    height:430px;
  }

  .title{
    font-size:16px;
  }

  .confidence,
  .signal{
    font-size:24px;
  }

  .candle-timer{
    min-width:140px;
    right:16%;
  }

  .timer-value{
    font-size:21px;
  }
}

</style>

<script>

/* =========================================================
   FINORIX AI MARKET PRO
   UPDATED FRONTEND ENGINE

   FEATURES:
   1. Dashboard market selector
   2. Dynamic market API
   3. Correct 1-minute countdown
   4. Countdown positioned at candle base
   5. Live price polling
   6. Developing candle
   7. Historical candle analysis remains separate
========================================================= */


/* =========================================================
   SETTINGS
========================================================= */

const DEFAULT_SYMBOL = "EUR/USD";

const INTERVAL = "1min";

const MARKET_REFRESH_MS = 15000;

/*
  Latest-price polling.

  10 seconds keeps API usage reasonable
  while still updating the developing candle.
*/
const PRICE_REFRESH_MS = 10000;


/* =========================================================
   MARKET STATE
========================================================= */

let selectedSymbol =
  localStorage.getItem("finorix_symbol") ||
  DEFAULT_SYMBOL;

let currentCandles = [];

let currentLiveCandle = null;

let currentLiveMinute = null;

let marketVersion = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const chartElement =
  document.getElementById("chart");

const statusElement =
  document.getElementById("status");

const priceElement =
  document.getElementById("price");

const signalElement =
  document.getElementById("signal");

const confidenceElement =
  document.getElementById("confidence");

const rsiElement =
  document.getElementById("rsi");

const emaElement =
  document.getElementById("ema");

const macdElement =
  document.getElementById("macd");

const lastPriceElement =
  document.getElementById("lastPrice");

const nextCandleElement =
  document.getElementById("nextCandle");

const candleCountElement =
  document.getElementById("candleCount");

const updateTimeElement =
  document.getElementById("updateTime");

const marketSelect =
  document.getElementById("marketSelect");

const timerValueElement =
  document.getElementById("timerValue");

const timerCandleElement =
  document.getElementById("timerCandle");


/* =========================================================
   MARKET SELECT INITIALIZATION
========================================================= */

const availableOption =
  Array.from(
    marketSelect.options
  ).some(
    option =>
      option.value === selectedSymbol
  );

if(!availableOption){

  selectedSymbol =
    DEFAULT_SYMBOL;
}

marketSelect.value =
  selectedSymbol;


/* =========================================================
   API URL
========================================================= */

function getMarketAPI(){

  return (
    "/api/market?symbol=" +
    encodeURIComponent(selectedSymbol) +
    "&interval=" +
    encodeURIComponent(INTERVAL)
  );
}


function getPriceAPI(){

  return (
    "/api/price?symbol=" +
    encodeURIComponent(selectedSymbol)
  );
}


/* =========================================================
   CHART
========================================================= */

const chart =
  LightweightCharts.createChart(
    chartElement,
    {

      layout:{
        background:{
          color:"#080c17"
        },

        textColor:"#aeb8cc"
      },

      width:
        chartElement.clientWidth,

      height:
        chartElement.clientHeight,

      grid:{
        vertLines:{
          color:
            "rgba(255,255,255,0.06)"
        },

        horzLines:{
          color:
            "rgba(255,255,255,0.06)"
        }
      },

      rightPriceScale:{
        borderColor:"#263454",

        scaleMargins:{
          top:0.08,
          bottom:0.12
        }
      },

      timeScale:{
        borderColor:"#263454",

        timeVisible:true,

        secondsVisible:false,

        rightOffset:8,

        barSpacing:7,

        minBarSpacing:2
      },

      crosshair:{
        mode:
          LightweightCharts.CrosshairMode.Normal
      }
    }
  );


/* =========================================================
   HISTORICAL CANDLE SERIES
========================================================= */

const candleSeries =
  chart.addCandlestickSeries({

    upColor:"#00d6a0",

    downColor:"#ff536d",

    borderUpColor:"#00d6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00d6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true
  });


/* =========================================================
   LIVE / DEVELOPING CANDLE SERIES
========================================================= */

const liveCandleSeries =
  chart.addCandlestickSeries({

    upColor:"#00e6a0",

    downColor:"#ff536d",

    borderUpColor:"#00e6a0",

    borderDownColor:"#ff536d",

    wickUpColor:"#00e6a0",

    wickDownColor:"#ff536d",

    priceLineVisible:true,

    lastValueVisible:true
  });


/* =========================================================
   NORMALIZE TIME
========================================================= */

function normalizeTime(value){

  if(typeof value === "number"){

    if(value > 1000000000000){

      return Math.floor(
        value / 1000
      );
    }

    return Math.floor(value);
  }


  if(!value){

    return null;
  }


  let date =
    new Date(value);


  if(isNaN(date.getTime())){

    const text =
      String(value);

    const parts =
      text.split(":");


    if(parts.length >= 2){

      const today =
        new Date();

      today.setHours(
        Number(parts[0]) || 0,
        Number(parts[1]) || 0,
        Number(parts[2]) || 0,
        0
      );

      date = today;
    }
  }


  if(isNaN(date.getTime())){

    return null;
  }


  return Math.floor(
    date.getTime() / 1000
  );
}


/* =========================================================
   NORMALIZE CANDLES
========================================================= */

function normalizeCandles(raw){

  if(!Array.isArray(raw)){

    return [];
  }


  const result = [];


  for(const item of raw){

    if(!item){

      continue;
    }


    const time =
      normalizeTime(
        item.time ??
        item.datetime ??
        item.timestamp
      );


    const open =
      Number(item.open);

    const high =
      Number(item.high);

    const low =
      Number(item.low);

    const close =
      Number(item.close);


    if(
      !time ||
      !Number.isFinite(open) ||
      !Number.isFinite(high) ||
      !Number.isFinite(low) ||
      !Number.isFinite(close)
    ){

      continue;
    }


    result.push({

      time,

      open,

      high,

      low,

      close
    });
  }


  result.sort(
    (a,b) =>
      a.time - b.time
  );


  const unique = [];


  for(const candle of result){

    const last =
      unique[
        unique.length - 1
      ];


    if(
      last &&
      last.time === candle.time
    ){

      unique[
        unique.length - 1
      ] = candle;

    }else{

      unique.push(candle);
    }
  }


  return unique;
}


/* =========================================================
   EMA
========================================================= */

function calculateEMA(
  values,
  period
){

  if(values.length < period){

    return null;
  }


  const multiplier =
    2 / (period + 1);


  let ema = 0;


  for(
    let i = 0;
    i < period;
    i++
  ){

    ema += values[i];
  }


  ema /= period;


  for(
    let i = period;
    i < values.length;
    i++
  ){

    ema =
      (
        values[i] - ema
      ) * multiplier + ema;
  }


  return ema;
}


/* =========================================================
   RSI
========================================================= */

function calculateRSI(
  values,
  period = 14
){

  if(values.length <= period){

    return null;
  }


  let gains = 0;

  let losses = 0;


  for(
    let i = 1;
    i <= period;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    if(change >= 0){

      gains += change;

    }else{

      losses +=
        Math.abs(change);
    }
  }


  let avgGain =
    gains / period;

  let avgLoss =
    losses / period;


  for(
    let i = period + 1;
    i < values.length;
    i++
  ){

    const change =
      values[i] -
      values[i - 1];


    const gain =
      Math.max(
        change,
        0
      );


    const loss =
      Math.max(
        -change,
        0
      );


    avgGain =
      (
        avgGain * (period - 1)
        + gain
      ) / period;


    avgLoss =
      (
        avgLoss * (period - 1)
        + loss
      ) / period;
  }


  if(avgLoss === 0){

    return 100;
  }


  const rs =
    avgGain / avgLoss;


  return (
    100 -
    100 / (1 + rs)
  );
}


/* =========================================================
   MACD
========================================================= */

function calculateMACD(values){

  if(values.length < 35){

    return {
      macd:null,
      signal:null,
      histogram:null
    };
  }


  const ema12 =
    calculateEMA(
      values,
      12
    );


  const ema26 =
    calculateEMA(
      values,
      26
    );


  if(
    ema12 === null ||
    ema26 === null
  ){

    return {
      macd:null,
      signal:null,
      histogram:null
    };
  }


  const macd =
    ema12 - ema26;


  const previousValues =
    values.slice(
      0,
      values.length - 1
    );


  let previousMACD = null;


  if(
    previousValues.length >= 35
  ){

    const p12 =
      calculateEMA(
        previousValues,
        12
      );


    const p26 =
      calculateEMA(
        previousValues,
        26
      );


    if(
      p12 !== null &&
      p26 !== null
    ){

      previousMACD =
        p12 - p26;
    }
  }


  const histogram =
    previousMACD === null
      ? 0
      : macd - previousMACD;


  return {

    macd,

    signal:
      previousMACD,

    histogram
  };
}


/* =========================================================
   SIGNAL ENGINE
========================================================= */

function calculateSignal(
  candles
){

  if(candles.length < 35){

    return {

      signal:"WAIT",

      confidence:0,

      rsi:null,

      emaTrend:"WAIT",

      macdTrend:"WAIT"
    };
  }


  const closes =
    candles.map(
      c => c.close
    );


  const last =
    closes[
      closes.length - 1
    ];


  const previous =
    closes[
      closes.length - 2
    ];


  const ema9 =
    calculateEMA(
      closes,
      9
    );


  const ema21 =
    calculateEMA(
      closes,
      21
    );


  const rsi =
    calculateRSI(
      closes,
      14
    );


  const macd =
    calculateMACD(
      closes
    );


  let score = 0;


  let emaTrend =
    "NEUTRAL";


  if(
    ema9 !== null &&
    ema21 !== null
  ){

    if(ema9 > ema21){

      emaTrend = "UP";

      score += 2;

    }else if(ema9 < ema21){

      emaTrend = "DOWN";

      score -= 2;
    }
  }


  if(rsi !== null){

    if(rsi < 30){

      score += 1;

    }else if(rsi > 70){

      score -= 1;

    }else if(rsi > 50){

      score += 0.5;

    }else{

      score -= 0.5;
    }
  }


  let macdTrend =
    "NEUTRAL";


  if(macd.macd !== null){

    if(macd.histogram > 0){

      macdTrend =
        "BULLISH";

      score += 2;

    }else if(macd.histogram < 0){

      macdTrend =
        "BEARISH";

      score -= 2;
    }
  }


  if(last > previous){

    score += 0.5;

  }else if(last < previous){

    score -= 0.5;
  }


  let signal =
    "WAIT";


  if(score >= 2){

    signal =
      "UP";

  }else if(score <= -2){

    signal =
      "DOWN";
  }


  let confidence =
    50 +
    Math.abs(score) * 8;


  confidence =
    Math.min(
      94,
      Math.max(
        50,
        Math.round(
          confidence
        )
      )
    );


  return {

    signal,

    confidence,

    rsi,

    emaTrend,

    macdTrend,

    ema9,

    ema21,

    macd:
      macd.macd
  };
}


/* =========================================================
   SIGNAL UI
========================================================= */

function setSignalUI(result){

  signalElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.signal === "UP"){

    signalElement.textContent =
      "UP";

    signalElement.classList.add(
      "up"
    );

  }else if(
    result.signal === "DOWN"
  ){

    signalElement.textContent =
      "DOWN";

    signalElement.classList.add(
      "down"
    );

  }else{

    signalElement.textContent =
      "WAIT";

    signalElement.classList.add(
      "neutral"
    );
  }


  confidenceElement.textContent =
    result.confidence
      ? result.confidence + "%"
      : "--%";


  rsiElement.textContent =
    result.rsi === null
      ? "--"
      : result.rsi.toFixed(1);


  rsiElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.rsi !== null){

    if(result.rsi > 70){

      rsiElement.classList.add(
        "down"
      );

    }else if(result.rsi < 30){

      rsiElement.classList.add(
        "up"
      );

    }else{

      rsiElement.classList.add(
        "neutral"
      );
    }
  }


  emaElement.textContent =
    result.emaTrend;


  emaElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(result.emaTrend === "UP"){

    emaElement.classList.add(
      "up"
    );

  }else if(
    result.emaTrend === "DOWN"
  ){

    emaElement.classList.add(
      "down"
    );

  }else{

    emaElement.classList.add(
      "neutral"
    );
  }


  macdElement.textContent =
    result.macdTrend;


  macdElement.classList.remove(
    "up",
    "down",
    "neutral"
  );


  if(
    result.macdTrend ===
    "BULLISH"
  ){

    macdElement.classList.add(
      "up"
    );

  }else if(
    result.macdTrend ===
    "BEARISH"
  ){

    macdElement.classList.add(
      "down"
    );

  }else{

    macdElement.classList.add(
      "neutral"
    );
  }


  nextCandleElement.textContent =
    result.signal;
}


/* =========================================================
   LOAD MARKET HISTORY
========================================================= */

async function loadMarket(){

  const requestVersion =
    marketVersion;


  try{

    statusElement.textContent =
      "Loading " +
      selectedSymbol +
      "...";


    const response =
      await fetch(
        getMarketAPI(),
        {
          cache:"no-store"
        }
      );


    if(
      requestVersion !==
      marketVersion
    ){

      return;
    }


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    let rawCandles = [];


    if(Array.isArray(data)){

      rawCandles =
        data;

    }else if(
      Array.isArray(
        data.candles
      )
    ){

      rawCandles =
        data.candles;

    }else if(
      data.data &&
      Array.isArray(
        data.data.candles
      )
    ){

      rawCandles =
        data.data.candles;
    }


    const candles =
      normalizeCandles(
        rawCandles
      );


    if(!candles.length){

      throw new Error(
        "No valid candle data"
      );
    }


    currentCandles =
      candles;


    /* -------------------------
       HISTORICAL CHART
    ------------------------- */

    candleSeries.setData(
      candles
    );


    /* -------------------------
       CLEAR OLD LIVE CANDLE
    ------------------------- */

    liveCandleSeries.setData([]);


    currentLiveCandle =
      null;

    currentLiveMinute =
      null;


    /*
      Only fit when loading a new
      market/history.
    */

    chart.timeScale()
      .fitContent();


    /* -------------------------
       PRICE
    ------------------------- */

    const last =
      candles[
        candles.length - 1
      ];


    const price =
      last.close;


    priceElement.textContent =
      price.toFixed(
        getPriceDecimals(
          price
        )
      );


    lastPriceElement.textContent =
      price.toFixed(
        getPriceDecimals(
          price
        )
      );


    candleCountElement.textContent =
      candles.length;


    /* -------------------------
       SIGNAL
    ------------------------- */

    const result =
      calculateSignal(
        candles
      );


    setSignalUI(
      result
    );


    /* -------------------------
       STATUS
    ------------------------- */

    statusElement.textContent =
      "Connected • Twelve Data • " +
      selectedSymbol;


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();

  }catch(error){

    console.error(
      "Finorix market error:",
      error
    );


    statusElement.textContent =
      "Market data error";

  }
}


/* =========================================================
   PRICE DECIMALS
========================================================= */

function getPriceDecimals(price){

  if(
    selectedSymbol ===
    "USD/JPY" ||
    selectedSymbol ===
    "EUR/JPY" ||
    selectedSymbol ===
    "GBP/JPY"
  ){

    return 3;
  }


  if(
    selectedSymbol ===
    "XAU/USD"
  ){

    return 2;
  }


  if(
    selectedSymbol ===
    "BTC/USD"
  ){

    return 2;
  }


  return 5;
}


/* =========================================================
   LIVE PRICE
========================================================= */

async function loadLivePrice(){

  const requestVersion =
    marketVersion;


  try{

    const response =
      await fetch(
        getPriceAPI(),
        {
          cache:"no-store"
        }
      );


    if(
      requestVersion !==
      marketVersion
    ){

      return;
    }


    if(!response.ok){

      throw new Error(
        "Price HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if(
      data.status !== "ok" ||
      !Number.isFinite(
        Number(data.price)
      )
    ){

      throw new Error(
        data.message ||
        "Invalid price"
      );
    }


    const price =
      Number(data.price);


    const timestamp =
      Number.isFinite(
        Number(data.timestamp)
      )
        ? Number(data.timestamp)
        : Math.floor(
            Date.now() / 1000
          );


    updateLiveCandle(
      price,
      timestamp
    );


    priceElement.textContent =
      price.toFixed(
        getPriceDecimals(
          price
        )
      );


    lastPriceElement.textContent =
      price.toFixed(
        getPriceDecimals(
          price
        )
      );


    updateTimeElement.textContent =
      new Date()
        .toLocaleTimeString();

  }catch(error){

    console.warn(
      "Live price error:",
      error
    );
  }
}


/* =========================================================
   DEVELOPING CANDLE
========================================================= */

function updateLiveCandle(
  price,
  timestamp
){

  const minuteStart =
    Math.floor(
      timestamp / 60
    ) * 60;


  /*
    New minute = new candle
  */

  if(
    currentLiveMinute ===
    null ||
    currentLiveMinute !==
    minuteStart
  ){

    currentLiveMinute =
      minuteStart;


    currentLiveCandle = {

      time:
        minuteStart,

      open:
        price,

      high:
        price,

      low:
        price,

      close:
        price
    };


  }else{

    currentLiveCandle.high =
      Math.max(
        currentLiveCandle.high,
        price
      );


    currentLiveCandle.low =
      Math.min(
        currentLiveCandle.low,
        price
      );


    currentLiveCandle.close =
      price;
  }


  /*
    Update the current forming
    candle only.

    Historical candles remain
    untouched for signal analysis.
  */

  liveCandleSeries.update(
    currentLiveCandle
  );
}


/* =========================================================
   1-MINUTE COUNTDOWN
========================================================= */

function updateCandleTimer(){

  const now =
    Date.now();


  const elapsed =
    now % 60000;


  const remaining =
    Math.ceil(
      (60000 - elapsed) /
      1000
    );


  const safeRemaining =
    Math.max(
      1,
      Math.min(
        60,
        remaining
      )
    );


  const minutes =
    Math.floor(
      safeRemaining / 60
    );


  const seconds =
    safeRemaining % 60;


  timerValueElement.textContent =
    String(minutes)
      .padStart(2,"0") +
    ":" +
    String(seconds)
      .padStart(2,"0");


  /*
    Next candle starts exactly
    at the next minute boundary.
  */

  const nextBoundary =
    now -
    (now % 60000) +
    60000;


  const nextDate =
    new Date(
      nextBoundary
    );


  const candleTime =
    nextDate.toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );


  timerCandleElement.textContent =
    "CANDLE " +
    candleTime;


  /*
    At the last few seconds,
    visually emphasize the timer.
  */

  if(safeRemaining <= 5){

    timerValueElement.style.color =
      "#ffd21c";

  }else{

    timerValueElement.style.color =
      "#00e6a0";
  }
}


/* =========================================================
   MARKET SELECT CHANGE
========================================================= */

marketSelect.addEventListener(
  "change",
  async function(){

    selectedSymbol =
      this.value;


    localStorage.setItem(
      "finorix_symbol",
      selectedSymbol
    );


    marketVersion++;


    /*
      Reset live candle
    */

    currentLiveCandle =
      null;

    currentLiveMinute =
      null;


    liveCandleSeries.setData([]);


    /*
      Reset UI
    */

    signalElement.textContent =
      "WAIT";

    signalElement.className =
      "signal neutral";


    confidenceElement.textContent =
      "--%";


    priceElement.textContent =
      "--";


    lastPriceElement.textContent =
      "--";


    candleCountElement.textContent =
      "0";


    statusElement.textContent =
      "Switching to " +
      selectedSymbol +
      "...";


    /*
      Load selected market
    */

    await loadMarket();


    /*
      Immediately try live price
    */

    await loadLivePrice();
  }
);


/* =========================================================
   RESPONSIVE CHART
========================================================= */

function resizeChart(){

  const width =
    chartElement.clientWidth;

  const height =
    chartElement.clientHeight;


  if(
    width > 0 &&
    height > 0
  ){

    chart.applyOptions({

      width,

      height
    });
  }
}


window.addEventListener(
  "resize",
  resizeChart
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadMarket();

loadLivePrice();


/* =========================================================
   MARKET HISTORY REFRESH
========================================================= */

setInterval(
  loadMarket,
  MARKET_REFRESH_MS
);


/* =========================================================
   LIVE PRICE REFRESH
========================================================= */

setInterval(
  loadLivePrice,
  PRICE_REFRESH_MS
);


/* =========================================================
   CANDLE TIMER
========================================================= */

updateCandleTimer();


setInterval(
  updateCandleTimer,
  250
);

</script>
